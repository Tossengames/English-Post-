<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Word Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Audiowide&family=Baloo+2:wght@600;800&family=Press+Start+2P&family=Caveat+Brush&family=Patrick+Hand&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--cw:100px;--ch:80px;--ff:"Fredoka","Baloo 2",ui-rounded,"Varela Round";--fb:"Noto Sans","PingFang SC","Hiragino Sans","Malgun Gothic","Noto Sans Devanagari","Noto Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--ff),var(--fb);
  background:var(--bg);user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;color:var(--ink);
  --stack:-.05em -.05em 0 var(--ol),.05em -.05em 0 var(--ol),-.05em .05em 0 var(--ol),.05em .05em 0 var(--ol),0 -.06em 0 var(--ol),0 .06em 0 var(--ol),-.06em 0 0 var(--ol),.06em 0 0 var(--ol);
}
#stage{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:55}
#deco{position:absolute;left:0;right:0;bottom:0;height:0;z-index:0;pointer-events:none}
#spokes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
#spokes path{fill:none;stroke:var(--spoke);stroke-width:var(--spoke-w);stroke-linecap:round;stroke-dasharray:var(--dash);filter:var(--spoke-f,none);opacity:0}

/* ---------- title ---------- */
#title{position:absolute;top:10px;left:0;right:0;text-align:center;z-index:30;pointer-events:none;line-height:1.15}
body.land #title{text-align:left;padding-left:18px}
#title b{display:inline-block;white-space:nowrap;font-family:var(--disp);font-weight:700;color:var(--tc);text-shadow:var(--stack),0 .1em 0 var(--ol)}
#title small{display:inline-block;white-space:nowrap;margin-top:5px;font-size:14px;font-weight:600;color:var(--tsc);background:var(--tsbg,transparent);padding:1px 10px;border-radius:99px}

/* ---------- cards ---------- */
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);z-index:5;pointer-events:none;rotate:0deg;transition:scale .2s}
.card.fly{z-index:15}
#roll{z-index:12}
.bob{width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.37s)}
@keyframes bob{0%,100%{translate:0 0;rotate:-1.3deg}50%{translate:0 calc(var(--amp)*-1);rotate:1.3deg}}
.inner{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;opacity:0;padding:0 4px;line-height:1.1}
.tag,.w,.p{display:inline-block;white-space:nowrap}
.w{font-weight:700;line-height:1.15}
.p{font-weight:500}
.card.speaking{scale:1.16;z-index:20}
.card.speaking .inner{filter:brightness(1.08) saturate(1.2)}

/* roll box = Mario-Kart style item box while spinning */
#roll .inner{opacity:1}
#roll .inner::before{content:'';position:absolute;inset:0;border-radius:inherit;opacity:0;z-index:0;background:linear-gradient(120deg,#ff4d6d,#ffb300,#3ddc84,#29b6f6,#a855f7,#ff4d6d);background-size:300% 300%;animation:shimmer 1.1s linear infinite}
#roll .inner>*:not(.q){position:relative;z-index:1}
#roll .spin::before{opacity:1}
#roll .spin{border-color:#fff !important;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 24px rgba(255,255,255,.95) !important;background-image:none}
#roll .spin::after{display:none}
#roll .spin .tag,#roll .spin .txt{display:none}
#roll .flag{display:none;font-size:calc(var(--ch)*.52);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#roll .spin .flag{display:block}
#roll .q{position:absolute;inset:0;display:none;place-items:center;font-style:normal;font-weight:800;font-size:calc(var(--ch)*.95);color:rgba(255,255,255,.5);z-index:0;font-family:var(--disp)}
#roll .spin .q{display:grid}
@keyframes shimmer{to{background-position:300% 0}}

/* ---------- center ---------- */
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;text-align:center;pointer-events:none;transition:scale .25s}
#center.speaking{scale:1.07}
#word{display:flex;justify-content:center;white-space:nowrap;line-height:1.1;font-family:var(--disp);font-weight:700}
.ch{display:inline-block;color:var(--lc);text-shadow:var(--stack),0 .1em 0 var(--ol)}
.w2{display:inline-block;animation:wave 1.9s ease-in-out infinite;animation-delay:calc(var(--k)*-.13s)}
@keyframes wave{0%,100%{translate:0 0}50%{translate:0 -.08em}}
.sp{display:inline-block;width:.28em}

/* ---------- Like / Follow badge ---------- */
#ctaPill{position:absolute;left:0;top:0;z-index:45;display:none;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-family:var(--disp);font-weight:700;font-size:20px;line-height:1;padding:.5em .9em;border-radius:99px;color:#111;background:#ffd400;border:3px solid #111;box-shadow:0 4px 0 #111;animation:pillw 1.1s ease-in-out infinite}
#ctaPill.plain{background:none;border:0;box-shadow:none;padding:.2em .3em;color:#ffd400;text-shadow:-.05em -.05em 0 #111,.05em -.05em 0 #111,-.05em .05em 0 #111,.05em .05em 0 #111,0 .1em 0 #111,.06em .14em 0 #111}
@keyframes pillw{0%,100%{rotate:-3deg;scale:1}50%{rotate:3deg;scale:1.07}}
body[data-theme=mario] #ctaPill{font-weight:400}

/* ---------- card inner layout + sentence rows ---------- */
.tag i{font-style:normal}
.txt{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
#stage.sent #word{flex-wrap:wrap;white-space:normal;gap:.08em .26em;line-height:1.12}
#stage.sent .inner{flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px 0 10px}
#stage.sent .tag{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:normal;text-align:center;line-height:1.05;padding:3px 2px;font-size:11px}
#stage.sent .tag .fl{font-size:28px;line-height:1}
#stage.sent .txt{flex:1;align-items:stretch}
#stage.sent .w,#stage.sent .p{display:block;white-space:normal;text-align:start}

/* ---------- UI ---------- */
#toast,#bar,#unclean{z-index:60}
#toast{position:absolute;bottom:68px;left:50%;translate:-50% 0;padding:6px 16px;border-radius:99px;background:var(--bar-bg);font-weight:700;font-size:15px;opacity:0;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px);box-shadow:var(--bar-sh)}
#hint{position:absolute;left:50%;bottom:68px;translate:-50% 0;font-weight:700;font-size:16px;color:var(--hint);z-index:30;pointer-events:none;animation:hint 1.4s ease-in-out infinite;white-space:nowrap;transition:opacity .4s}
@keyframes hint{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.06)}}
#bar{position:absolute;left:50%;bottom:14px;translate:-50% 0;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:99px;background:var(--bar-bg);backdrop-filter:blur(10px);box-shadow:var(--bar-sh);cursor:default;max-width:calc(100% - 12px)}
#themes{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;max-width:min(240px,calc(100vw - 196px));scroll-snap-type:x proximity}
#themes::-webkit-scrollbar{display:none}
.chip{appearance:none;border:0;background:transparent;font:inherit;font-size:21px;width:38px;height:38px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s;color:inherit;padding:0;scroll-snap-align:center}
.chip:hover{transform:scale(1.12)}
.chip:active{transform:scale(.88)}
.chip:focus-visible{outline:3px solid var(--rip);outline-offset:1px}
.chip.on{background:var(--chip-on);box-shadow:inset 0 0 0 2px var(--chip-ring)}
.sep{width:2px;height:22px;background:var(--chip-ring);opacity:.35;border-radius:2px;margin:0 2px;flex:0 0 auto}
.ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:5px solid var(--rip);z-index:30;pointer-events:none}
#unclean{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.5);font-size:16px;opacity:0;pointer-events:none;cursor:pointer}
body.clean #bar,body.clean #hint,body.clean #toast{display:none}
body.clean #unclean{opacity:.22;pointer-events:auto}
body.export #unclean{display:none}

/* ================= THEMES ================= */
/* 1 Candy */
body[data-theme=candy]{--bg:linear-gradient(160deg,#ffe3f1 0%,#dff3ff 55%,#fff4c2 100%);--disp:"Fredoka",ui-rounded,sans-serif;--ink:#3b2a50;--hint:#c0397b;--bar-bg:rgba(255,255,255,.8);--bar-sh:0 4px 0 rgba(255,93,143,.35);--chip-on:#ffe0ee;--chip-ring:#ff5d8f;--rip:#ff5d8f;--spoke:rgba(255,255,255,.95);--spoke-w:6;--dash:.001 .032;--amp:7px;--ol:#4a2a6a;--tc:#ff4f9a;--tsc:#7a3a8a}
body[data-theme=candy] .inner{background:#fff;border:4px solid var(--c);border-radius:26px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#000),0 14px 20px rgba(255,90,150,.18);color:#3b2a50}
body[data-theme=candy] .tag{background:var(--c);color:#fff;padding:0 9px;border-radius:99px;font-weight:600}
body[data-theme=candy] .p{color:color-mix(in srgb,var(--c) 70%,#000)}
/* 2 Neon */
body[data-theme=neon]{--bg:radial-gradient(ellipse at 50% 35%,#35127a 0%,#150a38 48%,#07031a 100%);--disp:"Audiowide","Fredoka",sans-serif;--ink:#fff;--hint:#c9bcff;--bar-bg:rgba(20,10,50,.75);--bar-sh:0 0 18px rgba(138,107,255,.55);--chip-on:rgba(138,107,255,.35);--chip-ring:#8a6bff;--rip:#3df2ff;--spoke:rgba(160,120,255,.6);--spoke-w:2;--dash:1;--spoke-f:drop-shadow(0 0 5px #a07bff);--amp:5px;--ol:#8a2be2;--tc:#fff;--tsc:#cbb8ff}
body[data-theme=neon] .inner{background:rgba(18,8,46,.8);border:2px solid var(--c);border-radius:16px;box-shadow:0 0 10px var(--c),0 0 26px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 35%,transparent);color:#fff}
body[data-theme=neon] .tag{color:var(--c);font-weight:600}
body[data-theme=neon] .w{text-shadow:0 0 8px var(--c)}
body[data-theme=neon] .p{color:color-mix(in srgb,var(--c) 55%,#fff)}
body[data-theme=neon] .ch{color:#fff;text-shadow:0 0 .08em var(--lc),0 0 .3em var(--lc),0 0 .65em var(--lc)}
body[data-theme=neon] #title b{text-shadow:0 0 .1em #fff,0 0 .4em #a855f7,0 0 .8em #a855f7}
/* 3 Sticker */
body[data-theme=sticker]{--bg:radial-gradient(rgba(0,0,0,.13) 2px,transparent 2.6px) 0 0/22px 22px,#ffd93b;--disp:"Lilita One","Fredoka",sans-serif;--ink:#111;--hint:#111;--bar-bg:#fff;--bar-sh:4px 4px 0 #111;--chip-on:#ffd93b;--chip-ring:#111;--rip:#111;--spoke:#111;--spoke-w:3;--dash:.022 .028;--amp:5px;--ol:#111;--tc:#fff;--tsc:#111}
body[data-theme=sticker] #bar,body[data-theme=mario] #bar,body[data-theme=comic] #bar{border:3px solid #111}
body[data-theme=sticker] .card,body[data-theme=doodle] .card{rotate:var(--rot)}
body[data-theme=sticker] #roll,body[data-theme=doodle] #roll{rotate:0deg}
body[data-theme=sticker] .inner{background:#fff;border:3px solid #111;border-radius:14px;box-shadow:5px 5px 0 #111;color:#111}
body[data-theme=sticker] .tag{background:var(--c);border:2px solid #111;border-radius:6px;padding:0 6px;font-weight:700;color:#111}
body[data-theme=sticker] .p{color:#555}
body[data-theme=sticker] #word{filter:drop-shadow(.05em .07em 0 #111)}
body[data-theme=sticker] .ch{text-shadow:none;-webkit-text-stroke:.11em #111;paint-order:stroke fill}
/* 4 Ocean */
body[data-theme=ocean]{--bg:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.55),transparent 52%),linear-gradient(180deg,#4fd8ff 0%,#1b8cff 45%,#0a2f86 100%);--disp:"Fredoka",ui-rounded,sans-serif;--ink:#fff;--hint:#e6faff;--bar-bg:rgba(255,255,255,.25);--bar-sh:0 6px 18px rgba(0,30,100,.35);--chip-on:rgba(255,255,255,.3);--chip-ring:#fff;--rip:#fff;--spoke:rgba(255,255,255,.4);--spoke-w:4;--dash:.003 .03;--amp:10px;--ol:#0b4fb8;--tc:#fff;--tsc:#fff}
body[data-theme=ocean] .inner{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),rgba(255,255,255,.17) 45%,rgba(255,255,255,.07));border:2px solid rgba(255,255,255,.7);border-radius:46px;box-shadow:inset 0 -10px 16px rgba(0,70,190,.28),inset 0 8px 14px rgba(255,255,255,.32),0 10px 24px rgba(0,25,90,.35);backdrop-filter:blur(5px);color:#fff;text-shadow:0 1px 3px rgba(0,40,120,.55)}
body[data-theme=ocean] .tag{color:#d9f6ff;font-weight:600}
body[data-theme=ocean] .p{color:#c4f1ff}
body[data-theme=ocean] #title small{text-shadow:0 1px 3px rgba(0,40,120,.6)}
/* 5 Jungle */
body[data-theme=jungle]{--bg:radial-gradient(ellipse at 50% 0%,#58c27d 0%,transparent 55%),linear-gradient(180deg,#1f7a4f,#0e3f2c 70%,#082a1d);--disp:"Baloo 2","Fredoka",sans-serif;--ink:#1c3a28;--hint:#e9ffd6;--bar-bg:rgba(255,244,214,.92);--bar-sh:0 4px 0 #06251a;--chip-on:#ffe29a;--chip-ring:#b8742a;--rip:#ffe66d;--spoke:rgba(190,255,200,.5);--spoke-w:3;--dash:.02 .03;--amp:8px;--ol:#06251a;--tc:#fff4d6;--tsc:#e9ffd6}
body[data-theme=jungle] .inner{background:#fff4d6;border:3px solid var(--c);border-radius:44px 10px 44px 10px;box-shadow:0 6px 0 #06251a,0 14px 20px rgba(0,0,0,.25);color:#1c3a28}
body[data-theme=jungle] .tag{color:color-mix(in srgb,var(--c) 60%,#000);font-weight:800}
body[data-theme=jungle] .p{color:#9a5a22}
/* 6 Super Plumber (Mario-style) */
body[data-theme=mario]{--bg:linear-gradient(180deg,#5c94fc 0%,#a6caff 100%);--disp:"Press Start 2P",monospace;--ink:#000;--hint:#fff;--bar-bg:#fff;--bar-sh:4px 4px 0 #000;--chip-on:#fcb800;--chip-ring:#000;--rip:#fff;--spoke:#fff;--spoke-w:4;--dash:.025 .03;--amp:6px;--ol:#000;--tc:#fff;--tsc:#fff;--tsbg:#000}
body[data-theme=mario] #deco{height:48px;border-top:4px solid #000;background:linear-gradient(transparent 21px,#000 21px 24px,transparent 24px) 0 0/100% 48px no-repeat,linear-gradient(90deg,#000 3px,transparent 3px) 0 0/48px 24px repeat-x,linear-gradient(90deg,#000 3px,transparent 3px) 24px 24px/48px 24px repeat-x,#d65a1c}
body[data-theme=mario] #deco::before{content:'';position:absolute;left:0;right:0;bottom:44px;height:120px;background:radial-gradient(ellipse 130px 100px at 18% 100%,#2cc02c 0 96%,transparent 98%),radial-gradient(ellipse 100px 70px at 40% 100%,#1fa31f 0 96%,transparent 98%),radial-gradient(ellipse 170px 120px at 84% 100%,#2cc02c 0 96%,transparent 98%)}
body[data-theme=mario] #word,body[data-theme=mario] #title b{font-weight:400}
body[data-theme=mario] #hint{text-shadow:2px 2px 0 #000}
body[data-theme=mario] .inner{background:#fff;border:4px solid #000;border-radius:4px;box-shadow:inset 0 0 0 4px var(--c),5px 5px 0 #000;color:#000}
body[data-theme=mario] .tag{background:#000;color:#fff;padding:0 6px;border-radius:2px;font-weight:700}
body[data-theme=mario] .p{color:#c8301c}
/* 7 Rainbow Road */
body[data-theme=rainbow]{--bg:radial-gradient(ellipse at 50% 110%,#5b2bd6 0%,transparent 60%),linear-gradient(#08042a,#1b0c55);--disp:"Fredoka",ui-rounded,sans-serif;--ink:#fff;--hint:#d6c6ff;--bar-bg:rgba(20,10,60,.78);--bar-sh:0 0 18px rgba(168,85,247,.6);--chip-on:rgba(168,85,247,.4);--chip-ring:#a855f7;--rip:#fff;--spoke:rgba(255,255,255,.35);--spoke-w:3;--dash:.004 .03;--amp:7px;--ol:#2a0e7a;--tc:#fff;--tsc:#d8c8ff}
body[data-theme=rainbow] .inner{border:3px solid transparent;border-radius:18px;background:linear-gradient(#170b4a,#170b4a) padding-box,linear-gradient(90deg,#ff4d6d,#ffb300,#3ddc84,#29b6f6,#a855f7,#ff4d6d) border-box;background-size:100% 100%,300% 100%;animation:rb 2.2s linear infinite;color:#fff;box-shadow:0 0 18px rgba(168,85,247,.5)}
@keyframes rb{to{background-position:0 0,300% 0}}
body[data-theme=rainbow] .tag{color:var(--c);font-weight:700}
body[data-theme=rainbow] .p{color:#d6c6ff}
/* 8 Doodle Notebook */
body[data-theme=doodle]{--ff:"Patrick Hand","Fredoka";--bg:linear-gradient(90deg,transparent 54px,#ff9a9a 54px 56px,transparent 56px),repeating-linear-gradient(transparent 0 31px,#bcd7f5 31px 32px),#fffdf5;--disp:"Caveat Brush","Patrick Hand",cursive;--ink:#1f2a5a;--hint:#5b6aa8;--bar-bg:#fff;--bar-sh:2px 4px 10px rgba(0,0,0,.2);--chip-on:#ffe97a;--chip-ring:#1f2a5a;--rip:#1f2a5a;--spoke:rgba(31,42,90,.4);--spoke-w:2.5;--dash:.02 .03;--amp:4px;--ol:transparent;--tc:#1f2a5a;--tsc:#5b6aa8;--tsbg:#fffdf5}
body[data-theme=doodle] *{font-weight:400 !important}
body[data-theme=doodle] .inner{background:color-mix(in srgb,var(--c) 24%,#fffef0);border:0;border-radius:3px 3px 14px 3px;box-shadow:2px 5px 10px rgba(0,0,0,.22);color:#1f2a5a}
body[data-theme=doodle] .inner::after{content:'';position:absolute;top:-9px;left:50%;width:44px;height:16px;translate:-50% 0;rotate:-3deg;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.15)}
body[data-theme=doodle] .tag{color:color-mix(in srgb,var(--c) 65%,#000);text-decoration:underline wavy var(--c);text-underline-offset:3px}
body[data-theme=doodle] .w{font-family:"Caveat Brush","Patrick Hand",var(--fb)}
body[data-theme=doodle] .p{color:#5b6aa8}
body[data-theme=doodle] #word{padding:0 .22em;background:linear-gradient(transparent 52%,rgba(255,226,0,.9) 52% 94%,transparent 94%);rotate:-1.5deg}
body[data-theme=doodle] .ch{text-shadow:none}
body[data-theme=doodle] #title b{text-shadow:none}
/* 9 Diner Pop */
body[data-theme=diner]{--bg:linear-gradient(90deg,rgba(230,57,70,.5) 50%,transparent 50%) 0 0/56px 56px,linear-gradient(rgba(230,57,70,.5) 50%,transparent 50%) 0 0/56px 56px,#fff7f0;--disp:"Lilita One","Fredoka",sans-serif;--ink:#1d3557;--hint:#1d3557;--bar-bg:#fff;--bar-sh:0 4px 0 #e63946;--chip-on:#ffe0e3;--chip-ring:#e63946;--rip:#e63946;--spoke:#1d3557;--spoke-w:3;--dash:.02 .03;--amp:6px;--ol:#1d3557;--tc:#fff;--tsc:#1d3557;--tsbg:#fff}
body[data-theme=diner] .inner{background:#fffdf5;border:3px solid #1d3557;border-radius:14px;box-shadow:0 0 0 4px var(--c),0 8px 0 4px #1d3557;color:#1d3557}
body[data-theme=diner] .tag{background:#1d3557;color:#fff;padding:0 8px;border-radius:99px;font-weight:600}
body[data-theme=diner] .p{color:#e63946}
body[data-theme=diner] #word{filter:drop-shadow(.04em .07em 0 #e63946)}
/* 10 Comic Pop */
body[data-theme=comic]{--bg:radial-gradient(rgba(255,120,0,.28) 2.2px,transparent 2.8px) 0 0/16px 16px,repeating-conic-gradient(from 0deg at 50% 42%,#ffe14d 0 6deg,#ffd000 6deg 12deg);--disp:"Bangers","Fredoka",cursive;--ink:#111;--hint:#111;--bar-bg:#fff;--bar-sh:4px 4px 0 #111;--chip-on:#ffe14d;--chip-ring:#111;--rip:#111;--spoke:#111;--spoke-w:3;--dash:.02 .03;--amp:6px;--ol:#111;--tc:#fff;--tsc:#111;--tsbg:#fff}
body[data-theme=comic] *{font-weight:400 !important}
body[data-theme=comic] #title b,body[data-theme=comic] #word,body[data-theme=comic] #ctaPill{letter-spacing:.03em}
body[data-theme=comic] .inner{background:#fff;border:3px solid #111;border-radius:26px / 22px;box-shadow:4px 4px 0 #111;color:#111;padding-bottom:7px}
body[data-theme=comic] .inner::after{content:'';position:absolute;bottom:-10px;left:24%;width:16px;height:16px;background:#fff;border:solid #111;border-width:0 3px 3px 0;transform:rotate(45deg) skew(8deg,8deg)}
body[data-theme=comic] .tag{background:var(--c);color:#111;border:2px solid #111;border-radius:4px;padding:0 6px;font-weight:700}
body[data-theme=comic] .w{font-family:"Bangers","Fredoka",var(--fb);letter-spacing:.04em}
body[data-theme=comic] .p{color:#444}

function makeCard(extra){
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="bob"><div class="inner">'+(extra||'')+'<span class="tag"><i class="fl"></i> <i class="nm"></i></span><div class="txt"><span class="w" dir="auto"></span><span class="p"></span></div></div></div>';
  const q=s=>card.querySelector(s);
  return{card,inner:q('.inner'),tag:q('.tag'),fl:q('.fl'),nm:q('.nm'),w:q('.w'),p:q('.p'),flag:q('.flag'),lang:null,vis:false};
}

function fit(el,base,max){el.style.fontSize=base+'px';const w=el.offsetWidth;if(w>max)el.style.fontSize=(base*max/w)+'px';}
const titleFor=s=>s?`One Sentence, ${SENT_PICKS} Languages`:`One Word, ${WORD_PICKS} Languages`;
function layout(){
  W=stage.clientWidth;H=stage.clientHeight;
  land=W/H>1.25;document.body.classList.toggle('land',land);
  stage.classList.toggle('sent',SENT);
  const n=SENT?SENT_PICKS:WORD_PICKS;
  const topPad=land?12:66,botPad=land?84:(EXPORT?78:98);
  if(!SENT){
    const ANG={3:[0,120,240],4:[45,135,225,315],5:[0,72,144,216,288],6:[0,60,120,180,240,300]}[n]||[0,60,120,180,240,300];
    const maxCw=land?150:(n<=4?118:132);
    const compute=(c,force)=>{
      const h=c*.78,aTop=topPad+h+14,ah=H-botPad-aTop;
      const x0=W/2,y0=aTop+ah/2,rx=W/2-c/2-6,ry=ah/2-h/2-2;
      if(!force&&(ah<h*1.5||rx<20||ry<20))return null;
      const p=ANG.map(d=>{const a=d*Math.PI/180;return{x:x0+rx*Math.sin(a),y:y0-ry*Math.cos(a)};});
      if(!force)for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++)if(Math.abs(p[i].x-p[j].x)<c+8&&Math.abs(p[i].y-p[j].y)<h+8)return null;
      return{c,h,x0,y0,rx,ry,p};
    };
    let g=null;for(let c=maxCw;c>=62&&!g;c-=3)g=compute(c);
    if(!g)g=compute(62,true);
    cw=g.c;ch=g.h;cx=g.x0;cy=g.y0;pos=g.p;
    const minDy=Math.min(...pos.map(p=>Math.abs(p.y-cy)));
    const bandH=2*(minDy-ch/2)-10,roomH=2*(g.ry-ch/2-6);
    if(bandH>=54){cMaxW=W-28;cMaxH=Math.min(bandH,roomH);}
    else{const near=pos.filter(p=>Math.abs(p.y-cy)<ch);cMaxW=near.length?Math.max(120,2*(Math.min(...near.map(p=>Math.abs(p.x-cx)))-cw/2)-14):W-28;cMaxH=roomH;}
    RB={x:W/2,y:topPad+ch/2};
  }else{
    const bannerH=land?64:96,gap=10;
    cw=Math.min(W-32,520);
    ch=Math.max(58,Math.min(96,(H-botPad-topPad-bannerH-8-14-2*gap)/4));
    cx=W/2;cy=topPad+bannerH/2;
    RB={x:W/2,y:topPad+bannerH+8+ch/2};
    pos=[...Array(n)].map((_,k)=>({x:W/2,y:RB.y+ch+14+k*(ch+gap)}));
    cMaxW=W-36;cMaxH=bannerH-6;
  }
  // where the little Like/Follow badge may appear
  ctaSpots={bottom:{x:W/2,y:H-botPad+22,max:W-40}};
  if(!SENT){const half=RB.x-cw/2-12;if(half>70){ctaSpots.topL={x:6+half/2,y:RB.y,max:half};ctaSpots.topR={x:W-6-half/2,y:RB.y,max:half};}}
  stage.style.setProperty('--cw',cw+'px');stage.style.setProperty('--ch',ch+'px');
  cards.forEach((c,i)=>{c.card.style.display=i<n?'':'none';if(i<n)c.card.style.transform=`translate(${pos[i].x}px,${pos[i].y}px)`;});
  R.card.style.transform=`translate(${RB.x}px,${RB.y}px)`;
  spokes.forEach((p,i)=>{
    p.style.display=(i<n&&!SENT)?'':'none';
    if(i<n&&!SENT){const dx=pos[i].x-cx,dy=pos[i].y-cy;p.setAttribute('d',`M${cx+dx*.28} ${cy+dy*.28} L${cx+dx*.8} ${cy+dy*.8}`);}
  });
  centerEl.style.left=cx+'px';centerEl.style.top=cy+'px';
  const tb=$('#title b');tb.textContent=titleFor(SENT);$('#title small').textContent=SUB;
  const tmax=land?Math.max(200,W/2-(SENT?150:cw/2)-30):W-28;
  fit(tb,land?24:28,tmax);fit($('#title small'),14,tmax);
  sizeCanvas();renderStatic();
}
function fitCard(c){
  if(SENT){
    c.tag.style.fontSize='11px';fit(c.nm,11,58);
    let fw=Math.min(21,ch*.24),fp=fw*.62;
    for(let i=0;i<14;i++){
      c.w.style.fontSize=fw+'px';c.p.style.fontSize=fp+'px';
      if(c.w.offsetHeight+c.p.offsetHeight<=ch-14)break;
      fw*=.93;fp*=.93;
    }
  }else{const m=cw-14;fit(c.tag,Math.max(9,cw*.1),m);fit(c.w,cw*.235,m);fit(c.p,cw*.125,m);}
}
function fillCard(c,l){
  const t=cur.t[l];c.lang=l;c.card.style.setProperty('--c',PAL[l]);
  c.fl.textContent=LANGS[l][2];c.nm.textContent=LANGS[l][1];c.w.textContent=t.w;c.p.textContent=t.r;fitCard(c);
}
function sizeCenter(){
  if(!cur)return;
  if(SENT){
    wordEl.style.width=cMaxW+'px';
    let fs=Math.min(36,cMaxW/9);
    for(let i=0;i<16;i++){wordEl.style.fontSize=fs+'px';if(wordEl.offsetHeight<=cMaxH)break;fs*=.92;}
    return;
  }
  wordEl.style.width='';
  const len=Math.max(4,cur.en.length);
  let fs=Math.min(cMaxW/(len*.56),cMaxH/1.15,160);fs=Math.max(26,fs);
  wordEl.style.fontSize=fs+'px';
  const w=wordEl.offsetWidth;if(w>cMaxW)wordEl.style.fontSize=(fs*cMaxW/w)+'px';
}
function renderStatic(){
  cards.forEach(c=>{if(c.vis&&c.lang!==null)fitCard(c);});
  if(!R.inner.classList.contains('spin')&&R.lang!==null)fitCard(R);
  sizeCenter();
}
function colorLetters(){

/* ================= audio ================= */
let AC,master,nb;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;
}
const ok=()=>EXPORT?!!AC:(AC&&soundOn&&AC.state==='running');
const NOW=()=>EXPORT?vnow:AC.currentTime;
function tone(f,o={}){
  if(!ok())return;const t0=NOW()+(o.t||0),d=o.dur||.15,v=o.vol||.2;
  const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';
  os.frequency.setValueAtTime(f,t0);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  let n=os;if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);n=fl;}
  n.connect(g);g.connect(master);os.start(t0);os.stop(t0+d+.03);
}
function noise(d,o){
  if(!ok())return;
  if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t0=NOW()+(o.t||0),s=AC.createBufferSource();s.buffer=nb;s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=o.q||1.2;
  f.frequency.setValueAtTime(o.from,t0);f.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol,t0+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+d+.05);
}
const note=i=>220*Math.pow(2,([0,2,4,7,9][i%5]+12*Math.floor(i/5))/12);
const arp=(base,steps,gap,dur,vol)=>steps.forEach((s,k)=>tone(base*Math.pow(2,s/12),{t:k*gap,dur,type:T.w,vol,lp:T.w==='sawtooth'?2800:0}));
const sfx={
  tap(){noise(.25,{vol:.14,from:300,to:3000});tone(150,{dur:.2,slide:3,vol:.22});},
  tick(i){tone(520+i*55,{dur:.035,type:T.w==='sine'?'triangle':T.w,vol:.09,lp:T.w==='sawtooth'?2500:0});},
  reveal(){
    if(theme==='mario'){tone(988,{dur:.07,type:'square',vol:.12});tone(1319,{t:.07,dur:.4,type:'square',vol:.12});}
    else if(theme==='diner'){tone(1568,{dur:.5,vol:.2});tone(2093,{t:.02,dur:.5,vol:.1});}
    else if(theme==='comic'){noise(.16,{vol:.3,from:1200,to:200,q:.7});tone(110,{dur:.2,slide:.5,vol:.35,type:'square'});tone(659,{t:.04,dur:.2,type:'square',vol:.1});}
    else arp(587,[0,4,7,12],.045,.25,.14);
  },
  whoosh(){noise(.26,{vol:.12,from:600,to:2600,q:.8});},
  pop(i){const f=note(i+2);
    if(theme==='candy')tone(f*1.5,{dur:.2,type:'triangle',vol:.22});
    else if(theme==='neon'||theme==='rainbow')tone(f*1.5,{dur:.16,type:T.w,vol:.1,lp:2400,slide:.8});
    else if(T.w==='square')tone(f*1.5,{dur:.09,type:'square',vol:.09});
    else if(theme==='ocean')tone(f*.9,{dur:.14,vol:.3,slide:2});
    else{tone(f*1.5,{dur:.28,vol:.26});tone(f*4.5,{dur:.07,vol:.06});}},
  intro(){arp(523,[0,4,7,12],.055,.3,theme==='sticker'?.08:.16);tone(90,{dur:.2,slide:.5,vol:.35});},
  cta(){
    if(theme==='mario'){[1319,1568,2093].forEach((f,k)=>tone(f,{t:k*.06,dur:.1,type:'square',vol:.1}));}
    else arp(784,[0,7,12],.07,.22,.13);
  },
  ui(){tone(880,{dur:.08,type:'triangle',vol:.16});tone(1320,{t:.06,dur:.14,type:'triangle',vol:.16});tone(1760,{t:.12,dur:.16,vol:.1});}
};

/* ================= particles + ambient ================= */
const FX={
  candy:{kinds:['rect','rect','circle','star'],cols:PAL,g:1100},
  neon:{kinds:['spark','spark','ring','circle'],cols:['#ff3df2','#3df2ff','#b6ff3d','#ffe83d','#8a6bff'],g:500},
  sticker:{kinds:['star','rect','tri','circle'],cols:['#111','#ff3d7f','#ffffff','#2f6bff','#00c896','#ff8a00'],g:1000},
  ocean:{kinds:['bubble'],cols:['#fff'],g:-240,drag:.95},
  jungle:{kinds:['emoji','emoji','star'],cols:['#ffe66d','#fff4d6'],emo:['🍃','🌸','🍀','🦋','✨'],g:650},
  mario:{kinds:['coin','star','rect','coin'],cols:['#fcb800','#e52521','#fff','#00a800'],g:1100},
  rainbow:{kinds:['spark','star','circle'],cols:['#ff4d6d','#ff9f1c','#ffe14d','#3ddc84','#29b6f6','#c27bff'],g:600},
  doodle:{kinds:['squig','star','circle','rect'],cols:['#1f2a5a','#e63946','#2a9d8f','#f4a261','#6a5cff'],g:900},
  diner:{kinds:['emoji'],cols:['#fff'],emo:['🍔','🍟','🍕','🍩','🥤','🌭','🍒'],g:800},
  comic:{kinds:['star','tri','rect','emoji'],cols:['#e63946','#111','#fff','#1d7bff'],emo:['💥','⚡','⭐'],g:900}
};
const fxc=$('#fx'),fx=fxc.getContext('2d'),bgc=$('#bg'),bg=bgc.getContext('2d');
let DPR=1,parts=[],amb=[];
function sizeCanvas(){
  DPR=EXPORT?(devicePixelRatio||1):Math.min(2,devicePixelRatio||1);
  [fxc,bgc].forEach(c=>{c.width=W*DPR;c.height=H*DPR;});
  fx.setTransform(DPR,0,0,DPR,0,0);bg.setTransform(DPR,0,0,DPR,0,0);
}
function burst(x,y,n=30,pw=1,o={}){
  const c=FX[theme];n=Math.round(n*(RM?.4:1));
  for(let i=0;i<n&&parts.length<500;i++){
    const a=Math.random()*Math.PI*2,sp=(150+Math.random()*520)*pw,g=o.emo?900:c.g;
    const emo=o.emo||c.emo;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(g>0?220*pw:0),g,rot:Math.random()*6,vr:(Math.random()-.5)*12,
      s:(8+Math.random()*12)*(o.small?.7:1)*(o.big?1.5:1),life:1+Math.random()*.9,
      type:o.emo?'emoji':c.kinds[i%c.kinds.length],c:c.cols[(Math.random()*c.cols.length)|0],
      flip:Math.random()*6,vf:6+Math.random()*8,e:emo?emo[(Math.random()*emo.length)|0]:'',drag:o.emo?.985:(c.drag||.985)});
  }
}
function starPath(c,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();}
function drawP(p){
  fx.save();fx.globalAlpha=Math.min(1,p.life/.35);fx.translate(p.x,p.y);fx.rotate(p.rot);
  const s=p.s;fx.fillStyle=p.c;
  switch(p.type){
    case 'rect':fx.scale(1,Math.cos(p.flip));fx.fillRect(-s/2,-s/3,s,s*.66);break;
    case 'circle':fx.beginPath();fx.arc(0,0,s/2.2,0,7);fx.fill();break;
    case 'star':starPath(fx,s*.8);fx.fill();if(theme==='sticker'||theme==='comic'||theme==='mario'){fx.strokeStyle='#111';fx.lineWidth=2;fx.stroke();}break;
    case 'tri':fx.beginPath();fx.moveTo(0,-s/2);fx.lineTo(s/2,s/2);fx.lineTo(-s/2,s/2);fx.closePath();fx.fill();fx.strokeStyle='#111';fx.lineWidth=2;fx.stroke();break;
    case 'spark':fx.strokeStyle=p.c;fx.lineWidth=3;fx.lineCap='round';fx.shadowBlur=14;fx.shadowColor=p.c;fx.beginPath();fx.moveTo(-s,0);fx.lineTo(s,0);fx.stroke();break;
    case 'ring':fx.strokeStyle=p.c;fx.lineWidth=2.5;fx.shadowBlur=12;fx.shadowColor=p.c;fx.beginPath();fx.arc(0,0,s/1.6,0,7);fx.stroke();break;
    case 'bubble':fx.strokeStyle='rgba(255,255,255,.9)';fx.lineWidth=2;fx.fillStyle='rgba(255,255,255,.18)';fx.beginPath();fx.arc(0,0,s*.85,0,7);fx.fill();fx.stroke();
      fx.fillStyle='rgba(255,255,255,.9)';fx.beginPath();fx.arc(-s*.3,-s*.3,s*.17,0,7);fx.fill();break;
    case 'coin':fx.rotate(-p.rot);fx.scale(Math.max(.12,Math.abs(Math.cos(p.flip))),1);fx.fillStyle='#fcb800';fx.strokeStyle='#000';fx.lineWidth=2;
      fx.beginPath();fx.ellipse(0,0,s*.45,s*.62,0,0,7);fx.fill();fx.stroke();fx.fillStyle='#ffe066';fx.fillRect(-s*.07,-s*.32,s*.14,s*.64);break;
    case 'squig':fx.strokeStyle=p.c;fx.lineWidth=3;fx.lineCap='round';fx.beginPath();for(let x=-s;x<=s;x+=3)fx.lineTo(x,Math.sin(x*.7)*s*.28);fx.stroke();break;
    case 'emoji':fx.font=`${s*1.7}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;fx.textAlign='center';fx.textBaseline='middle';fx.fillText(p.e,0,0);break;
  }
  fx.restore();
}
const VY={ocean:-1,jungle:1,mario:0,rainbow:.05,diner:.9,comic:.5,doodle:.2};
const AEMO={diner:['🍔','🍟','🍕','🍩','🥤','🌭'],comic:['💥','⚡','⭐']};
function initAmb(){
  amb=[];const n=RM?8:24,vy=VY[theme]!==undefined?VY[theme]:.35;
  for(let i=0;i<n;i++)amb.push({x:Math.random()*W,y:Math.random()*H,s:8+Math.random()*34,vy:vy*(10+Math.random()*25),vx:10+Math.random()*18,
    f:.4+Math.random()*.8,ph:Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.8,c:PAL[i%12],k:i%3,
    e:AEMO[theme]?AEMO[theme][i%AEMO[theme].length]:''});
}
function ribbon(t){
  const cols=['#ff4d6d','#ff9f1c','#ffe14d','#3ddc84','#29b6f6','#6a5cff','#c27bff'];
  bg.save();bg.lineWidth=7;bg.lineCap='round';bg.globalAlpha=.9;
  for(let i=0;i<7;i++){bg.strokeStyle=cols[i];bg.beginPath();
    for(let x=-10;x<=W+10;x+=14){const y=H*.9+Math.sin(x*.012+t*1.6)*14+i*7;x<0?bg.moveTo(x,y):bg.lineTo(x,y);}
    bg.stroke();}
  bg.restore();
}
function drawAmb(dt,t){
  bg.clearRect(0,0,W,H);
  if(theme==='rainbow')ribbon(t);
  for(const a of amb){
    if(theme==='mario')a.x+=a.vx*dt*.7;else a.x+=Math.sin(t*a.f+a.ph)*a.vx*dt;
    a.y+=a.vy*dt;a.rot+=a.vr*dt;
    if(a.y>H+60)a.y=-60;if(a.y<-60)a.y=H+60;if(a.x>W+80)a.x=-80;if(a.x<-80)a.x=W+80;
    bg.save();bg.translate(a.x,a.y);
    const e=()=>{bg.font=`${a.s*.9+14}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;bg.textAlign='center';bg.textBaseline='middle';};
    if(theme==='candy'){bg.rotate(a.rot);bg.globalAlpha=.4;bg.fillStyle=bg.strokeStyle=a.c;bg.lineWidth=4;
      if(a.k===0){bg.beginPath();bg.arc(0,0,a.s/2,0,7);bg.fill();}
      else if(a.k===1){bg.beginPath();bg.arc(0,0,a.s/1.8,0,7);bg.stroke();}
      else{bg.fillRect(-a.s/2,-2.5,a.s,5);bg.fillRect(-2.5,-a.s/2,5,a.s);}}
    else if(theme==='neon'){bg.globalCompositeOperation='lighter';const r=a.s*1.6,g=bg.createRadialGradient(0,0,0,0,0,r);
      g.addColorStop(0,a.c+'99');g.addColorStop(1,a.c+'00');bg.fillStyle=g;bg.beginPath();bg.arc(0,0,r,0,7);bg.fill();}
    else if(theme==='sticker'){bg.rotate(a.rot);bg.strokeStyle='rgba(0,0,0,.18)';bg.lineWidth=3;
      if(a.k===0){starPath(bg,a.s*.8);bg.stroke();}
      else if(a.k===1){bg.beginPath();bg.moveTo(-a.s/2,0);bg.lineTo(a.s/2,0);bg.moveTo(0,-a.s/2);bg.lineTo(0,a.s/2);bg.stroke();}
      else{bg.beginPath();bg.arc(0,0,a.s/2,0,7);bg.stroke();}}
    else if(theme==='ocean'){bg.strokeStyle='rgba(255,255,255,.45)';bg.fillStyle='rgba(255,255,255,.07)';bg.lineWidth=2;
      bg.beginPath();bg.arc(0,0,a.s/2,0,7);bg.fill();bg.stroke();
      bg.fillStyle='rgba(255,255,255,.6)';bg.beginPath();bg.arc(-a.s*.17,-a.s*.17,a.s*.08,0,7);bg.fill();}
    else if(theme==='jungle'){
      if(a.k<2){bg.rotate(a.rot);bg.globalAlpha=.5;e();bg.fillText(a.k?'🍃':'🌿',0,0);}
      else{bg.globalCompositeOperation='lighter';const r=10+Math.sin(t*2+a.ph)*4,g=bg.createRadialGradient(0,0,0,0,0,r*2);
        g.addColorStop(0,'rgba(255,240,120,.9)');g.addColorStop(1,'rgba(255,240,120,0)');bg.fillStyle=g;bg.beginPath();bg.arc(0,0,r*2,0,7);bg.fill();}}
    else if(theme==='mario'){
      if(a.k<2){const s=a.s*1.7;bg.globalAlpha=.95;bg.fillStyle='#fff';
        [[-.5,0,.32],[0,-.2,.42],[.5,0,.32]].forEach(c=>{bg.beginPath();bg.arc(s*c[0],s*c[1],s*c[2],0,7);bg.fill();});
        bg.fillRect(-s*.5,-s*.02,s,s*.3);}
      else{bg.scale(Math.max(.12,Math.abs(Math.cos(t*3+a.ph))),1);bg.fillStyle='#fcb800';bg.strokeStyle='#8a4b00';bg.lineWidth=2;
        bg.beginPath();bg.ellipse(0,0,a.s*.28,a.s*.4,0,0,7);bg.fill();bg.stroke();}}
    else if(theme==='rainbow'){bg.globalCompositeOperation='lighter';const tw=.5+.5*Math.sin(t*3+a.ph),r=2+a.s*.3*tw;
      bg.globalAlpha=.25+.75*tw;bg.fillStyle='#fff';bg.fillRect(-r,-1,2*r,2);bg.fillRect(-1,-r,2,2*r);}
    else if(theme==='doodle'){bg.rotate(a.rot*.3);bg.strokeStyle='rgba(31,42,90,.32)';bg.lineWidth=2.5;bg.lineCap='round';
      if(a.k===0){starPath(bg,a.s*.7);bg.stroke();}
      else if(a.k===1){bg.beginPath();for(let i=0;i<60;i++){const r=i*a.s*.012,an=i*.35;bg.lineTo(Math.cos(an)*r,Math.sin(an)*r);}bg.stroke();}
      else{bg.beginPath();for(let x=-a.s;x<=a.s;x+=4)bg.lineTo(x,Math.sin(x*.5)*5);bg.stroke();}}
    else{bg.rotate(a.rot);bg.globalAlpha=.55;e();bg.fillText(a.e,0,0);}
    bg.restore();
  }
}
let last=performance.now();
function fxFrame(dt,t){
  drawAmb(dt,t);
  fx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0||p.y>H+80||p.y<-140){parts.splice(i,1);continue;}
    const d=Math.pow(p.drag,dt*60);p.vx*=d;p.vy*=d;p.vy+=p.g*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.flip+=p.vf*dt;
    if(p.type==='bubble')p.x+=Math.sin(p.y*.03)*.6;
    drawP(p);
  }
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;fxFrame(dt,now/1000);requestAnimationFrame(loop);}

/* ================= word + roulette run ================= */
function plan(it){   // timing of one video: n languages, pause after each reveal, pause at the end
  const n=it.sent?SENT_PICKS:WORD_PICKS,hold=it.sent?.55:.19,tail=it.sent?2.4:1.4;
  const end=.75+n*(INT.reduce((a,b)=>a+b,0)/1000+hold+.12)+.52;
  return{n,hold,tail,end,total:(end+tail)*PACE};
}
function draw(){
  if(!bag.length){
    bag=shuffle(ITEMS.map((_,i)=>i));
    if(cur&&ITEMS[bag[bag.length-1]]===cur)bag.unshift(bag.pop());
  }
  return ITEMS[bag.pop()];
}
function setCenter(w){
  wordEl.getAnimations().forEach(a=>a.cancel());
  wordEl.innerHTML='';
  const txt=w.en[0].toUpperCase()+w.en.slice(1);
  const add=(s,k)=>{const o=document.createElement('span');o.className='ch';const i=document.createElement('span');i.className='w2';
    i.style.setProperty('--k',k);i.textContent=s;o.append(i);wordEl.append(o);};
  if(w.sent)txt.split(' ').forEach((s,k)=>add(s,k));
  else [...txt].forEach(chr=>{
    if(chr===' '){const s=document.createElement('span');s.className='sp';wordEl.append(s);return;}
    add(chr,wordEl.children.length);
  });
  colorLetters();sizeCenter();
}
function playCenterIn(){
  const step=cur&&cur.sent?90:45;
  [...wordEl.querySelectorAll('.ch')].forEach((o,i)=>o.animate([{transform:'translateY(70px) scale(0) rotate(-28deg)',opacity:0},{transform:'none',opacity:1}],{duration:580,delay:i*step,easing:EASE,fill:'backwards'}));
}
function animateOut(){
  cards.forEach((c,i)=>{
    if(!c.vis)return;
    c.inner.getAnimations().forEach(a=>a.cancel());
    const dx=(cx-pos[i].x)*.45,dy=(cy-pos[i].y)*.45;
    c.inner.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.2) rotate(30deg)`,opacity:0}],{duration:200,delay:i*6,easing:'ease-in',fill:'forwards'});
  });
  wordEl.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.2) rotate(-8deg)',opacity:0}],{duration:170,easing:'ease-in',fill:'forwards'});
  spokes.forEach(p=>{p.getAnimations().forEach(a=>a.cancel());p.style.opacity=0;});
}
function resetRoll(pop){
  R.inner.classList.add('spin');R.flag.textContent='';R.lang=null;R.card.style.setProperty('--c','#fff');
  if(pop)R.inner.animate([{transform:'scale(.2) rotate(-12deg)',opacity:0},{transform:'none',opacity:1}],{duration:450,easing:EASE});
}
function setFlag(l,dur){
  R.flag.textContent=LANGS[l][2];R.card.style.setProperty('--c',PAL[l]);
  R.flag.animate([{transform:'translateY(-40%) scale(.75)',opacity:.3},{transform:'none',opacity:1}],{duration:Math.max(40,Math.min(dur,100))});
}
async function spin(target,pool,my){
  R.inner.classList.add('spin');
  const others=shuffle(pool.filter(x=>x!==target)),n=INT.length;
  for(let i=0;i<=n;i++){
    setFlag(i===n?target:others[i%others.length],i<n?INT[i]:200);
    if(i<n){sfx.tick(i);await sleep(INT[i]);if(my!==seq)return false;}
  }
  return true;
}
function reveal(target){
  R.inner.classList.remove('spin');fillCard(R,target);
  R.inner.animate([{transform:'scale(.7,1.3)'},{transform:'scale(1.2,.85)'},{transform:'scale(.96,1.05)'},{transform:'none'}],{duration:380,easing:'ease-out'});
  sfx.reveal();burst(RB.x,RB.y,16,.6,{small:1});
}
function fly(k,lang,my){
  const c=cards[k];fillCard(c,lang);
  const dx=RB.x-pos[k].x,dy=RB.y-pos[k].y;
  c.card.classList.add('fly');c.inner.getAnimations().forEach(a=>a.cancel());c.inner.style.opacity=1;c.vis=true;
  c.inner.animate([{transform:`translate(${dx}px,${dy}px) scale(1.06)`},{transform:'none'}],{duration:430,easing:EASE,fill:'backwards'});
  sched(470,()=>c.card.classList.remove('fly'));
  sfx.whoosh();
  sched(300*PACE,()=>{if(my!==seq)return;sfx.pop(k);burst(pos[k].x,pos[k].y,9,.45,{small:1});});
  if(!SENT){
    const sp=spokes[k];sp.style.opacity=1;
    sp.animate([{strokeDashoffset:1,opacity:0},{strokeDashoffset:0,opacity:1}],{duration:520,delay:220,easing:'ease-out',fill:'backwards'});
  }
}

/* ---- small Like / Follow badge: pops up once, at a random moment and a random spot ---- */
const cancelWA=el=>el.getAnimations().forEach(a=>{if(a.constructor===Animation)a.cancel();});
const hideCTA=()=>{cancelWA(pillEl);pillEl.style.display='none';};
function showPill(txt,spot,plain){
  const s=ctaSpots[spot]||ctaSpots.bottom;
  cancelWA(pillEl);
  pillEl.textContent=txt;pillEl.className=plain?'plain':'';
  pillEl.style.display='block';pillEl.style.left=s.x+'px';pillEl.style.top=s.y+'px';
  fit(pillEl,20,s.max);
  pillEl.animate([{transform:'translate(-50%,-50%) scale(0) rotate(-14deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:450,easing:EASE});
  sfx.cta();burst(s.x,s.y,12,.55,{emo:['👍','❤️','⭐'],small:1});
}
function hidePill(my){
  if(pillEl.style.display==='none')return;
  pillEl.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(-50%,-50%) scale(0)',opacity:0}],{duration:220,easing:'ease-in',fill:'forwards'});
  sched(230,()=>{if(my===seq)hideCTA();});
}

async function run(w,my){
  const A=()=>my===seq;
  hideCTA();
  if(!EXPORT){
    if('speechSynthesis' in window)speechSynthesis.cancel();
    clearSpeaking();animateOut();
    await sleep(210);if(!A())return;
  }
  cur=w;SENT=!!w.sent;
  const P=plan(w),n=P.n;
  picks=shuffle(LANGS.map((_,i)=>i)).slice(0,n);
  cards.forEach(c=>{c.vis=false;c.lang=null;c.inner.style.opacity=0;c.inner.getAnimations().forEach(a=>a.cancel());});
  spokes.forEach(p=>{p.style.opacity=0;});
  layout();
  if(CTA_LIST.length){   // choose when / where / what the badge shows (all from the seed, so a video is repeatable)
    const lo=1.2,hi=Math.max(lo+.1,P.end-CTA_SECONDS-.2);
    const at=lo+Math.random()*(hi-lo),txt=CTA_LIST[(Math.random()*CTA_LIST.length)|0],plain=Math.random()<.35;
    const keys=Object.keys(ctaSpots).filter(k=>k==='bottom'||txt.length<=9);
    const spot=keys[(Math.random()*keys.length)|0];
    sched(at*1000*PACE,()=>{if(A())showPill(txt,spot,plain);});
    sched((at+CTA_SECONDS)*1000*PACE,()=>{if(A())hidePill(my);});
  }
  setCenter(w);playCenterIn();resetRoll(true);sfx.intro();burst(cx,cy,34,1.05);
  await sleep(750);if(!A())return;
  for(let k=0;k<n;k++){
    const target=picks[k],pool=LANGS.map((_,i)=>i).filter(i=>!picks.slice(0,k).includes(i));
    if(!(await spin(target,pool,my)))return;
    reveal(target);
    await sleep(P.hold*1000);if(!A())return;
    fly(k,target,my);resetRoll(false);
    R.inner.animate([{transform:'scale(.85)'},{transform:'none'}],{duration:300,easing:EASE});
    await sleep(120);if(!A())return;
  }
  await sleep(520);if(!A())return;
  later_speak(w,my);
}
function later_speak(w,my){sched(900*PACE,()=>speakSeq(w,my));}

/* ================= speech (optional) ================= */
function clearSpeaking(){centerEl.classList.remove('speaking');cards.forEach(c=>c.card.classList.remove('speaking'));}
function speakSeq(w,my){
  if(!voiceOn||!('speechSynthesis' in window))return;
  const items=[{t:w.en,l:'en-US',s:-1},...picks.map((l,k)=>({t:w.t[l].w,l:LANGS[l][3],s:k}))];
  let k=0;
  (function go(){
    clearSpeaking();
    if(k>=items.length||my!==seq||!voiceOn)return;
    const it=items[k++],u=new SpeechSynthesisUtterance(it.t);u.lang=it.l;u.rate=.85;
    let done=false;const nx=()=>{if(done)return;done=true;setTimeout(go,180);};
    u.onstart=()=>{clearSpeaking();(it.s<0?centerEl:cards[it.s].card).classList.add('speaking');};
    u.onend=nx;u.onerror=nx;setTimeout(nx,5000);
    speechSynthesis.speak(u);
  })();
}

/* ================= interaction fx ================= */
function ripple(x,y){
  [0,110].forEach(d=>{
    const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';stage.append(r);
    const a=r.animate([{transform:'scale(.5)',opacity:.9},{transform:'scale(16)',opacity:0}],{duration:650,delay:d,easing:'cubic-bezier(.1,.7,.3,1)',fill:'backwards'});
    a.onfinish=()=>r.remove();
  });
}
function shake(){if(RM)return;stage.animate([{transform:'translate(0,0)'},{transform:'translate(-3px,2px)'},{transform:'translate(3px,-2px)'},{transform:'translate(0,0)'}],{duration:190});}
function next(x,y){
  audio();
  if(!hintGone){hintGone=true;$('#hint').style.opacity=0;}
  ripple(x,y);burst(x,y,22,1);shake();sfx.tap();navigator.vibrate&&navigator.vibrate(12);
  const my=++seq;run(draw(),my);
}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('#bar,#unclean'))return;next(e.clientX,e.clientY);});

/* ================= themes / toggles ================= */
const themesEl=$('#themes'),chips=[];
TH.forEach((t,i)=>{
  const b=document.createElement('button');b.className='chip';b.textContent=t.i;b.title=t.n;
  b.setAttribute('aria-label',t.n+' look ('+((i+1)%10)+')');b.addEventListener('click',()=>setTheme(i));
  themesEl.append(b);chips.push(b);
});
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.getAnimations().forEach(a=>a.cancel());
  t.animate([{opacity:0,transform:'translateY(14px) scale(.8)'},{opacity:1,transform:'none',offset:.12},{opacity:1,transform:'none',offset:.8},{opacity:0,transform:'translateY(8px)'}],{duration:1500,easing:'ease-out'});
}
function setTheme(n,silent){
  T=TH[n];theme=T.id;document.body.dataset.theme=theme;
  chips.forEach((c,i)=>c.classList.toggle('on',i===n));
  chips[n].scrollIntoView({inline:'center',block:'nearest',behavior:silent?'auto':'smooth'});
  parts=[];initAmb();colorLetters();
  if(EXPORT)layout();else requestAnimationFrame(()=>{layout();});
  if(!silent){audio();toast(T.i+' '+T.n);sfx.ui();burst(cx,cy,34,1.1);stage.animate([{filter:'brightness(1.35) saturate(1.5)'},{filter:'none'}],{duration:350});}
}
const sndB=$('#snd'),voxB=$('#vox');
function toggleSound(){soundOn=!soundOn;sndB.textContent=soundOn?'🔊':'🔇';sndB.classList.toggle('on',!soundOn);audio();toast(soundOn?'🔊 Sound on':'🔇 Sound off');if(soundOn)sfx.ui();}
function toggleVoice(){
  voiceOn=!voiceOn;voxB.classList.toggle('on',voiceOn);audio();
  toast(voiceOn?'🗣️ Reading aloud':'🤫 Voice off');
  if(!voiceOn){'speechSynthesis' in window&&speechSynthesis.cancel();clearSpeaking();}
}
function toggleClean(){document.body.classList.toggle('clean');}
sndB.addEventListener('click',toggleSound);voxB.addEventListener('click',toggleVoice);
$('#rec').addEventListener('click',toggleClean);$('#unclean').addEventListener('click',toggleClean);
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('#bar'))return;
  if(e.key>='0'&&e.key<='9'){const n=e.key==='0'?9:+e.key-1;if(TH[n])setTheme(n);}
  else if(e.key==='m'||e.key==='M')toggleSound();
  else if(e.key==='v'||e.key==='V')toggleVoice();
  else if(e.key==='h'||e.key==='H')toggleClean();
  else if(['Enter',' ','ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();next(cx,cy);}
});
addEventListener('resize',()=>{layout();initAmb();});

/* ================= go ================= */
layout();
bag=shuffle(ITEMS.map((_,i)=>i).filter(i=>i>0));
setTheme(0,true);
cur=ITEMS[0];SENT=false;setCenter(cur);renderStatic();
if(!EXPORT){setTimeout(()=>{playCenterIn();resetRoll(true);},200);requestAnimationFrame(loop);}

/* ================= VIDEO EXPORT API (used by the GitHub workflow) =================
   window.TOPIC_IDS            seed ids r001 ... (same id = same video)
   await window.loadTopic(id, {theme,word,cta,kind})   -> info {caption,tags,footer,total,...}
   await window.stepTo(i)      jump to frame i (call 0,1,2,... in order), then take a screenshot
   await window.renderAudioBase64(withMusic)           -> base64 s16le 48 kHz stereo, length = total
============================================================================ */
window.TOPIC_IDS=Array.from({length:ITEMS.length*4},(_,i)=>'r'+String(i+1).padStart(3,'0'));
let TOTAL=8;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function strHash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
const flush=()=>new Promise(r=>setTimeout(r,0));
async function preloadFonts(){
  const f=['500 20px Fredoka','600 20px Fredoka','700 20px Fredoka','400 20px "Lilita One"','400 20px Audiowide','600 20px "Baloo 2"','800 20px "Baloo 2"','400 20px "Press Start 2P"','400 20px "Caveat Brush"','400 20px "Patrick Hand"','400 20px Bangers'];
  try{await Promise.all(f.map(x=>document.fonts.load(x)));await document.fonts.ready;}catch(e){}
}
function seekAll(){
  document.getAnimations().forEach(a=>{if(a.__v===undefined)a.__v=vnow;a.pause();a.currentTime=Math.max(0,(vnow-a.__v)*1000);});
  void document.body.offsetHeight;
}
window.stepTo=async function(i){
  const target=i/FPS;
  while(vq.length&&vq[0].t<=target+1e-9){const e=vq.shift();vnow=Math.max(vnow,e.t);e.fn();await flush();}
  vnow=target;
  fxFrame(i===0?0:1/FPS,vnow);
  seekAll();
  return vnow;
};
window.loadTopic=async function(id,o){
  o=o||{};
  await preloadFonts();
  const n=Math.max(1,parseInt(String(id).replace(/\D/g,''),10)||1);
  Math.random=mulberry32(strHash('word-roulette-'+id));
  seq++;vq.length=0;vnow=0;vseq=0;parts=[];nb=null;
  document.getAnimations().forEach(a=>{if(a.constructor===Animation)a.cancel();});
  hideCTA();
  const want=String(o.word||'').trim().toLowerCase(),kind=o.kind||'random';
  const pool=kind==='word'?WORDS:kind==='sentence'?SENTS:ITEMS;
  const it=ITEMS.find(x=>x.en.toLowerCase()===want)||pool[(n-1)%pool.length];
  const ti=TH.findIndex(t=>t.id===o.theme);
  const idx=ti>=0?ti:Math.floor(Math.random()*TH.length);
  const cta=o.cta||'random';
  CTA_LIST=cta==='none'?[]:cta==='random'?CTAS:CTAS.filter(c=>cta==='like'?c==='👍 LIKE':cta==='follow'?c==='➕ FOLLOW':c==='👍 LIKE & FOLLOW');
  TOTAL=plan(it).total;
  AC=new OfflineAudioContext(2,Math.ceil(TOTAL*48000),48000);
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);soundOn=true;
  setTheme(idx,true);
  sfx.tap();
  const my=++seq;run(it,my);                       // in export mode run() sets everything up synchronously
  const cap=s=>s[0].toUpperCase()+s.slice(1);
  const lines=picks.map(l=>`${LANGS[l][2]} ${LANGS[l][1]}: ${it.t[l].w} (${it.t[l].r})`);
  return{id,kind:it.sent?'sentence':'word',word:it.en,theme:T.id,languages:picks.map(l=>LANGS[l][1]),total:TOTAL,
    caption:`How do you say “${cap(it.en)}” in ${picks.length} languages? 🌍\n\n`+lines.join('\n'),
    tags:'#learnlanguages #languagelearning #'+(it.sent?'travelphrases #everydayphrases':'vocabulary #everydaywords')+' #shorts #reels #'+picks.map(l=>LANGS[l][1].toLowerCase()).join(' #'),
    footer:'Like & follow for a new word every day 🎰'};
};
function bed(total){   // built-in happy backing track, used when no music file is supplied
  const keep=vnow;vnow=0;const beat=60/118,root=[0,5,3,7],arpN=[0,4,7,9,12,9,7,4];
  for(let i=0,t=0;t<total-.05;i++,t=i*beat/2){
    const f=Math.min(1,(total-t)/.8),r=root[Math.floor(i/8)%4];
    tone(262*Math.pow(2,(r+arpN[i%8])/12),{t,dur:.2,type:T.w==='sawtooth'?'triangle':T.w,vol:.04*f,lp:2200});
    if(i%2===0)tone(65.4*Math.pow(2,r/12),{t,dur:.4,vol:.09*f});
    else noise(.06,{t,vol:.025*f,from:6000,to:9000,q:.7});
  }
  vnow=keep;
}
window.renderAudioBase64=async function(withMusic){
  if(!withMusic)bed(TOTAL);
  const buf=await AC.startRendering();
  const L=buf.getChannelData(0),Rr=buf.numberOfChannels>1?buf.getChannelData(1):L,n=buf.length,out=new Int16Array(n*2);
  for(let i=0;i<n;i++){out[2*i]=Math.max(-1,Math.min(1,L[i]))*32767;out[2*i+1]=Math.max(-1,Math.min(1,Rr[i]))*32767;}
  const bytes=new Uint8Array(out.buffer);let str='';
  for(let i=0;i<bytes.length;i+=0x8000)str+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(str);
};

/* ready flag (fonts loaded, layout done) */
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{layout();window._ready=true;});
