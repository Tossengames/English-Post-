  #bar button:focus-visible, #bar select:focus-visible, #seek:focus-visible { outline:2px solid #ffc83d; outline-offset:2px; }
  #bar button[aria-pressed="true"] { background:#34437a; }
  #seek { flex:1; min-width:120px; accent-color:#ffc83d; }
  #time { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; }

</head>

    pop: (t) => tone(t, 0.18, 520, 0.11, 'sine', 0.004, 260),

  const bpm = STORY.bpm || 76, beat = 60 / bpm, ch0 = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [52, 56, 59]], rot = STORY.rot || 0, chords = ch0.map((_, i) => ch0[(i + rot) % 4]);

window.renderAudioBase64 = async function (withVoice) {
  const sr = 48000, len = Math.ceil(TL.total * sr), oc = new OfflineAudioContext(2, len, sr);
  schedule(oc, 0, 0); const buf = await oc.startRendering(), L = buf.getChannelData(0), Rc = buf.getChannelData(1), out = new Int16Array(len * 2);
  for (let i = 0; i < len; i++) { out[2 * i] = clamp(L[i], -1, 1) * 32767; out[2 * i + 1] = clamp(Rc[i], -1, 1) * 32767; }

};

// =====================================================================
//  PUBLIC API (used by the workflow)
// =====================================================================
const TOPICS = TOPIC_DATA.map(topic);
STORY = TOPICS[0]; PAL = STORY.pal;
window.TOPIC_IDS = TOPICS.map((t) => t.id);
window.TOPIC_KINDS = Object.fromEntries(TOPICS.map((t) => [t.id, t.kind]));
window.loadTopic = function (id) {
  STORY = TOPICS.find((x) => x.id === id) || TOPICS[0]; PAL = STORY.pal; STORY.beats.forEach((b) => { if (b.s) delete b.s._lay; }); TL = buildTL(null);
  return { id: STORY.id, title: STORY.title, vo: STORY.beats.map((b) => b.v), caption: STORY.caption, tags: STORY.tags, note: STORY.note,
    footer: 'Follow for a new mind trick every day. For education only.', kind: STORY.kind };
};
window.setVoiceDurations = function (v) { TL = buildTL(v); return { starts: TL.starts, total: TL.total }; };
window._dbg = { get story() { return STORY; }, get tl() { return TL; }, draw: (t) => draw(ctx, t) };

// =====================================================================
//  BROWSER PREVIEW PLAYER
// =====================================================================
const $ = (id) => document.getElementById(id);
let playing = false, tNow = 0, lastTs = 0, soundOn = true, loopOn = true, actx = null, spoken = -1;
const curSpoken = () => { let k = -1; for (let i = 0; i < TL.starts.length; i++) if (tNow >= TL.starts[i]) k = i; return k; };
function stopAudio() { if (actx) { try { actx.close(); } catch (e) {} actx = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
function startAudio() { stopAudio(); if (!soundOn) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); schedule(actx, actx.currentTime + 0.05 - tNow, tNow); } catch (e) {} }
function setPlaying(p) { playing = p; $('play').textContent = p ? 'Pause' : 'Play'; if (p) { spoken = curSpoken(); startAudio(); } else stopAudio(); }
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
function frame(ts) {
  requestAnimationFrame(frame); const dt = lastTs ? (ts - lastTs) / 1000 : 0; lastTs = ts;
  if (playing) {
    tNow += Math.min(dt, 0.1);
    if (tNow >= TL.total) { if (loopOn) { tNow = 0; spoken = -1; startAudio(); } else { tNow = TL.total - 0.01; setPlaying(false); } }
    if (soundOn && window.speechSynthesis) { const k = curSpoken(); if (k > spoken) { spoken = k; speechSynthesis.speak(new SpeechSynthesisUtterance(STORY.beats[k].v)); } }
  }

}
function selectTopic(id) { setPlaying(false); window.loadTopic(id); tNow = 0; $('seek').max = TL.total; }
(async function init() {
  TOPICS.forEach((t, i) => { const o = document.createElement('option'); o.value = t.id; o.textContent = `${i + 1}. ${t.title}`; $('topic').appendChild(o); });
  try { await Promise.race([Promise.all([`60px Anton`, `800 40px Montserrat`, `900 40px Montserrat`, `700 40px Cairo`].map((f) => document.fonts.load(f, 'AaBb123 مرحبا'))), new Promise((r) => setTimeout(r, 8000))]); await document.fonts.ready; } catch (e) {}
  selectTopic(TOPICS[0].id);
  $('topic').onchange = (e) => selectTopic(e.target.value);
  $('play').onclick = () => setPlaying(!playing);
  $('seek').oninput = (e) => { tNow = parseFloat(e.target.value); spoken = curSpoken(); if (playing) startAudio(); };
  $('snd').onclick = (e) => { soundOn = !soundOn; e.target.setAttribute('aria-pressed', soundOn); if (playing) { soundOn ? startAudio() : stopAudio(); } };
  $('loop').onclick = (e) => { loopOn = !loopOn; e.target.setAttribute('aria-pressed', loopOn); };
  $('loading').style.display = 'none'; window._ready = true; requestAnimationFrame(frame);
})();
})();
</script>
