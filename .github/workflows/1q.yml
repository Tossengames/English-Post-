name: 🎮 Post WordFall (quiz(

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

jobs:
  record:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu22-wordfall-v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb chromium-browser libnss3 libgbm1 libasound2 ffmpeg pulseaudio

      - name: Cache pip and ChromeDriver
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.wdm
          key: pip-wdm-wordfall-v1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install selenium webdriver-manager requests

      - name: Set timestamp
        run: echo "TS=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Start virtual display and audio
        run: |
          Xvfb :99 -screen 0 390x844x24 -ac &
          pulseaudio --start --exit-idle-time=-1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 3

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found, HTML will use its built-in fallback"
            echo "music_file=" >> "$GITHUB_OUTPUT"
          else
            IDX=$((RANDOM % ${#VALID[@]}))
            PICKED="${VALID[$IDX]}"
            echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
            echo "Selected: $PICKED"
          fi

      - name: Record and Post to Facebook
        run: |
          python3 << 'PYEOF'
          import os, time, subprocess, random, requests, base64
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          ts         = os.environ.get("TS", "test")
          webm_file  = f"/tmp/wordfall_{ts}.webm"
          mp4_file   = f"/tmp/wordfall_{ts}.mp4"
          html_path  = os.path.abspath("wordfall.html")
          music_file = os.environ.get("MUSIC_FILE", "")
          fb_token   = os.environ.get("FB_PAGE_TOKEN")
          fb_page_id = os.environ.get("FB_PAGE_ID")

          opts = Options()
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=390,844")
          opts.add_argument("--window-position=0,0")
          opts.add_argument("--force-device-scale-factor=1")
          opts.add_argument("--autoplay-policy=no-user-gesture-required")
          opts.add_argument("--disable-background-timer-throttling")
          opts.add_argument("--disable-renderer-backgrounding")
          opts.add_argument("--disable-backgrounding-occluded-windows")
          opts.add_argument("--no-first-run")
          opts.add_argument("--disable-infobars")
          opts.add_argument("--disable-notifications")
          opts.add_argument("--disable-translate")
          opts.add_argument("--use-fake-ui-for-media-stream")
          opts.add_argument("--use-fake-device-for-media-stream")
          opts.add_argument("--allow-file-access-from-files")
          opts.add_experimental_option("excludeSwitches", ["enable-automation"])
          opts.add_experimental_option("useAutomationExtension", False)
          opts.add_experimental_option("mobileEmulation", {
            "deviceMetrics": {"width": 390, "height": 844, "pixelRatio": 1.0},
            "userAgent": "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1"
          })

          print("Starting Chrome...")
          driver = webdriver.Chrome(
            service=Service(ChromeDriverManager().install()), options=opts
          )
          driver.set_window_size(390, 844)
          driver.set_script_timeout(120)

          print(f"Loading file://{html_path}")
          music_param = f"?music={music_file}" if music_file else ""
          driver.get(f"file://{html_path}{music_param}")
          time.sleep(2)
          driver.execute_script("if(typeof AC !== 'undefined') AC.resume();")

          print("Waiting for recording sequence (~18s)...")

          for _ in range(80):
            done = driver.execute_script("return window._recordingDone;")
            if done:
              print("Page signalled done")
              break
            time.sleep(0.5)
          else:
            print("Timeout — force finalizing")
            driver.execute_script("window.stopRecording();")
            time.sleep(2)
            driver.execute_script("window.forceFinalize();")
            time.sleep(2)

          done = driver.execute_script("return window._recordingDone;")
          if not done:
            driver.quit()
            raise RuntimeError("Recording failed to finalize")

          print("Extracting video...")
          b64 = driver.execute_async_script("""
            var done = arguments[0];
            window.getRecordingBase64().then(done).catch(function(e){ console.error(e); done(null); });
          """)
          driver.quit()
          print("Browser closed")

          if not b64:
            raise RuntimeError("Failed to get base64 data")

          with open(webm_file, 'wb') as f:
            f.write(base64.b64decode(b64))
          print(f"Webm: {os.path.getsize(webm_file)/1024/1024:.1f} MB")

          print("Converting to mp4 (high quality)...")
          result = subprocess.run([
            "ffmpeg", "-y", "-i", webm_file,
            "-c:v", "libx264", "-preset", "veryslow", "-crf", "10",
            "-b:v", "20M", "-maxrate", "25M", "-bufsize", "40M",
            "-pix_fmt", "yuv420p", "-vf", "scale=390:844:flags=lanczos",
            "-c:a", "aac", "-b:a", "320k", "-ar", "48000",
            "-movflags", "+faststart", mp4_file
          ], capture_output=True, text=True)

          if not os.path.exists(mp4_file) or os.path.getsize(mp4_file) < 10000:
            print("ffmpeg stderr:", result.stderr[-2000:])
            raise RuntimeError("mp4 conversion failed")

          os.remove(webm_file)
          print(f"mp4: {os.path.getsize(mp4_file)/1024/1024:.1f} MB")

          captions = [
            "🧠 هل تعرف معنى هذه الكلمة الإنجليزية؟ جرّب قبل ما ينتهي الوقت! 📚 اكتب إجابتك بالتعليقات 👇 #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "📖 كلمة جديدة، تحدٍ جديد! هل تقدر تخمن الترجمة الصحيحة؟ 💬 علّق بإجابتك #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "⏱️ عندك ٥ ثواني فقط! وش معنى هذي الكلمة بالانجليزي؟ 🔥 #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "🎯 اختبر مفرداتك الإنجليزية! خمّن الإجابة الصحيحة بالتعليقات 📝 #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "💡 وسّع قاموسك اليوم بكلمة جديدة! هل تعرف معناها؟ 👇 #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "🧩 تحدي المفردات اليومي! جرّب تخمن قبل ظهور الإجابة ✅ #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "🌟 كل يوم كلمة جديدة تقربك من إتقان الإنجليزية 📚 شارك إجابتك! #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
            "🔤 ثلاث خيارات، إجابة واحدة صحيحة... وش رايك؟ 🤔 #تعلم_الانجليزية #كلمة_اليوم #WordQuiz #EnglishForArabs #مسابقة",
          ]
          description = random.choice(captions)

          print("Posting to Facebook...")
          with open(mp4_file, 'rb') as f:
            response = requests.post(
              f"https://graph-video.facebook.com/v18.0/{fb_page_id}/videos",
              data={"description": description, "access_token": fb_token},
              files={"source": (os.path.basename(mp4_file), f, "video/mp4")}
            )

          print(f"Facebook response: {response.status_code}")
          print(response.text)
          if response.status_code == 200:
            print(f"Posted! Video ID: {response.json().get('id')}")
          else:
            raise RuntimeError(f"Post failed: {response.text}")

          os.remove(mp4_file)
          print("Done!")
          PYEOF
        env:
          TS:            ${{ env.TS }}
          DISPLAY:       ":99"
          MUSIC_FILE:    ${{ steps.music.outputs.music_file }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}