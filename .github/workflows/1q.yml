name: Quiz Show Reel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  post:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu22-quiz-v3

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb chromium-browser libnss3 libgbm1 libasound2 ffmpeg pulseaudio

      - name: Cache pip and ChromeDriver
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.wdm
          key: pip-wdm-quiz-v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install selenium webdriver-manager requests

      - name: Set timestamp
        run: echo "TS=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Start virtual display and audio
        run: |
          Xvfb :99 -screen 0 540x960x24 -ac &
          pulseaudio --start --exit-idle-time=-1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 3

      - name: Record and Post
        run: |
          python3 << 'PYEOF'
          import os, time, subprocess, random, requests, base64, glob
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from webdriver_manager.chrome import ChromeDriverManager

          MUSIC_FOLDERS = ["bgmusic3", "Bgmusic3"]
          MUSIC_EXTENSIONS = ["mp3", "wav", "m4a", "mp4", "aac", "ogg", "flac"]

          ts = os.environ.get("TS", "test")
          webm_file = f"/tmp/quiz_{ts}.webm"
          mp4_file = f"/tmp/quiz_{ts}.mp4"

          html_path = os.path.abspath("quiz_show.html")

          fb_token = os.environ.get("FB_PAGE_TOKEN")
          fb_page_id = os.environ.get("FB_PAGE_ID")

          if not fb_token or not fb_page_id:
              raise RuntimeError("Missing Facebook secrets")opts = Options()
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=540,960")
          opts.add_argument("--window-position=0,0")
          opts.add_argument("--force-device-scale-factor=1")
          opts.add_argument("--autoplay-policy=no-user-gesture-required")
          opts.add_argument("--disable-background-timer-throttling")
          opts.add_argument("--disable-renderer-backgrounding")
          opts.add_argument("--disable-backgrounding-occluded-windows")
          opts.add_argument("--no-first-run")
          opts.add_argument("--disable-infobars")
          opts.add_argument("--disable-notifications")
          opts.add_argument("--allow-file-access-from-files")

          # added from working Arab Facts script
          opts.add_argument("--disable-web-security")
          opts.add_argument("--allow-running-insecure-content")

          opts.add_experimental_option(
              "excludeSwitches",
              ["enable-automation"]
          )

          opts.add_experimental_option(
              "useAutomationExtension",
              False
          )

          opts.add_experimental_option(
              "mobileEmulation",
              {
                  "deviceMetrics": {
                      "width": 540,
                      "height": 960,
                      "pixelRatio": 1.0
                  },
                  "userAgent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X)"
              }
          )

          print("Starting Chrome...")

          driver = webdriver.Chrome(
              service=Service(ChromeDriverManager().install()),
              options=opts
          )

          driver.set_window_size(540, 960)
          driver.set_script_timeout(120)

          print(f"Loading {html_path}")
          driver.get(f"file://{html_path}")

          print("Waiting for quiz scene...")
          time.sleep(5)

          print("Starting recording...")

          driver.execute_script("""
              document.body.click();

              if(typeof AC !== 'undefined') {
                  AC.resume();
              }

              window.startRecording(30);
          """)

          print("Recording 30 seconds...")
          time.sleep(30)

          print("Stopping recording...")

          driver.execute_script("""
              window.stopRecording();
          """)

          time.sleep(1)

          driver.execute_script("""
              window.forceFinalize();
          """)

          time.sleep(1)


          for _ in range(30):
              done = driver.execute_script(
                  "return window._recordingDone;"
              )

              if done:
                  print("Recording finalised")
                  break

              time.sleep(0.4)

          else:
              driver.quit()
              raise RuntimeError(
                  "Recording failed to finalise"
              )


          print("Extracting base64...")

          b64 = driver.execute_async_script("""
              var done = arguments[0];

              window.getRecordingBase64()
              .then(done)
              .catch(function(e){
                  done(null);
              });
          """)

          driver.quit()

          if not b64:
              raise RuntimeError(
                  "Failed to get recording data"
              )


          with open(webm_file, "wb") as f:
              f.write(base64.b64decode(b64))


          print("Converting video...")

          result = subprocess.run([
              "ffmpeg",
              "-y",
              "-i",
              webm_file,
              "-c:v",
              "libx264",
              "-preset",
              "fast",
              "-crf",
              "18",
              "-pix_fmt",
              "yuv420p",
              "-vf",
              "scale=1080:1920",
              "-c:a",
              "aac",
              "-b:a",
              "192k",
              "-movflags",
              "+faststart",
              mp4_file
          ], capture_output=True, text=True)


          if not os.path.exists(mp4_file):
              print(result.stderr)
              raise RuntimeError(
                  "MP4 conversion failed"
              )captions = [
              "كم واحد عرف الجواب؟ 👇 #كويز #معلومات #ثقافة_عامة",
              "هل عرفت الإجابة؟ 🤔 شاركنا رأيك #كويز #تعلم",
              "اختبر معلوماتك اليوم 🎯 #تحدي #معلومات",
              "شاركها مع شخص يتحداك 🔥 #كويز"
          ]

          description = random.choice(captions)


          print("Posting to Facebook...")

          with open(mp4_file, "rb") as f:
              response = requests.post(
                  f"https://graph-video.facebook.com/v18.0/{fb_page_id}/videos",
                  data={
                      "description": description,
                      "access_token": fb_token
                  },
                  files={
                      "source": (
                          os.path.basename(mp4_file),
                          f,
                          "video/mp4"
                      )
                  }
              )


          print(response.status_code)
          print(response.text)


          if response.status_code != 200:
              raise RuntimeError(
                  f"Facebook post failed: {response.text}"
              )


          os.remove(mp4_file)

          if os.path.exists(webm_file):
              os.remove(webm_file)


          print("Done!")

          PYEOF

        env:
          TS: ${{ env.TS }}
          DISPLAY: ":99"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}