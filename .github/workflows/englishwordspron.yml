name: english-words-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"  # 10 AM EST / 2 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3 fonts-noto fonts-noto-color-emoji fonts-noto-cjk fonts-noto-core fonts-noto-ui-core

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=18
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 30 words — each: WORD|ENGLISH_PRONUNCIATION|ARABIC_PRONUNCIATION|ARABIC_MEANING
          CONTENT_RAW=(
            "Beautiful|BYOO-tuh-fuhl|بـِيوتِفُل|جميل"
            "Water|WAH-ter|ووتر|ماء"
            "Friend|FREND|فْرِنْد|صديق"
            "Happy|HA-pee|هابي|سعيد"
            "Computer|kuhm-PYOO-ter|كَمْبيوتر|حاسوب"
            "Journey|JER-nee|جِرْني|رحلة"
            "Knowledge|NAH-lij|نالِدج|معرفة"
            "Patience|PAY-shuhns|بيْشِنس|صبر"
            "Success|suhk-SES|سَكْسِس|نجاح"
            "Weather|WE-ther|وِذِر|طقس"
            "Language|LANG-gwij|لانْغْوِدج|لغة"
            "Airport|AIR-port|إيربورت|مطار"
            "Delicious|dih-LI-shuhs|دِلِيشَس|لذيذ"
            "Opportunity|ah-per-TOO-nih-tee|أوبورتيونِتي|فرصة"
            "Health|HELTH|هِلْث|صحة"
            "Schedule|SKE-jool|سْكِيدجول|جدول"
            "Comfortable|KUHM-fter-buhl|كَمْفَرْتَبِل|مريح"
            "Village|VI-lij|ڤِلِدج|قرية"
            "Vegetable|VEJ-tuh-buhl|ڤِجْتَبِل|خضار"
            "Environment|en-VY-run-muhnt|إِنْڤايرونمِنت|بيئة"
            "Government|GUH-vern-muhnt|جَڤِرنمِنت|حكومة"
            "Photograph|FOH-tuh-graf|فوتوغراف|صورة"
            "Adventure|ad-VEN-cher|أَدْڤِنْتْشَر|مغامرة"
            "Chocolate|CHAWK-lit|تشوكلِت|شوكولاتة"
            "Bridge|BRIJ|بْرِدْج|جسر"
            "Neighbor|NAY-ber|نِيْيْبَر|جار"
            "Thought|THAWT|ثوت|فكرة"
            "Through|THROO|ثْرو|عبر"
            "Island|EYE-luhnd|آيلَنْد|جزيرة"
            "Choice|CHOYS|تشويس|خيار"
          )

          IDX=$((RANDOM % ${#CONTENT_RAW[@]}))
          ENTRY="${CONTENT_RAW[$IDX]}"
          WORD=$(echo "$ENTRY" | cut -d'|' -f1)
          PRON_EN=$(echo "$ENTRY" | cut -d'|' -f2)
          PRON_AR=$(echo "$ENTRY" | cut -d'|' -f3)
          MEANING=$(echo "$ENTRY" | cut -d'|' -f4)

          echo "word=$WORD" >> "$GITHUB_OUTPUT"
          echo "pron_en=$PRON_EN" >> "$GITHUB_OUTPUT"
          echo "pron_ar=$PRON_AR" >> "$GITHUB_OUTPUT"
          echo "meaning=$MEANING" >> "$GITHUB_OUTPUT"
          echo "Selected word: $WORD"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WORD="${{ steps.content.outputs.word }}"
          CAPTIONS=(
            "تعلم كلمة إنجليزية جديدة كل يوم. تابعنا لمزيد من الكلمات. #تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL #تعلم_اللغة_الانجليزية #englishwithme"
            "كلمة اليوم: ${WORD}. احفظها وكررها. #تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL #englishvocabulary #تعلم_اللغة"
            "هل تعرف كيف تنطق هذه الكلمة؟ شاركها مع صديقك. #تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL #englishlessons #تعلم_اللغة_الانجليزية"
            "تعلم النطق الصحيح خطوة بخطوة. احفظ هذا الفيديو. #تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL #speakenglish #تعلم_اللغة"
            "كل كلمة جديدة تقربك من إتقان الإنجليزية. تابعنا. #تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL #englishteacher #تعلم_اللغة_الانجليزية"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          WORD="${{ steps.content.outputs.word }}"
          PRON_EN="${{ steps.content.outputs.pron_en }}"
          PRON_AR="${{ steps.content.outputs.pron_ar }}"
          MEANING="${{ steps.content.outputs.meaning }}"

          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, random

          word = os.environ.get("WORD", "Hello")
          pron_en = os.environ.get("PRON_EN", "heh-LOH")
          pron_ar = os.environ.get("PRON_AR", "هيلو")
          meaning = os.environ.get("MEANING", "مرحبا")
          dur = float(os.environ.get("DUR", "18"))
          fadeout = float(os.environ.get("FADEOUT", "16.5"))

          # Fonts: Arabic needs a font that supports Arabic script; Noto Naskh Arabic covers it.
          # English word uses a bold serif/sans for visual punch.
          font_en = "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"
          font_ar_candidates = [
              "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf",
          ]
          font_ar = next((f for f in font_ar_candidates if os.path.exists(f)), font_en)

          # Random color each video for variety (word + accents share the same color family)
          color_palette = [
              "white", "gold", "lightyellow", "lightcyan",
              "lightpink", "peachpuff", "lavender", "palegreen",
              "lightskyblue", "wheat", "khaki", "lightsalmon",
              "mistyrose", "honeydew", "aliceblue"
          ]
          main_color = random.choice(color_palette)
          # secondary accent color, distinct from main, for meaning/pron lines
          accent_palette = [c for c in color_palette if c != main_color]
          accent_color = random.choice(accent_palette)

          def esc(t):
              return t.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          # Rotating Arabic intro/top prompt line
          intros = [
              "تعلم كلمة إنجليزية جديدة",
              "كلمة اليوم باللغة الإنجليزية",
              "تعلم النطق الصحيح",
              "وسّع مفرداتك الإنجليزية",
              "كلمة جديدة كل يوم",
          ]
          intro_text = random.choice(intros)

          filters = []
          text_start = 1.8
          line_interval = 1.1
          y = 0

          def fade_in(t):
              return f"if(lt(t,{t:.2f}),0,min(1,(t-{t:.2f})/0.35))"

          # 1) Top: Arabic intro line
          y_intro = 160
          t_intro = 0.4
          filters.append(
              f"drawtext=text='{esc(intro_text)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.95"
              f":fontsize=50"
              f":x=(w-text_w)/2"
              f":y={y_intro}"
              f":alpha='{fade_in(t_intro)}'"
              f":shadowcolor=black@0.85:shadowx=3:shadowy=3"
          )

          # 2) The English word (large, bold, center-upper)
          y_word = 460
          t_word = text_start
          filters.append(
              f"drawtext=text='{esc(word)}'"
              f":fontfile={font_en}"
              f":fontcolor={main_color}"
              f":fontsize=100"
              f":x=(w-text_w)/2"
              f":y={y_word}"
              f":alpha='{fade_in(t_word)}'"
              f":shadowcolor=black@0.85:shadowx=4:shadowy=4"
          )

          # 3) Pronunciation in English letters
          y_pron_en = 640
          t_pron_en = text_start + line_interval
          filters.append(
              f"drawtext=text='{esc(pron_en)}'"
              f":fontfile={font_en}"
              f":fontcolor={accent_color}"
              f":fontsize=58"
              f":x=(w-text_w)/2"
              f":y={y_pron_en}"
              f":alpha='{fade_in(t_pron_en)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # 4) Pronunciation in Arabic letters
          y_pron_ar = 760
          t_pron_ar = text_start + line_interval * 2
          filters.append(
              f"drawtext=text='{esc(pron_ar)}'"
              f":fontfile={font_ar}"
              f":fontcolor={accent_color}"
              f":fontsize=64"
              f":x=(w-text_w)/2"
              f":y={y_pron_ar}"
              f":alpha='{fade_in(t_pron_ar)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # 5) Meaning in Arabic
          y_meaning = 900
          t_meaning = text_start + line_interval * 3
          filters.append(
              f"drawtext=text='{esc('المعنى: ' + meaning)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.9"
              f":fontsize=52"
              f":x=(w-text_w)/2"
              f":y={y_meaning}"
              f":alpha='{fade_in(t_meaning)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # 6) CTA box near bottom — solid background box + simple Arabic CTA text
          ctas = ["تابعنا", "اترك تعليق", "شارك مع صديق", "احفظ الفيديو", "تابعنا لمزيد"]
          cta_text = random.choice(ctas)
          t_cta = text_start + line_interval * 4 + 0.3
          box_y_top = 1580
          box_y_bottom = 1680
          # semi-opaque box behind CTA text
          filters.append(
              f"drawbox=x=240:y={box_y_top}:w=600:h={box_y_bottom - box_y_top}"
              f":color=black@0.55:t=fill"
              f":enable='gte(t,{t_cta:.2f})'"
          )
          filters.append(
              f"drawtext=text='{esc(cta_text)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=lightyellow"
              f":fontsize=56"
              f":x=(w-text_w)/2"
              f":y={box_y_top + 22}"
              f":alpha='{fade_in(t_cta)}'"
              f":shadowcolor=black@0.8:shadowx=2:shadowy=2"
          )

          all_dt = ",".join(filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"fade=t=in:st=0:d=1,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          print(f"Built filter | word: {word} | main_color: {main_color} | accent: {accent_color} | intro: {intro_text} | cta: {cta_text}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 16 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4
        env:
          WORD: ${{ steps.content.outputs.word }}
          PRON_EN: ${{ steps.content.outputs.pron_en }}
          PRON_AR: ${{ steps.content.outputs.pron_ar }}
          MEANING: ${{ steps.content.outputs.meaning }}
          DUR: "18"
          FADEOUT: "16.5"

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All post attempts failed"
          exit 1
