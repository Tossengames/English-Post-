name: english-words-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"  # 10 AM EST / 2 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3 python3-pip python3-pil espeak-ng fonts-noto fonts-noto-extra fonts-noto-color-emoji fonts-noto-cjk fonts-noto-core fonts-noto-ui-core
          pip install --quiet --break-system-packages Pillow || pip install --quiet Pillow

      - name: cache-piper-model
        id: piper_cache
        uses: actions/cache@v4
        with:
          path: /home/runner/piper-voices
          key: piper-en_US-voice-v1

      - name: setup-piper
        id: piper_setup
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -e
          pip install --quiet piper-tts --break-system-packages || pip install --quiet piper-tts

          mkdir -p /home/runner/piper-voices
          cd /home/runner/piper-voices

          if [ ! -f "en_US-amy-medium.onnx" ]; then
            echo "Downloading Piper English voice model (first run, will be cached after)..."
            timeout 60 curl -sfL -o en_US-amy-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx" || exit 1
            timeout 30 curl -sfL -o en_US-amy-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json" || exit 1
          else
            echo "Piper voice model found in cache, skipping download."
          fi

          echo "test" | python3 -m piper --model en_US-amy-medium.onnx --output_file /tmp/piper_test.wav
          test -s /tmp/piper_test.wav
          echo "piper_ready=true" >> "$GITHUB_OUTPUT"

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 30 English words — each: WORD|ENGLISH_PRONUNCIATION|ARABIC_PRONUNCIATION|ARABIC_MEANING
          CONTENT_RAW=(
            "Sunrise|SUN-ryz|صانرايز|شروق الشمس"
            "Ocean|OH-shun|أوشن|محيط"
            "Freedom|FREE-duhm|فريدم|حرية"
            "Journey|JER-nee|جيرني|رحلة"
            "Wonder|WUHN-der|واندر|عجب"
            "Harmony|HAR-muh-nee|هارموني|انسجام"
            "Courage|KUR-ij|كاريج|شجاعة"
            "Gratitude|GRAT-i-tood|غراتيتود|امتنان"
            "Serenity|suh-REN-i-tee|سيرينيتي|هدوء"
            "Discovery|dis-KUHV-ree|ديسكوفري|اكتشاف"
            "Kindness|KYND-nes|كايندنس|لطف"
            "Laughter|LAF-ter|لافتر|ضحك"
            "Mystery|MIS-tuh-ree|ميستري|غموض"
            "Horizon|huh-RY-zuhn|هورايزن|أفق"
            "Butterfly|BUT-er-fly|باترفلاي|فراشة"
            "Mountain|MOWN-tin|ماونتن|جبل"
            "Whisper|WIS-per|ويسبر|همس"
            "Sunset|SUN-set|صانسيت|غروب الشمس"
            "Rainbow|RAYN-boh|رينبو|قوس قزح"
            "Treasure|TREZH-er|تريجر|كنز"
            "Wisdom|WIZ-duhm|ويزدم|حكمة"
            "Memory|MEM-uh-ree|ميموري|ذاكرة"
            "Diamond|DY-muhnd|دايموند|ماسة"
            "Destiny|DES-ti-nee|ديستيني|قدر"
            "Imagination|i-maj-i-NAY-shun|إيماجينيشن|خيال"
            "Universe|YOO-ni-vers|يونيفيرس|كون"
            "Reflection|ri-FLEK-shun|ريفليكشن|انعكاس"
            "Balance|BAL-uhns|بالانس|توازن"
            "Melody|MEL-uh-dee|ميلودي|لحن"
            "Twilight|TWY-lyt|توايلايت|شفق"
          )

          IDX=$((RANDOM % ${#CONTENT_RAW[@]}))
          ENTRY="${CONTENT_RAW[$IDX]}"
          WORD=$(echo "$ENTRY" | cut -d'|' -f1)
          PRON_EN=$(echo "$ENTRY" | cut -d'|' -f2)
          PRON_AR=$(echo "$ENTRY" | cut -d'|' -f3)
          MEANING=$(echo "$ENTRY" | cut -d'|' -f4)

          echo "word=$WORD" >> "$GITHUB_OUTPUT"
          echo "pron_en=$PRON_EN" >> "$GITHUB_OUTPUT"
          echo "pron_ar=$PRON_AR" >> "$GITHUB_OUTPUT"
          echo "meaning=$MEANING" >> "$GITHUB_OUTPUT"
          echo "Selected word: $WORD | pron_en: $PRON_EN | pron_ar: $PRON_AR | meaning: $MEANING"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            echo "image_caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WORD="${{ steps.content.outputs.word }}"
          PRON_AR="${{ steps.content.outputs.pron_ar }}"
          MEANING="${{ steps.content.outputs.meaning }}"

          CAPTIONS=(
            "كلمة اليوم بالإنجليزية 🇬🇧 #تعلم_الانجليزية #english #learnenglish"
            "تعلم معنا 🇬🇧 #تعلم_الانجليزية #english #learnenglish"
            "كلمة جديدة كل يوم 🇬🇧 #تعلم_الانجليزية #english #learnenglish"
            "تابعنا لمزيد 🇬🇧 #تعلم_الانجليزية #english #learnenglish"
            "تعلم الإنجليزية بسهولة 🇬🇧 #تعلم_الانجليزية #english #learnenglish"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

          IMAGE_CAPTION="${WORD} - ${PRON_AR} - ${MEANING} 🇬🇧 #تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL"
          echo "image_caption=$IMAGE_CAPTION" >> "$GITHUB_OUTPUT"

      - name: synthesize-speech
        id: tts
        timeout-minutes: 2
        continue-on-error: true
        run: |
          WORD="${{ steps.content.outputs.word }}"

          echo "Synthesizing speech parts for: $WORD"

          SUCCESS=0

          synth_piper() {
            local text="$1"
            local out="$2"
            echo "$text" | timeout 20 python3 -m piper \
              --model /home/runner/piper-voices/en_US-amy-medium.onnx \
              --output_file "$out" 2>/tmp/piper_err.log
          }

          synth_espeak() {
            local text="$1"
            local out="$2"
            timeout 15 espeak-ng -v en-us -s 150 -w "$out" "$text" 2>/tmp/espeak_err.log
          }

          if [ "${{ steps.piper_setup.outputs.piper_ready }}" = "true" ]; then
            echo "Attempting Piper TTS for all parts..."
            synth_piper "Let's learn how to pronounce English words." opening_raw.wav || true
            synth_piper "The word is." intro_raw.wav || true
            synth_piper "$WORD." word1_raw.wav || true
            synth_piper "Let's repeat." repeat_raw.wav || true
            synth_piper "$WORD." word2_raw.wav || true
            synth_piper "Follow us and leave a comment." closing_raw.wav || true
            if [ -s opening_raw.wav ] && [ -s intro_raw.wav ] && [ -s word1_raw.wav ] && [ -s repeat_raw.wav ] && [ -s word2_raw.wav ] && [ -s closing_raw.wav ]; then
              SUCCESS=1
              echo "Piper succeeded for all parts."
            fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "Falling back to espeak-ng for all parts..."
            synth_espeak "Let's learn how to pronounce English words." opening_raw.wav
            synth_espeak "The word is." intro_raw.wav
            synth_espeak "$WORD." word1_raw.wav
            synth_espeak "Let's repeat." repeat_raw.wav
            synth_espeak "$WORD." word2_raw.wav
            synth_espeak "Follow us and leave a comment." closing_raw.wav
            if [ -s opening_raw.wav ] && [ -s intro_raw.wav ] && [ -s word1_raw.wav ] && [ -s repeat_raw.wav ] && [ -s word2_raw.wav ] && [ -s closing_raw.wav ]; then
              SUCCESS=1
              echo "espeak-ng succeeded for all parts."
            fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "All TTS methods failed."
            echo "tts_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in opening_raw intro_raw word1_raw repeat_raw word2_raw closing_raw; do
            timeout 10 ffmpeg -hide_banner -loglevel error -y -i "${f}.wav" -ac 2 -ar 44100 -filter:a "volume=1.8" "${f}_norm.wav"
          done

          get_dur() {
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$1" 2>/dev/null
          }

          OPENING_DUR=$(get_dur opening_raw_norm.wav)
          INTRO_DUR=$(get_dur intro_raw_norm.wav)
          WORD1_DUR=$(get_dur word1_raw_norm.wav)
          REPEAT_DUR=$(get_dur repeat_raw_norm.wav)
          WORD2_DUR=$(get_dur word2_raw_norm.wav)
          CLOSING_DUR=$(get_dur closing_raw_norm.wav)

          echo "opening_dur=$OPENING_DUR" >> "$GITHUB_OUTPUT"
          echo "intro_dur=$INTRO_DUR" >> "$GITHUB_OUTPUT"
          echo "word1_dur=$WORD1_DUR" >> "$GITHUB_OUTPUT"
          echo "repeat_dur=$REPEAT_DUR" >> "$GITHUB_OUTPUT"
          echo "word2_dur=$WORD2_DUR" >> "$GITHUB_OUTPUT"
          echo "closing_dur=$CLOSING_DUR" >> "$GITHUB_OUTPUT"

          echo "Durations: opening=$OPENING_DUR intro=$INTRO_DUR word1=$WORD1_DUR repeat=$REPEAT_DUR word2=$WORD2_DUR closing=$CLOSING_DUR"

          timeout 10 ffmpeg -hide_banner -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.3 silence_short.wav
          timeout 10 ffmpeg -hide_banner -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 1.2 silence_long.wav
          timeout 10 ffmpeg -hide_banner -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.6 silence_medium.wav

          timeout 15 ffmpeg -hide_banner -loglevel error -y \
            -i opening_raw_norm.wav -i silence_medium.wav \
            -i intro_raw_norm.wav -i silence_short.wav \
            -i word1_raw_norm.wav -i silence_long.wav \
            -i repeat_raw_norm.wav -i silence_short.wav \
            -i word2_raw_norm.wav -i silence_medium.wav \
            -i closing_raw_norm.wav \
            -filter_complex "[0:a][1:a][2:a][3:a][4:a][5:a][6:a][7:a][8:a][9:a][10:a]concat=n=11:v=0:a=1[aout]" \
            -map "[aout]" speech_final.wav

          echo "tts_available=true" >> "$GITHUB_OUTPUT"

      - name: pick-layout
        id: layout_pick
        timeout-minutes: 1
        run: |
          LAYOUTS=("A" "B" "C")
          IDX=$((RANDOM % 3))
          echo "layout=${LAYOUTS[$IDX]}" >> "$GITHUB_OUTPUT"
          echo "Picked layout: ${LAYOUTS[$IDX]}"

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=22
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"

          echo "Word check: WORD=$WORD PRON_EN=$PRON_EN PRON_AR=$PRON_AR MEANING=$MEANING"

          python3 << 'PYEOF'
          import os, random
          from PIL import Image, ImageDraw, ImageFont

          word = os.environ.get("WORD", "Hello")
          pron_en = os.environ.get("PRON_EN", "heh-LOH")
          pron_ar = os.environ.get("PRON_AR", "هيلو")
          meaning = os.environ.get("MEANING", "مرحبا")
          layout = os.environ.get("LAYOUT", "A")

          opening_dur = float(os.environ.get("OPENING_DUR", "2.5") or "2.5")
          intro_dur = float(os.environ.get("INTRO_DUR", "0.9") or "0.9")
          word1_dur = float(os.environ.get("WORD1_DUR", "0.8") or "0.8")
          repeat_dur = float(os.environ.get("REPEAT_DUR", "0.9") or "0.9")
          word2_dur = float(os.environ.get("WORD2_DUR", "0.8") or "0.8")
          closing_dur = float(os.environ.get("CLOSING_DUR", "2.2") or "2.2")

          font_en_candidates = [
              "/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]
          font_en_path = next((f for f in font_en_candidates if os.path.exists(f)), font_en_candidates[-1])

          font_ar_candidates = [
              "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf",
          ]
          font_ar_path = next((f for f in font_ar_candidates if os.path.exists(f)), font_en_path)

          def esc(t):
              return t.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          t_fade_in = 0.4
          t_opening_start = 0.5
          t_opening_end = t_opening_start + opening_dur
          t_intro_start = t_opening_end + 0.35
          t_intro_end = t_intro_start + intro_dur
          t_word1_start = t_intro_end + 0.3
          t_word1_end = t_word1_start + word1_dur
          t_info_reveal = t_word1_end + 0.2
          t_repeat_start = t_word1_end + 1.2
          t_repeat_end = t_repeat_start + repeat_dur
          t_word2_start = t_repeat_end + 0.3
          t_word2_end = t_word2_start + word2_dur
          t_closing_start = max(t_word2_end + 0.3, t_info_reveal + 2.5)
          t_closing_end = t_closing_start + closing_dur
          total_dur = t_closing_end + 1.8
          fadeout_start = total_dur - 1.5

          layouts = {
              "A": {"word_y": 420, "word_size": 110, "word_color": "white", "pron_en_y": 630, "pron_en_size": 50, "pron_color": "#ffe066", "pron_ar_y": 750, "pron_ar_size": 58, "meaning_y": 880, "meaning_size": 46},
              "B": {"word_y": 360, "word_size": 120, "word_color": "#fff3b0", "pron_en_y": 580, "pron_en_size": 48, "pron_color": "white", "pron_ar_y": 700, "pron_ar_size": 56, "meaning_y": 840, "meaning_size": 44},
              "C": {"word_y": 460, "word_size": 104, "word_color": "white", "pron_en_y": 660, "pron_en_size": 52, "pron_color": "#ffd6a5", "pron_ar_y": 780, "pron_ar_size": 60, "meaning_y": 910, "meaning_size": 48},
          }
          L = layouts.get(layout, layouts["A"])

          LABEL_SIZE = 40
          LABEL_COLOR = "#00e5ff"

          filters = []

          def fade_in(t):
              return f"if(lt(t,{t:.2f}),0,min(1,(t-{t:.2f})/0.25))"

          subtitle_colors = ["#FF6B6B", "#4ECDC4", "#FFD93D", "#A78BFA", "#FF9F68", "#6BCB77"]

          def make_subtitle_png(text, out_path):
              fsize = 46
              font = ImageFont.truetype(font_ar_path, fsize)
              tmp_img = Image.new("RGBA", (10, 10))
              tmp_draw = ImageDraw.Draw(tmp_img)
              bbox = tmp_draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              pad_x, pad_y = 50, 30
              box_w, box_h = tw + pad_x * 2, th + pad_y * 2
              img = Image.new("RGBA", (box_w, box_h), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              color = random.choice(subtitle_colors)
              draw.rounded_rectangle([(0, 0), (box_w - 1, box_h - 1)], radius=28, fill=color)
              draw.text((pad_x - bbox[0], pad_y - bbox[1]), text, font=font, fill="white")
              img.save(out_path)
              return box_w, box_h

          sub1_w, sub1_h = make_subtitle_png("لنتعلم كيف ننطق الكلمات الإنجليزية", "/tmp/sub1.png")
          sub2_w, sub2_h = make_subtitle_png("الكلمة هي", "/tmp/sub2.png")
          sub3_w, sub3_h = make_subtitle_png("لنكررها", "/tmp/sub3.png")
          sub4_w, sub4_h = make_subtitle_png("تابعونا واتركوا تعليقا", "/tmp/sub4.png")

          filters.append(
              f"drawtext=text='{esc('الكلمة')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor={LABEL_COLOR}:fontsize={LABEL_SIZE}"
              f":x=(w-text_w)/2:y={L['word_y'] - 75}"
              f":alpha='{fade_in(t_word1_start)}'"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2"
              f":borderw=2:bordercolor=black@0.5"
          )
          filters.append(
              f"drawtext=text='{esc(word)}'"
              f":fontfile={font_en_path}"
              f":fontcolor={L['word_color']}:fontsize={L['word_size']}"
              f":x=(w-text_w)/2:y={L['word_y']}"
              f":alpha='{fade_in(t_word1_start)}'"
              f":shadowcolor=black@0.85:shadowx=4:shadowy=4"
          )
          filters.append(
              f"drawtext=text='{esc('طريقة النطق')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor={LABEL_COLOR}:fontsize={LABEL_SIZE}"
              f":x=(w-text_w)/2:y={L['pron_en_y'] - 55}"
              f":alpha='{fade_in(t_info_reveal)}'"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2"
              f":borderw=2:bordercolor=black@0.5"
          )
          filters.append(
              f"drawtext=text='{esc(pron_en)}'"
              f":fontfile={font_en_path}"
              f":fontcolor={L['pron_color']}:fontsize={L['pron_en_size']}"
              f":x=(w-text_w)/2:y={L['pron_en_y']}"
              f":alpha='{fade_in(t_info_reveal)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc(pron_ar)}'"
              f":fontfile={font_ar_path}"
              f":fontcolor={L['pron_color']}:fontsize={L['pron_ar_size']}"
              f":x=(w-text_w)/2:y={L['pron_ar_y']}"
              f":alpha='{fade_in(t_info_reveal + 0.2)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc('المعنى')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor={LABEL_COLOR}:fontsize={LABEL_SIZE}"
              f":x=(w-text_w)/2:y={L['meaning_y'] - 55}"
              f":alpha='{fade_in(t_info_reveal + 0.4)}'"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2"
              f":borderw=2:bordercolor=black@0.5"
          )
          filters.append(
              f"drawtext=text='{esc(meaning)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.95:fontsize={L['meaning_size']}"
              f":x=(w-text_w)/2:y={L['meaning_y']}"
              f":alpha='{fade_in(t_info_reveal + 0.5)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          dt_chain = ",".join(filters)

          vfilter_base = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,setsar=1,gblur=sigma=25,"
              f"fade=t=in:st=0:d={t_fade_in},"
              f"fade=t=out:st={fadeout_start:.2f}:d=1.5,"
              f"{dt_chain}[base]"
          )

          sub_y = 1180
          overlay_chain = (
              f"[base][1:v]overlay=(W-w)/2:{sub_y}:enable='between(t,{t_opening_start:.2f},{t_opening_end + 0.1:.2f})'[s1];"
              f"[s1][2:v]overlay=(W-w)/2:{sub_y}:enable='between(t,{t_intro_start:.2f},{t_intro_end + 0.1:.2f})'[s2];"
              f"[s2][3:v]overlay=(W-w)/2:{sub_y}:enable='between(t,{t_repeat_start:.2f},{t_repeat_end + 0.1:.2f})'[s3];"
              f"[s3][4:v]overlay=(W-w)/2:{sub_y}:enable='between(t,{t_closing_start:.2f},{t_closing_end + 0.1:.2f})'[vout]"
          )

          full_filter = vfilter_base + ";" + overlay_chain

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(full_filter)

          with open("/tmp/total_dur.txt", "w") as f:
              f.write(f"{total_dur:.2f}")

          with open("/tmp/shared_state.txt", "w") as f:
              f.write(f"{word}\n{pron_en}\n{pron_ar}\n{meaning}\n{layout}\n")

          print(f"Timeline: opening={t_opening_start:.2f}-{t_opening_end:.2f} word1={t_word1_start:.2f}-{t_word1_end:.2f} info_reveal={t_info_reveal:.2f} repeat={t_repeat_start:.2f}-{t_repeat_end:.2f} word2={t_word2_start:.2f}-{t_word2_end:.2f} closing={t_closing_start:.2f}-{t_closing_end:.2f} total={total_dur:.2f}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)
          TOTAL_DUR=$(cat /tmp/total_dur.txt)
          FETCH=$(echo "$TOTAL_DUR + 2" | bc)

          echo "Downloading video (total_dur=$TOTAL_DUR, fetching $FETCH s)..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$TOTAL_DUR" -ac 2 -ar 44100 music_clip.mp3

          FADEOUT=$(echo "$TOTAL_DUR - 1.5" | bc)
          SPEECH_DUCK_END=$(echo "$TOTAL_DUR - 2" | bc)

          if [ "${{ steps.tts.outputs.tts_available }}" = "true" ]; then
            echo "Mixing with TTS speech overlay..."
            # NOTE: input order is 0=source.mp4, 1-4=subtitle PNGs, 5=music, 6=speech
            AFILTER="[5:a]volume=0.7,afade=t=in:st=0:d=0.5,afade=t=out:st=${FADEOUT}:d=1.5,volume='if(lt(t,${SPEECH_DUCK_END}),0.25,0.7)':eval=frame[music];[6:a]adelay=500|500,volume=0.85[speech];[music][speech]amix=inputs=2:duration=first:dropout_transition=0,volume=1.4[aout]"
            timeout 240 ffmpeg -hide_banner -loglevel error -y \
              -i source.mp4 \
              -i /tmp/sub1.png -i /tmp/sub2.png -i /tmp/sub3.png -i /tmp/sub4.png \
              -i music_clip.mp3 \
              -i speech_final.wav \
              -filter_complex "${VFILTER};${AFILTER}" \
              -map "[vout]" \
              -map "[aout]" \
              -t "$TOTAL_DUR" \
              -c:v libx264 -preset medium -crf 16 \
              -c:a aac -b:a 192k \
              -movflags +faststart \
              -pix_fmt yuv420p \
              final.mp4
          else
            echo "No TTS available, music-only audio..."
            # NOTE: input order here is 0=source.mp4, 1-4=subtitle PNGs, 5=music (no speech input in this branch)
            timeout 240 ffmpeg -hide_banner -loglevel error -y \
              -i source.mp4 \
              -i /tmp/sub1.png -i /tmp/sub2.png -i /tmp/sub3.png -i /tmp/sub4.png \
              -i music_clip.mp3 \
              -filter_complex "${VFILTER};[5:a]volume=0.9,afade=t=in:st=0:d=0.5,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
              -map "[vout]" \
              -map "[aout]" \
              -t "$TOTAL_DUR" \
              -c:v libx264 -preset medium -crf 16 \
              -c:a aac -b:a 192k \
              -movflags +faststart \
              -pix_fmt yuv420p \
              final.mp4
          fi

          ls -lh final.mp4
        env:
          WORD: ${{ steps.content.outputs.word }}
          PRON_EN: ${{ steps.content.outputs.pron_en }}
          PRON_AR: ${{ steps.content.outputs.pron_ar }}
          MEANING: ${{ steps.content.outputs.meaning }}
          LAYOUT: ${{ steps.layout_pick.outputs.layout }}
          OPENING_DUR: ${{ steps.tts.outputs.opening_dur }}
          INTRO_DUR: ${{ steps.tts.outputs.intro_dur }}
          WORD1_DUR: ${{ steps.tts.outputs.word1_dur }}
          REPEAT_DUR: ${{ steps.tts.outputs.repeat_dur }}
          WORD2_DUR: ${{ steps.tts.outputs.word2_dur }}
          CLOSING_DUR: ${{ steps.tts.outputs.closing_dur }}

      - name: process-image
        timeout-minutes: 3
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"

          WORD=$(sed -n '1p' /tmp/shared_state.txt)
          PRON_EN=$(sed -n '2p' /tmp/shared_state.txt)
          PRON_AR=$(sed -n '3p' /tmp/shared_state.txt)
          MEANING=$(sed -n '4p' /tmp/shared_state.txt)
          LAYOUT=$(sed -n '5p' /tmp/shared_state.txt)

          echo "Image step check: WORD=$WORD LAYOUT=$LAYOUT"

          timeout 60 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -frames:v 1 bg_frame.jpg

          python3 << 'PYEOF'
          import os

          with open("/tmp/shared_state.txt") as f:
              lines = [l.rstrip("\n") for l in f.readlines()]
          word, pron_en, pron_ar, meaning, layout = lines[0:5]

          font_en_candidates = [
              "/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]
          font_en = next((f for f in font_en_candidates if os.path.exists(f)), font_en_candidates[-1])

          font_ar_candidates = [
              "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf",
          ]
          font_ar = next((f for f in font_ar_candidates if os.path.exists(f)), font_en)

          def esc(t):
              return t.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          layouts = {
              "A": {"word_y": 420, "word_size": 110, "word_color": "white", "pron_en_y": 630, "pron_en_size": 50, "pron_color": "#ffe066", "pron_ar_y": 750, "pron_ar_size": 58, "meaning_y": 880, "meaning_size": 46},
              "B": {"word_y": 360, "word_size": 120, "word_color": "#fff3b0", "pron_en_y": 580, "pron_en_size": 48, "pron_color": "white", "pron_ar_y": 700, "pron_ar_size": 56, "meaning_y": 840, "meaning_size": 44},
              "C": {"word_y": 460, "word_size": 104, "word_color": "white", "pron_en_y": 660, "pron_en_size": 52, "pron_color": "#ffd6a5", "pron_ar_y": 780, "pron_ar_size": 60, "meaning_y": 910, "meaning_size": 48},
          }
          L = layouts.get(layout, layouts["A"])
          LABEL_SIZE = 40
          LABEL_COLOR = "#00e5ff"

          filters = []
          filters.append(
              f"drawtext=text='{esc('الكلمة')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor={LABEL_COLOR}:fontsize={LABEL_SIZE}:x=(w-text_w)/2:y={L['word_y'] - 75}"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2:borderw=2:bordercolor=black@0.5"
          )
          filters.append(
              f"drawtext=text='{esc(word)}'"
              f":fontfile={font_en}"
              f":fontcolor={L['word_color']}:fontsize={L['word_size']}:x=(w-text_w)/2:y={L['word_y']}"
              f":shadowcolor=black@0.85:shadowx=4:shadowy=4"
          )
          filters.append(
              f"drawtext=text='{esc('طريقة النطق')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor={LABEL_COLOR}:fontsize={LABEL_SIZE}:x=(w-text_w)/2:y={L['pron_en_y'] - 55}"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2:borderw=2:bordercolor=black@0.5"
          )
          filters.append(
              f"drawtext=text='{esc(pron_en)}'"
              f":fontfile={font_en}"
              f":fontcolor={L['pron_color']}:fontsize={L['pron_en_size']}:x=(w-text_w)/2:y={L['pron_en_y']}"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc(pron_ar)}'"
              f":fontfile={font_ar}"
              f":fontcolor={L['pron_color']}:fontsize={L['pron_ar_size']}:x=(w-text_w)/2:y={L['pron_ar_y']}"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc('المعنى')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor={LABEL_COLOR}:fontsize={LABEL_SIZE}:x=(w-text_w)/2:y={L['meaning_y'] - 55}"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2:borderw=2:bordercolor=black@0.5"
          )
          filters.append(
              f"drawtext=text='{esc(meaning)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.95:fontsize={L['meaning_size']}:x=(w-text_w)/2:y={L['meaning_y']}"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          all_dt = ",".join(filters)
          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,setsar=1,gblur=sigma=25,{all_dt}"
          )

          with open("/tmp/ifilter.txt", "w") as f:
              f.write(vfilter)
          PYEOF

          IFILTER=$(cat /tmp/ifilter.txt)

          timeout 60 ffmpeg -hide_banner -loglevel error -y \
            -i bg_frame.jpg \
            -vf "$IFILTER" \
            -frames:v 1 \
            final_image.jpg

          ls -lh final_image.jpg

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook video post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Video posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Video post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All video post attempts failed"
          exit 1

      - name: post-image-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_CAPTION: ${{ steps.caption.outputs.image_caption }}
        run: |
          set -e
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook image post attempt $attempt..."
            RESP=$(timeout 60 curl -sf -X POST "${API}/${PAGE_ID}/photos" \
              -F "source=@final_image.jpg" \
              -F "caption=${IMAGE_CAPTION}" \
              -F "published=true" \
              -F "access_token=${PAGE_TOKEN}") || true

            OK=$(echo "$RESP" | jq -r '.id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Image posted! Photo ID: $OK"
              exit 0
            fi

            echo "Image post failed attempt $attempt: $RESP"
            sleep 10
          done

          echo "All image post attempts failed"
          exit 1