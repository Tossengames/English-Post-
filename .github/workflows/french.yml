name: french-words-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 15 * * *"  # 11 AM EST / 3 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3 python3-pip espeak-ng fonts-noto fonts-noto-extra fonts-noto-color-emoji fonts-noto-cjk fonts-noto-core fonts-noto-ui-core

      - name: cache-piper-model
        id: piper_cache
        uses: actions/cache@v4
        with:
          path: /home/runner/piper-voices
          key: piper-fr_FR-voice-v1

      - name: setup-piper
        id: piper_setup
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -e
          pip install --quiet piper-tts --break-system-packages || pip install --quiet piper-tts

          mkdir -p /home/runner/piper-voices
          cd /home/runner/piper-voices

          if [ ! -f "fr_FR-siwis-medium.onnx" ]; then
            echo "Downloading Piper French voice model (first run, will be cached after)..."
            timeout 60 curl -sfL -o fr_FR-siwis-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx" || exit 1
            timeout 30 curl -sfL -o fr_FR-siwis-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json" || exit 1
          else
            echo "Piper voice model found in cache, skipping download."
          fi

          echo "test" | python3 -m piper --model fr_FR-siwis-medium.onnx --output_file /tmp/piper_test.wav
          test -s /tmp/piper_test.wav
          echo "piper_ready=true" >> "$GITHUB_OUTPUT"

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=11
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature| paris| eiffel tower"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 30 NEW French words — each: WORD|ENGLISH_PRONUNCIATION|ARABIC_PRONUNCIATION|ARABIC_MEANING
          CONTENT_RAW=(
            "Plage|PLAHZH|بلاج|شاطئ"
            "Montagne|mohn-TAHN-yuh|مونتانيا|جبل"
            "Nuage|noo-AHZH|نواج|سحابة"
            "Étoile|ay-TWAHL|إيتوال|نجمة"
            "Lune|LEWN|لون|قمر"
            "Soleil|so-LAY|سولاي|شمس"
            "Fleur|FLUR|فلور|زهرة"
            "Arbre|AHR-bruh|أربر|شجرة"
            "Oiseau|wah-ZOH|وازو|طائر"
            "Papillon|pah-pee-YOHN|بابيون|فراشة"
            "Musique|myoo-ZEEK|ميوزيك|موسيقى"
            "Danse|DAHNS|دانس|رقص"
            "Peinture|pan-TEWR|بانتور|لوحة"
            "Histoire|ees-TWAHR|إيستوار|قصة"
            "Voyage|vwah-YAHZH|ڤوياج|رحلة"
            "Sourire|soo-REER|سوریر|ابتسامة"
            "Silence|see-LAHNS|سيلانس|صمت"
            "Rêve|REHV|ريڤ|حلم"
            "Espoir|es-PWAHR|إسبوار|أمل"
            "Courage|koo-RAHZH|كوراج|شجاعة"
            "Sagesse|sah-ZHES|ساجيس|حكمة"
            "Vérité|vay-ree-TAY|ڤيريتيه|حقيقة"
            "Respect|res-PEK|ريسبيك|احترام"
            "Confiance|kohn-fee-AHNS|كونفيانس|ثقة"
            "Patience|pah-syAHNS|باسيانس|صبر"
            "Gentillesse|zhahn-tee-YES|جانتييس|لطف"
            "Générosité|zhay-nay-roh-see-TAY|جينيروزيتيه|كرم"
            "Simplicité|san-plee-see-TAY|سامبليسيتيه|بساطة"
            "Créativité|kray-ah-tee-vee-TAY|كرياتيڤيتيه|إبداع"
            "Curiosité|kew-ryoh-zee-TAY|كيريوزيتيه|فضول"
          )

          IDX=$((RANDOM % ${#CONTENT_RAW[@]}))
          ENTRY="${CONTENT_RAW[$IDX]}"
          WORD=$(echo "$ENTRY" | cut -d'|' -f1)
          PRON_EN=$(echo "$ENTRY" | cut -d'|' -f2)
          PRON_AR=$(echo "$ENTRY" | cut -d'|' -f3)
          MEANING=$(echo "$ENTRY" | cut -d'|' -f4)

          echo "word=$WORD" >> "$GITHUB_OUTPUT"
          echo "pron_en=$PRON_EN" >> "$GITHUB_OUTPUT"
          echo "pron_ar=$PRON_AR" >> "$GITHUB_OUTPUT"
          echo "meaning=$MEANING" >> "$GITHUB_OUTPUT"
          echo "Selected word: $WORD | pron_en: $PRON_EN | pron_ar: $PRON_AR | meaning: $MEANING"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            echo "image_caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WORD="${{ steps.content.outputs.word }}"
          PRON_AR="${{ steps.content.outputs.pron_ar }}"
          MEANING="${{ steps.content.outputs.meaning }}"

          CAPTIONS=(
            "كلمة اليوم بالفرنسية 🇫🇷 #تعلم_الفرنسية #french #learnfrench"
            "تعلم معنا 🇫🇷 #تعلم_الفرنسية #french #learnfrench"
            "كلمة جديدة كل يوم 🇫🇷 #تعلم_الفرنسية #french #learnfrench"
            "تابعنا لمزيد 🇫🇷 #تعلم_الفرنسية #french #learnfrench"
            "تعلم الفرنسية بسهولة 🇫🇷 #تعلم_الفرنسية #french #learnfrench"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

          IMAGE_CAPTION="${WORD} - ${PRON_AR} - ${MEANING} 🇫🇷 #تعلم_الفرنسية #french #learnfrench #اللغة_الفرنسية #FLE"
          echo "image_caption=$IMAGE_CAPTION" >> "$GITHUB_OUTPUT"

      - name: synthesize-speech
        id: tts
        timeout-minutes: 2
        continue-on-error: true
        run: |
          WORD="${{ steps.content.outputs.word }}"

          echo "Synthesizing speech parts for: $WORD"

          SUCCESS=0

          synth_piper() {
            local text="$1"
            local out="$2"
            echo "$text" | timeout 20 python3 -m piper \
              --model /home/runner/piper-voices/fr_FR-siwis-medium.onnx \
              --output_file "$out" 2>/tmp/piper_err.log
          }

          synth_espeak() {
            local text="$1"
            local out="$2"
            timeout 15 espeak-ng -v fr -s 150 -w "$out" "$text" 2>/tmp/espeak_err.log
          }

          if [ "${{ steps.piper_setup.outputs.piper_ready }}" = "true" ]; then
            echo "Attempting Piper TTS for all parts..."
            synth_piper "Le mot est." intro_raw.wav || true
            synth_piper "$WORD." word1_raw.wav || true
            synth_piper "On répète." repeat_raw.wav || true
            synth_piper "$WORD." word2_raw.wav || true
            if [ -s intro_raw.wav ] && [ -s word1_raw.wav ] && [ -s repeat_raw.wav ] && [ -s word2_raw.wav ]; then
              SUCCESS=1
              echo "Piper succeeded for all parts."
            fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            echo "Falling back to espeak-ng for all parts..."
            synth_espeak "Le mot est." intro_raw.wav
            synth_espeak "$WORD." word1_raw.wav
            synth_espeak "On répète." repeat_raw.wav
            synth_espeak "$WORD." word2_raw.wav
            if [ -s intro_raw.wav ] && [ -s word1_raw.wav ] && [ -s repeat_raw.wav ] && [ -s word2_raw.wav ]; then
              SUCCESS=1
              echo "espeak-ng succeeded for all parts."
            fi
          fi

          if [ "$SUCCESS" -eq 1 ]; then
            for f in intro_raw word1_raw repeat_raw word2_raw; do
              timeout 10 ffmpeg -hide_banner -loglevel error -y -i "${f}.wav" -ac 2 -ar 44100 -filter:a "volume=1.8" "${f}_norm.wav"
            done

            timeout 10 ffmpeg -hide_banner -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 0.3 silence_short.wav
            timeout 10 ffmpeg -hide_banner -loglevel error -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 1.2 silence_long.wav

            timeout 15 ffmpeg -hide_banner -loglevel error -y \
              -i intro_raw_norm.wav -i silence_short.wav \
              -i word1_raw_norm.wav -i silence_long.wav \
              -i repeat_raw_norm.wav -i silence_short.wav \
              -i word2_raw_norm.wav \
              -filter_complex "[0:a][1:a][2:a][3:a][4:a][5:a][6:a]concat=n=7:v=0:a=1[aout]" \
              -map "[aout]" speech_final.wav

            echo "tts_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "All TTS methods failed. Proceeding without spoken audio."
            echo "tts_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"

          echo "Video step word check: WORD=$WORD PRON_EN=$PRON_EN PRON_AR=$PRON_AR MEANING=$MEANING"

          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, random

          word = os.environ.get("WORD", "Bonjour")
          pron_en = os.environ.get("PRON_EN", "bohn-ZHOOR")
          pron_ar = os.environ.get("PRON_AR", "بونجور")
          meaning = os.environ.get("MEANING", "مرحبا")
          dur = float(os.environ.get("DUR", "11"))
          fadeout = float(os.environ.get("FADEOUT", "9.5"))

          font_en_candidates = [
              "/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]
          font_en = next((f for f in font_en_candidates if os.path.exists(f)), font_en_candidates[-1])

          font_ar_candidates = [
              "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf",
          ]
          font_ar = next((f for f in font_ar_candidates if os.path.exists(f)), font_en)

          color_palette = [
              "white", "gold", "lightyellow", "lightcyan",
              "lightpink", "peachpuff", "lavender", "palegreen",
              "lightskyblue", "wheat", "khaki", "lightsalmon",
              "mistyrose", "honeydew", "aliceblue"
          ]
          main_color = random.choice(color_palette)
          accent_palette = [c for c in color_palette if c != main_color]
          accent_color = random.choice(accent_palette)

          def esc(t):
              return t.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          intros = [
              "تعلم كلمة فرنسية جديدة",
              "كلمة اليوم باللغة الفرنسية",
              "تعلم النطق الفرنسي الصحيح",
              "وسّع مفرداتك الفرنسية",
              "كلمة فرنسية جديدة كل يوم",
          ]
          intro_text = random.choice(intros)

          filters = []

          def fade_in(t):
              return f"if(lt(t,{t:.2f}),0,min(1,(t-{t:.2f})/0.25))"

          # Top: Arabic intro line
          filters.append(
              f"drawtext=text='{esc(intro_text)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.95:fontsize=46:x=(w-text_w)/2:y=140"
              f":alpha='{fade_in(0.3)}'"
              f":shadowcolor=black@0.85:shadowx=3:shadowy=3"
          )

          # Subtitle 1: "الكلمة هي" — bold text on solid colored box, synced to "Le mot est." (0.5s-1.6s)
          sub1_box_top = 290
          sub1_box_h = 90
          filters.append(
              f"drawbox=x=300:y={sub1_box_top}:w=480:h={sub1_box_h}"
              f":color=black@0.75:t=fill"
              f":enable='between(t,0.5,1.6)'"
          )
          filters.append(
              f"drawtext=text='{esc('الكلمة هي')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=lightyellow:fontsize=52:x=(w-text_w)/2:y={sub1_box_top + 18}"
              f":enable='between(t,0.5,1.6)'"
              f":shadowcolor=black@0.8:shadowx=2:shadowy=2"
          )

          # Subtitle 2: "لنكررها" — shown earlier now (4.6s-5.6s instead of 5.0s-5.9s), synced to shortened pause before "On répète."
          sub2_box_top = 290
          sub2_box_h = 90
          filters.append(
              f"drawbox=x=300:y={sub2_box_top}:w=480:h={sub2_box_h}"
              f":color=black@0.75:t=fill"
              f":enable='between(t,4.6,5.6)'"
          )
          filters.append(
              f"drawtext=text='{esc('لنكررها')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=lightyellow:fontsize=52:x=(w-text_w)/2:y={sub2_box_top + 18}"
              f":enable='between(t,4.6,5.6)'"
              f":shadowcolor=black@0.8:shadowx=2:shadowy=2"
          )

          # The French word (appears at 1.6s, when TTS says it)
          filters.append(
              f"drawtext=text='{esc(word)}'"
              f":fontfile={font_en}"
              f":fontcolor={main_color}:fontsize=100:x=(w-text_w)/2:y=460"
              f":alpha='{fade_in(1.6)}'"
              f":shadowcolor=black@0.85:shadowx=4:shadowy=4"
          )

          # English pronunciation — appears right after word is spoken (2.6s)
          filters.append(
              f"drawtext=text='{esc(pron_en)}'"
              f":fontfile={font_en}"
              f":fontcolor={accent_color}:fontsize=54:x=(w-text_w)/2:y=640"
              f":alpha='{fade_in(2.6)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # Arabic pronunciation label + text
          filters.append(
              f"drawtext=text='{esc('طريقة النطق')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.75:fontsize=32:x=(w-text_w)/2:y=710"
              f":alpha='{fade_in(3.0)}'"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2"
          )
          filters.append(
              f"drawtext=text='{esc(pron_ar)}'"
              f":fontfile={font_ar}"
              f":fontcolor={accent_color}:fontsize=60:x=(w-text_w)/2:y=758"
              f":alpha='{fade_in(3.2)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # Meaning — appears after the repeat sequence wraps up
          filters.append(
              f"drawtext=text='{esc('المعنى: ' + meaning)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.9:fontsize=48:x=(w-text_w)/2:y=890"
              f":alpha='{fade_in(6.5)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # CTA box — last
          ctas = ["تابعنا", "اترك تعليق", "شارك مع صديق", "احفظ الفيديو", "تابعنا لمزيد"]
          cta_text = random.choice(ctas)
          t_cta = 6.9
          box_y_top = 1580
          box_y_bottom = 1680
          filters.append(
              f"drawbox=x=240:y={box_y_top}:w=600:h={box_y_bottom - box_y_top}"
              f":color=black@0.55:t=fill"
              f":enable='gte(t,{t_cta:.2f})'"
          )
          filters.append(
              f"drawtext=text='{esc(cta_text)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=lightyellow:fontsize=52:x=(w-text_w)/2:y={box_y_top + 22}"
              f":alpha='{fade_in(t_cta)}'"
              f":shadowcolor=black@0.8:shadowx=2:shadowy=2"
          )

          all_dt = ",".join(filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"fade=t=in:st=0:d=0.5,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          with open("/tmp/shared_state.txt", "w") as f:
              f.write(f"{word}\n{pron_en}\n{pron_ar}\n{meaning}\n{main_color}\n{accent_color}\n{intro_text}\n{cta_text}\n")

          print(f"Built filter | word: {word} | main_color: {main_color} | accent: {accent_color} | intro: {intro_text} | cta: {cta_text}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          if [ "${{ steps.tts.outputs.tts_available }}" = "true" ]; then
            echo "Mixing with TTS speech overlay..."
            AFILTER="[1:a]volume=0.7,afade=t=in:st=0:d=0.5,afade=t=out:st=${FADEOUT}:d=1.5,volume='if(between(t,0.5,6.5),0.25,0.7)':eval=frame[music];[2:a]adelay=500|500,volume=0.85[speech];[music][speech]amix=inputs=2:duration=first:dropout_transition=0,volume=1.4[aout]"
            timeout 240 ffmpeg -hide_banner -loglevel error -y \
              -i source.mp4 \
              -i music_clip.mp3 \
              -i speech_final.wav \
              -filter_complex "${VFILTER};${AFILTER}" \
              -map "[vout]" \
              -map "[aout]" \
              -t "$DUR" \
              -c:v libx264 -preset medium -crf 16 \
              -c:a aac -b:a 192k \
              -movflags +faststart \
              -pix_fmt yuv420p \
              final.mp4
          else
            echo "No TTS available, music-only audio..."
            timeout 240 ffmpeg -hide_banner -loglevel error -y \
              -i source.mp4 \
              -i music_clip.mp3 \
              -filter_complex "${VFILTER};[1:a]volume=0.9,afade=t=in:st=0:d=0.5,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
              -map "[vout]" \
              -map "[aout]" \
              -t "$DUR" \
              -c:v libx264 -preset medium -crf 16 \
              -c:a aac -b:a 192k \
              -movflags +faststart \
              -pix_fmt yuv420p \
              final.mp4
          fi

          ls -lh final.mp4
        env:
          WORD: ${{ steps.content.outputs.word }}
          PRON_EN: ${{ steps.content.outputs.pron_en }}
          PRON_AR: ${{ steps.content.outputs.pron_ar }}
          MEANING: ${{ steps.content.outputs.meaning }}
          DUR: "11"
          FADEOUT: "9.5"

      - name: process-image
        timeout-minutes: 3
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"

          WORD=$(sed -n '1p' /tmp/shared_state.txt)
          PRON_EN=$(sed -n '2p' /tmp/shared_state.txt)
          PRON_AR=$(sed -n '3p' /tmp/shared_state.txt)
          MEANING=$(sed -n '4p' /tmp/shared_state.txt)

          echo "Image step word check (from shared_state.txt): WORD=$WORD PRON_EN=$PRON_EN PRON_AR=$PRON_AR MEANING=$MEANING"

          timeout 60 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -frames:v 1 bg_frame.jpg

          python3 << 'PYEOF'
          import os

          with open("/tmp/shared_state.txt") as f:
              lines = [l.rstrip("\n") for l in f.readlines()]
          word, pron_en, pron_ar, meaning, main_color, accent_color, intro_text, cta_text = lines[0:8]

          print(f"process-image using shared_state: word={word} pron_en={pron_en} pron_ar={pron_ar} meaning={meaning}")

          font_en_candidates = [
              "/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]
          font_en = next((f for f in font_en_candidates if os.path.exists(f)), font_en_candidates[-1])

          font_ar_candidates = [
              "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
              "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf",
          ]
          font_ar = next((f for f in font_ar_candidates if os.path.exists(f)), font_en)

          def esc(t):
              return t.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          filters = []

          filters.append(
              f"drawtext=text='{esc(intro_text)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.95:fontsize=46:x=(w-text_w)/2:y=140"
              f":shadowcolor=black@0.85:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc(word)}'"
              f":fontfile={font_en}"
              f":fontcolor={main_color}:fontsize=100:x=(w-text_w)/2:y=460"
              f":shadowcolor=black@0.85:shadowx=4:shadowy=4"
          )
          filters.append(
              f"drawtext=text='{esc(pron_en)}'"
              f":fontfile={font_en}"
              f":fontcolor={accent_color}:fontsize=54:x=(w-text_w)/2:y=640"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc('طريقة النطق')}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.75:fontsize=32:x=(w-text_w)/2:y=710"
              f":shadowcolor=black@0.7:shadowx=2:shadowy=2"
          )
          filters.append(
              f"drawtext=text='{esc(pron_ar)}'"
              f":fontfile={font_ar}"
              f":fontcolor={accent_color}:fontsize=60:x=(w-text_w)/2:y=758"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )
          filters.append(
              f"drawtext=text='{esc('المعنى: ' + meaning)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=white@0.9:fontsize=48:x=(w-text_w)/2:y=890"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          box_y_top = 1580
          box_y_bottom = 1680
          filters.append(
              f"drawbox=x=240:y={box_y_top}:w=600:h={box_y_bottom - box_y_top}:color=black@0.55:t=fill"
          )
          filters.append(
              f"drawtext=text='{esc(cta_text)}'"
              f":fontfile=/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf"
              f":fontcolor=lightyellow:fontsize=52:x=(w-text_w)/2:y={box_y_top + 22}"
              f":shadowcolor=black@0.8:shadowx=2:shadowy=2"
          )

          all_dt = ",".join(filters)
          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"{all_dt}"
          )

          with open("/tmp/ifilter.txt", "w") as f:
              f.write(vfilter)
          PYEOF

          IFILTER=$(cat /tmp/ifilter.txt)

          timeout 60 ffmpeg -hide_banner -loglevel error -y \
            -i bg_frame.jpg \
            -vf "$IFILTER" \
            -frames:v 1 \
            final_image.jpg

          ls -lh final_image.jpg

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook video post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"start\",\"file_size\":${SIZE},\"access_token\":\"${PAGE_TOKEN}\"}") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 90 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"upload_session_id\":\"${SESSION}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 90 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" -d "{\"upload_phase\":\"finish\",\"video_id\":\"${VID_ID}\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Video posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Video post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All video post attempts failed"
          exit 1

      - name: post-image-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_CAPTION: ${{ steps.caption.outputs.image_caption }}
        run: |
          set -e
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook image post attempt $attempt..."
            RESP=$(timeout 60 curl -sf -X POST "${API}/${PAGE_ID}/photos" \
              -F "source=@final_image.jpg" \
              -F "caption=${IMAGE_CAPTION}" \
              -F "published=true" \
              -F "access_token=${PAGE_TOKEN}") || true

            OK=$(echo "$RESP" | jq -r '.id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Image posted! Photo ID: $OK"
              exit 0
            fi

            echo "Image post failed attempt $attempt: $RESP"
            sleep 10
          done

          echo "All image post attempts failed"
          exit 1