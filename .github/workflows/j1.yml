name: gospel-moments-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: "50973339-3e27fd59ddfd9c68378e78753"
        run: |
          set -e
          CLIP=20
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic2/*.mp3 bgmusic2/*.wav bgmusic2/*.m4a bgmusic2/*.mp4 bgmusic2/*.aac bgmusic2/*.ogg bgmusic2/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-verse
        id: verse
        timeout-minutes: 1
        run: |
          VERSES=(
            "God is within her, she will not fall. — Psalm 46:5"
            "Be still and know that I am God. — Psalm 46:10"
            "I can do all things through Christ who strengthens me. — Philippians 4:13"
            "The Lord is my shepherd, I lack nothing. — Psalm 23:1"
            "Trust in the Lord with all your heart. — Proverbs 3:5"
            "For God so loved the world that He gave His only Son. — John 3:16"
            "Come to me, all who are weary, and I will give you rest. — Matthew 11:28"
            "The Lord your God is with you wherever you go. — Joshua 1:9"
            "Be strong and courageous. Do not be afraid. — Joshua 1:9"
            "With God, all things are possible. — Matthew 19:26"
          )
          IDX=$((RANDOM % ${#VERSES[@]}))
          echo "verse=${VERSES[$IDX]}" >> "$GITHUB_OUTPUT"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CAPTIONS=(
            "This one hit different. Save it. 🤍 #Faith #Gospel #Bible"
            "Read this slowly. 🙏 #Scripture #Jesus #Hope"
            "Someone needed this today. Share it. 🤍 #Faith #Word #Blessed"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          echo "caption=${CAPTIONS[$IDX]}" >> "$GITHUB_OUTPUT"

      - name: pick-cta
        id: cta
        timeout-minutes: 1
        run: |
          CTAS=("Follow for daily Word" "Share this with someone" "Tag a friend")
          IDX=$((RANDOM % ${#CTAS[@]}))
          echo "cta=${CTAS[$IDX]}" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          CTA="${{ steps.cta.outputs.cta }}"
          VERSE="${{ steps.verse.outputs.verse }}"
          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os

          verse = os.environ.get("VERSE", "God is with you.")
          cta = os.environ.get("CTA", "Follow for daily Word")
          fadeout = float(os.environ.get("FADEOUT", "18.5"))

          # Simple filter: CTA at top, Verse centered, both appear at 2s
          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,setsar=1,gblur=sigma=25,"
              f"fade=t=in:st=0:d=1,fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"drawtext=text='{cta}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf:fontsize=44:x=(w-text_w)/2:y=200:fontcolor=white:enable='gt(t,2)',"
              f"drawtext=text='{verse}':fontfile=/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf:fontsize=50:x=(w-text_w)/2:y=(h-text_h)/2:fontcolor=white:shadowx=2:shadowy=2:enable='gt(t,2)'[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 16 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4
        env:
          VERSE: ${{ steps.verse.outputs.verse }}
          DUR: "20"
          FADEOUT: "18.5"
          CTA: ${{ steps.cta.outputs.cta }}

      - name: post-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          set -e
          FILE="final.mp4"
          API="https://graph.facebook.com/v19.0"
          
          # Initialize upload
          INIT=$(curl -s -X POST "${API}/${PAGE_ID}/video_reels" \
            -H "Content-Type: application/json" \
            -d "{\"upload_phase\":\"start\",\"access_token\":\"${PAGE_TOKEN}\"}")
          
          SESSION=$(echo "$INIT" | jq -r '.upload_session_id')
          URL=$(echo "$INIT" | jq -r '.upload_url')
          
          # Upload
          curl -s -X POST "$URL" \
            -H "Authorization: OAuth ${PAGE_TOKEN}" \
            --data-binary "@${FILE}" > /dev/null
          
          # Finish
          curl -s -X POST "${API}/${PAGE_ID}/video_reels" \
            -H "Content-Type: application/json" \
            -d "{\"upload_phase\":\"finish\",\"video_id\":\"$(echo "$INIT" | jq -r '.video_id')\",\"description\":\"${CAPTION}\",\"published\":true,\"access_token\":\"${PAGE_TOKEN}\"}"
