          """

          PER = os.environ.get("WORDS_PER_POST", "").strip()
          PER = int(PER) if PER.isdigit() and 1 <= int(PER) <= 10 else 5
          AR_DIGITS = str.maketrans("0123456789", "٠١٢٣٤٥٦٧٨٩")
          EN_NUM = {1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six", 7: "seven", 8: "eight", 9: "nine", 10: "ten"}

          # ---- parse lessons ----
          lessons, cur = [], None
          for line in CONTENT.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("=="):
                  title, intro = [x.strip() for x in line[2:].split("|", 1)]
                  cur = {"title": title, "intro": intro, "words": []}
                  lessons.append(cur)
              elif cur is not None:
                  parts = [x.strip() for x in line.split("|")]
                  if len(parts) == 3 and len(cur["words"]) < 10:
                      cur["words"].append(parts)

          # ---- cut every lesson into posts of PER words ----
          posts = []
          for les in lessons:
              w = les["words"]
              chunks = [w[i:i + PER] for i in range(0, len(w), PER)]
              if len(chunks) > 1 and len(chunks[-1]) < 3:
                  chunks[-2] += chunks.pop()
              for part, chunk in enumerate(chunks, 1):
                  first = (part - 1) * PER + 1
                  last = first + len(chunk) - 1
                  title = les["title"]
                  intro = les["intro"]
                  if title.startswith("١٠"):
                      title = str(len(chunk)).translate(AR_DIGITS) + title[2:]
                  if "ten " in intro:
                      intro = intro.replace("ten ", EN_NUM[len(chunk)] + " ", 1)
                  if title.startswith("الأرقام"):
                      title = f"الأرقام من {first} إلى {last}".translate(AR_DIGITS)
                      intro = f"Let's learn the numbers from {EN_NUM[first]} to {EN_NUM[last]}."
                  posts.append({
                      "title_ar": title,
                      "label": title + " بالإنجليزية",
                      "intro_en": intro,
                      "words": chunk,
                  })

          n = len(posts)
          print(f"Loaded {len(lessons)} lessons -> {n} posts of ~{PER} words")

          raw = os.environ.get("INPUT_LIST", "").strip()
          if raw.isdigit() and 1 <= int(raw) <= n:
              idx = int(raw) - 1
          else:
              idx = datetime.date.today().toordinal() % n
          lesson = posts[idx]
          print(f"Selected post {idx + 1}/{n}: {lesson['label']}")

          CTAS = [
              ("Follow us and leave a comment.", "تابعونا واتركوا تعليقا"),
              ("Don't forget to follow us.", "لا تنسوا متابعتنا"),
              ("Share this with a friend.", "شاركها مع صديق"),
              ("Write your favorite word in the comments.", "اكتب كلمتك المفضلة"),
              ("Save this video and practice.", "احفظ الفيديو وتدرب"),
              ("Follow us for a new lesson every day.", "درس جديد كل يوم، تابعنا"),
              ("Try making a sentence with these words.", "جرب كتابة جملة بها"),
              ("Which word do you like most?", "أي كلمة أعجبتك أكثر؟"),
          ]
          lesson["cta_en"], lesson["cta_ar"] = random.choice(CTAS)
          print(f"CTA: {lesson['cta_en']}")

          with open("/tmp/lesson.json", "w", encoding="utf-8") as f:
              json.dump(lesson, f, ensure_ascii=False)

          hashtags = "#تعلم_الانجليزية #english #learnenglish #اللغة_الانجليزية #EFL"
          openers = ["تعلم معنا", "درس اليوم", "كلمات جديدة كل يوم", "تابعنا لمزيد"]
          caption = f"{random.choice(openers)}: {lesson['label']} 🇬🇧\n{hashtags}"

          lines = [f"{lesson['label']} 🇬🇧", ""]
          for i, (w, p, m) in enumerate(lesson["words"], 1):
              lines.append(f"{i}. {w} - {p} - {m}")
          lines += ["", hashtags]
          image_caption = "\n".join(lines)

          override = os.environ.get("INPUT_CAPTION", "").strip()
          if override:
              caption = image_caption = override

          with open("/tmp/caption.txt", "w", encoding="utf-8") as f:
              f.write(caption)
          with open("/tmp/image_caption.txt", "w", encoding="utf-8") as f:
              f.write(image_caption)
          PYEOF

      - name: synthesize-speech
        id: tts
        timeout-minutes: 4
        continue-on-error: true
        env:
          PIPER_READY: ${{ steps.piper_setup.outputs.piper_ready }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess, wave

          L = json.load(open("/tmp/lesson.json", encoding="utf-8"))
          words = [w[0] for w in L["words"]]
          N = len(words)
          SR = 44100
          PIPER_MODEL = "/home/runner/piper-voices/en_US-amy-medium.onnx"
          PIPER_READY = os.environ.get("PIPER_READY") == "true"

          def synth(engine, text, out):
              try:
                  if engine == "piper":
                      r = subprocess.run(
                          ["python3", "-m", "piper", "--model", PIPER_MODEL, "--output_file", out],
                          input=text, text=True, capture_output=True, timeout=40)
                  else:
                      r = subprocess.run(
                          ["espeak-ng", "-v", "en-us", "-s", "140", "-w", out, text],
                          capture_output=True, timeout=20)
                  return r.returncode == 0 and os.path.exists(out) and os.path.getsize(out) > 0
              except Exception as e:
                  print(f"{engine} failed on '{text}': {e}")
                  return False

          def normalize(src, dst):
              subprocess.run(
                  ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", src,
                   "-ac", "1", "-ar", str(SR), "-sample_fmt", "s16",
                   "-filter:a", "volume=1.8", dst],
                  check=True, timeout=30)

          def read_pcm(path):
              with wave.open(path, "rb") as w:
                  return w.readframes(w.getnframes())

          def build(engine):
              texts = {"intro": L["intro_en"], "outro": L.get("cta_en", "Follow us and leave a comment.")}
              for i, w in enumerate(words):
                  texts[f"w{i}"] = w if w[-1] in ".?!" else w + "."
              clips = {}
              for k, t in texts.items():
                  raw, norm = f"/tmp/tts_{k}_raw.wav", f"/tmp/tts_{k}.wav"
                  if not synth(engine, t, raw):
                      return None
                  normalize(raw, norm)
                  clips[k] = read_pcm(norm)
              return clips

          def silence(sec):
              return b"\x00\x00" * int(SR * sec)

          def seconds(buf):
              return len(buf) / 2 / SR

          clips = None
          if PIPER_READY:
              print("Trying Piper...")
              clips = build("piper")
          if clips is None:
              print("Trying espeak-ng...")
              try:
                  clips = build("espeak")
              except Exception as e:
                  print("espeak failed:", e)
                  clips = None

          if clips:
              audio = bytearray()
              states = []
              audio += silence(0.5)
              audio += clips["intro"] + silence(0.7)
              t = seconds(audio)
              states.append([0.0, round(t, 3)])
              for i in range(N):
                  start = t
                  audio += clips[f"w{i}"] + silence(0.9) + clips[f"w{i}"] + silence(0.7)
                  t = seconds(audio)
                  states.append([round(start, 3), round(t, 3)])
              start = t
              audio += clips["outro"] + silence(1.3)
              t = seconds(audio)
              states.append([round(start, 3), round(t, 3)])
              with wave.open("speech_final.wav", "wb") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(SR)
                  w.writeframes(bytes(audio))
              timing = {"states": states, "total": round(t, 3), "tts": True}
          else:
              print("All TTS failed. Using fixed timing, music only.")
              states, t = [[0.0, 3.0]], 3.0
              for i in range(N):
                  states.append([t, t + 3.5])
                  t += 3.5
              states.append([t, t + 3.5])
              timing = {"states": states, "total": t + 3.5, "tts": False}

          json.dump(timing, open("/tmp/timing.json", "w"))
          print(f"Total duration: {timing['total']}s | TTS: {timing['tts']}")
          PYEOF

      - name: render-frames
        timeout-minutes: 3
        env:
          INPUT_LAYOUT: ${{ github.event.inputs.layout }}
        run: |
          mkdir -p /tmp/frames
          python3 << 'PYEOF'
          import glob, json, os, random
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display

          L = json.load(open("/tmp/lesson.json", encoding="utf-8"))
          rows = L["words"]
          N = len(rows)
          W, H = 1080, 1920

          # ---------------- fonts ----------------
          def find_font(names):
              for n in names:
                  hits = glob.glob(f"/usr/share/fonts/**/{n}", recursive=True)
                  if hits:
                      return hits[0]
              raise SystemExit(f"No font found among {names}")

          FONT_EN = find_font(["NotoSans-Bold.ttf", "DejaVuSans-Bold.ttf", "LiberationSans-Bold.ttf"])
          FONT_AR = find_font(["NotoNaskhArabic-Bold.ttf", "NotoSansArabic-Bold.ttf", "NotoSansArabic-Regular.ttf", "DejaVuSans-Bold.ttf"])

          def ar(t):
              return get_display(arabic_reshaper.reshape(t))

          def mk(path, size):
              return ImageFont.truetype(path, int(size), layout_engine=ImageFont.Layout.BASIC)

          _m = ImageDraw.Draw(Image.new("RGBA", (1, 1)))

          def fit(text, path, size, maxw):
              size = int(size)
              f = mk(path, size)
              while size > 18 and _m.textlength(text, font=f) > maxw:
                  size -= 2
                  f = mk(path, size)
              return f

          # ---------------- random look ----------------
          BRIGHT = [(255,107,107),(255,159,67),(254,202,87),(29,209,161),(72,219,251),
                    (84,160,255),(165,94,234),(255,121,198),(46,213,115),(255,177,66)]
          DEEP   = [(190,40,40),(200,100,0),(150,110,0),(0,130,100),(0,110,150),
                    (40,90,200),(110,50,180),(190,40,120),(20,130,60),(160,90,0)]

          THEMES = {
              "midnight": dict(panel=(8,14,30,185),  accent=(255,214,102), pill_txt=(40,30,10),
                               word=(255,255,255), pron=(170,240,255), mean=(255,250,190), row=(255,255,255,28), light=False),
              "emerald":  dict(panel=(6,40,32,190),  accent=(110,240,180), pill_txt=(5,40,30),
                               word=(255,255,255), pron=(190,255,230), mean=(255,240,170), row=(255,255,255,28), light=False),
              "royal":    dict(panel=(30,12,60,190), accent=(230,160,255), pill_txt=(40,10,60),
                               word=(255,255,255), pron=(200,220,255), mean=(255,225,160), row=(255,255,255,28), light=False),
              "sunset":   dict(panel=(60,14,20,190), accent=(255,160,90),  pill_txt=(60,14,0),
                               word=(255,245,235), pron=(255,205,160), mean=(255,235,150), row=(255,255,255,26), light=False),
              "ocean":    dict(panel=(5,40,60,190),  accent=(90,220,255),  pill_txt=(0,35,50),
                               word=(255,255,255), pron=(170,255,245), mean=(255,245,180), row=(255,255,255,28), light=False),
              "rose":     dict(panel=(50,10,40,190), accent=(255,140,190), pill_txt=(60,0,30),
                               word=(255,255,255), pron=(255,200,230), mean=(255,240,170), row=(255,255,255,28), light=False),
              "cream":    dict(panel=(255,250,240,238), accent=(225,140,20), pill_txt=(255,255,255),
                               word=(20,30,60), pron=(0,100,150), mean=(160,60,30), row=(0,0,0,16), light=True),
          }

          theme_name = random.choice(list(THEMES))
          TH = THEMES[theme_name]
          LAYOUT = os.environ.get("INPUT_LAYOUT", "").strip().lower()
          if LAYOUT not in ("table", "cards", "stack"):
              LAYOUT = random.choice(["table", "table", "cards", "stack"])
          ROW_STYLE = random.choice(["filled", "outline", "line"])
          CTA_STYLE = random.choice(["dark", "accent", "plain"])
          RAINBOW = random.random() < 0.6
          MIRROR = (LAYOUT == "table") and random.random() < 0.5
          PAL = list(DEEP if TH["light"] else BRIGHT)
          random.shuffle(PAL)
          BADGE_PAL = list(BRIGHT)
          random.shuffle(BADGE_PAL)
          BADGE_TXT = (20, 20, 30, 255)
          ACC = TH["accent"]
          STROKE = 0 if TH["light"] else 2
          print(f"LOOK: theme={theme_name} layout={LAYOUT} rows={ROW_STYLE} rainbow={RAINBOW} mirror={MIRROR} cta={CTA_STYLE} words={N}")

          def txt(d, xy, text, font, fill, stroke=None):
              s = STROKE if stroke is None else stroke
              d.text(xy, text, font=font, fill=fill, anchor="mm",
                     stroke_width=s, stroke_fill=(0, 0, 0, 255))

          def word_color(i):
              return PAL[i % len(PAL)] + (255,) if RAINBOW else TH["word"] + (255,)

          def box_style(d, box, hl, r=24):
              if hl:
                  d.rounded_rectangle(box, radius=r, fill=ACC + (80,), outline=ACC + (255,), width=4)
              elif ROW_STYLE == "filled":
                  d.rounded_rectangle(box, radius=r, fill=TH["row"])
              elif ROW_STYLE == "outline":
                  d.rounded_rectangle(box, radius=r, outline=ACC + (170,), width=2)
              else:
                  d.line((box[0] + 24, box[3], box[2] - 24, box[3]), fill=ACC + (170,), width=2)

          def badge(d, cx, cy, i, r=30):
              d.ellipse((cx - r, cy - r, cx + r, cy + r), fill=BADGE_PAL[i % len(BADGE_PAL)] + (255,))
              d.text((cx, cy), str(i + 1), font=mk(FONT_EN, r * 1.05), fill=BADGE_TXT, anchor="mm")

          def header_and_panel(d, bottom):
              title = ar(L["title_ar"])
              txt(d, (W / 2, 135), title, fit(title, FONT_AR, 84, 940), (255, 255, 255, 255), 3)
              sub = ar("مع النطق والمعنى بالعربية")
              d.rounded_rectangle((250, 205, 830, 275), radius=35, fill=ACC + (245,))
              d.text((W / 2, 240), sub, font=fit(sub, FONT_AR, 38, 540), fill=TH["pill_txt"] + (255,), anchor="mm")
              d.rounded_rectangle((40, 310, 1040, bottom), radius=40, fill=TH["panel"])

          # ---- geometry that adapts to the number of words (fewer words = bigger rows) ----
          T_Y0 = 410
          T_RH = min(230, (1540 - T_Y0) // N)
          T_F = max(1.0, min(1.35, T_RH / 112))
          S_Y0 = 335
          S_RH = min(250, (1540 - S_Y0) // N)
          S_F = max(1.0, min(1.45, S_RH / 120))
          C_R = (N + 1) // 2
          C_H = min(390, (1205 - 12 * (C_R - 1)) // C_R)
          C_F = max(1.0, min(1.6, C_H / 228))

          def draw_state(shown, highlight, cta):
              img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(img, "RGBA")

              if LAYOUT == "table":
                  header_and_panel(d, min(1550, T_Y0 + N * T_RH + 20))
                  cw, cp, cm = 800, 480, 195
                  bx = 985
                  wdx = -15
                  if MIRROR:
                      cw, cp, cm, bx, wdx = W - cw, W - cp, W - cm, W - 985, 15
                  # column titles: white text on a dark, almost opaque band
                  d.rounded_rectangle((60, 328, 1020, 398), radius=20, fill=(0, 0, 0, 240), outline=ACC + (255,), width=2)
                  for x, label in ((cw, "الكلمة"), (cp, "النطق"), (cm, "المعنى")):
                      txt(d, (x, 363), ar(label), mk(FONT_AR, 42), (255, 255, 255, 255), 2)
                  for i in range(shown):
                      word, pron, mean = rows[i]
                      top = T_Y0 + i * T_RH
                      cy = top + T_RH / 2
                      box_style(d, (60, top + 6, 1020, top + T_RH - 6), highlight and i == shown - 1)
                      badge(d, bx, cy, i, r=30 * T_F)
                      txt(d, (cw + wdx, cy), word, fit(word, FONT_EN, 54 * T_F, 270), word_color(i))
                      p = ar(pron); m = ar(mean)
                      txt(d, (cp, cy), p, fit(p, FONT_AR, 48 * T_F, 300), TH["pron"] + (255,))
                      txt(d, (cm, cy), m, fit(m, FONT_AR, 46 * T_F, 270), TH["mean"] + (255,))

              elif LAYOUT == "cards":
                  header_and_panel(d, 1550)
                  cwid, gap = 470, 12
                  for i in range(shown):
                      word, pron, mean = rows[i]
                      col, rw = i % 2, i // 2            # col 0 = right side (RTL reading)
                      x1 = 1020 - col * (cwid + 20)
                      x0 = x1 - cwid
                      if N % 2 == 1 and i == N - 1:      # last odd card is centered
                          x0, x1 = W / 2 - cwid / 2, W / 2 + cwid / 2
                      top = 335 + rw * (C_H + gap)
                      box_style(d, (x0, top, x1, top + C_H), highlight and i == shown - 1, r=30)
                      cx = (x0 + x1) / 2
                      badge(d, x1 - 36 * C_F, top + 36 * C_F, i, r=24 * C_F)
                      txt(d, (cx, top + C_H * 0.36), word, fit(word, FONT_EN, 62 * C_F, 380), word_color(i))
                      p = ar(pron); m = ar(mean)
                      txt(d, (cx, top + C_H * 0.62), p, fit(p, FONT_AR, 44 * C_F, 420), TH["pron"] + (255,))
                      txt(d, (cx, top + C_H * 0.85), m, fit(m, FONT_AR, 44 * C_F, 420), TH["mean"] + (255,))

              else:  # stack
                  header_and_panel(d, 1550)
                  for i in range(shown):
                      word, pron, mean = rows[i]
                      top = S_Y0 + i * S_RH
                      cy = top + S_RH / 2
                      box_style(d, (60, top + 6, 1020, top + S_RH - 6), highlight and i == shown - 1)
                      badge(d, 985, cy, i, r=30 * S_F)
                      txt(d, (W / 2, cy - S_RH * 0.18), word, fit(word, FONT_EN, 52 * S_F, 760), word_color(i))
                      p = ar(pron); m = ar(mean)
                      sy = cy + S_RH * 0.23
                      txt(d, (W / 2 + 200, sy), p, fit(p, FONT_AR, 42 * S_F, 330), TH["pron"] + (255,))
                      txt(d, (W / 2 - 200, sy), m, fit(m, FONT_AR, 42 * S_F, 330), TH["mean"] + (255,))
                      d.ellipse((W / 2 - 5, sy - 5, W / 2 + 5, sy + 5), fill=ACC + (255,))

              if cta:
                  c = ar(L.get("cta_ar", "تابعونا واتركوا تعليقا"))
                  cf = fit(c, FONT_AR, 52, 640)
                  if CTA_STYLE == "dark":
                      d.rounded_rectangle((190, 1585, 890, 1685), radius=30, fill=(0, 0, 0, 205), outline=ACC + (255,), width=2)
                      d.text((W / 2, 1635), c, font=cf, fill=(255, 255, 200, 255), anchor="mm")
                  elif CTA_STYLE == "accent":
                      d.rounded_rectangle((190, 1585, 890, 1685), radius=50, fill=ACC + (245,))
                      d.text((W / 2, 1635), c, font=cf, fill=TH["pill_txt"] + (255,), anchor="mm")
                  else:
                      txt(d, (W / 2, 1635), c, cf, (255, 255, 255, 255), 4)
              return img

          for k in range(N + 1):
              draw_state(k, highlight=(k >= 1), cta=False).save(f"/tmp/frames/state_{k}.png")
          draw_state(N, highlight=False, cta=True).save(f"/tmp/frames/state_{N + 1}.png")
          print(f"Rendered {N + 2} frames")
          PYEOF

      - name: process-video
        timeout-minutes: 12
        env:
          VIDEO_URL: ${{ steps.vid.outputs.video_url }}
          START: ${{ steps.vid.outputs.start }}
          CLIP: ${{ steps.vid.outputs.clip }}
          MUSIC_FILE: ${{ steps.music.outputs.music_file }}
        run: |
          set -e
          TOTAL=$(python3 -c "import json,math;print(math.ceil(json.load(open('/tmp/timing.json'))['total']))")

          echo "Downloading background clip..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VIDEO_URL" -t "$CLIP" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MDUR=${MDUR:-60}
          MMAX=$((MDUR - TOTAL - 5))
          if [ "$MMAX" -le 1 ]; then MMAX=1; fi
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$((TOTAL + 2))" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import json, subprocess, sys

          T = json.load(open("/tmp/timing.json"))
          states, total, tts = T["states"], T["total"], T["tts"]

          cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                 "-stream_loop", "-1", "-i", "source.mp4",
                 "-i", "music_clip.mp3"]
          if tts:
              cmd += ["-i", "speech_final.wav"]
          first_png = 3 if tts else 2
          for i in range(len(states)):
              cmd += ["-i", f"/tmp/frames/state_{i}.png"]

          # background: cover-crop, cheap blur (blur at low res, scale back up), slight darken
          f = ("[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,"
               "scale=270:480,gblur=sigma=6,scale=1080:1920:flags=bicubic,eq=brightness=-0.08[bg]")
          prev = "bg"
          for i, (s, e) in enumerate(states):
              out = f"v{i}"
              f += f";[{prev}][{first_png + i}:v]overlay=0:0:enable='between(t,{s},{e})'[{out}]"
              prev = out
          f += (f";[{prev}]fade=t=in:st=0:d=0.5,fade=t=out:st={total - 1.0:.2f}:d=1.0,format=yuv420p[vout]")

          fade_a = total - 1.5
          if tts:
              f += (f";[1:a]volume=0.2,afade=t=in:st=0:d=0.5,afade=t=out:st={fade_a:.2f}:d=1.5[m]"
                    ";[2:a]aformat=channel_layouts=stereo,volume=1.0[s]"
                    ";[m][s]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0[aout]")
          else:
              f += f";[1:a]volume=0.9,afade=t=in:st=0:d=0.5,afade=t=out:st={fade_a:.2f}:d=1.5[aout]"

          cmd += ["-filter_complex", f, "-map", "[vout]", "-map", "[aout]",
                  "-t", f"{total:.2f}",
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", "18",
                  "-c:a", "aac", "-b:a", "192k",
                  "-movflags", "+faststart", "-pix_fmt", "yuv420p", "final.mp4"]

          r = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
          if r.returncode != 0:
              print(r.stderr)
              sys.exit(1)
          print("final.mp4 rendered")
          PYEOF

          ls -lh final.mp4

      - name: process-image
        timeout-minutes: 3
        env:
          VIDEO_URL: ${{ steps.vid.outputs.video_url }}
          START: ${{ steps.vid.outputs.start }}
        run: |
          set -e
          timeout 60 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VIDEO_URL" -frames:v 1 bg_frame.jpg

          python3 << 'PYEOF'
          import json
          from PIL import Image, ImageFilter, ImageEnhance

          L = json.load(open("/tmp/lesson.json", encoding="utf-8"))
          final_idx = len(L["words"]) + 1
          W, H = 1080, 1920

          bg = Image.open("bg_frame.jpg").convert("RGB")
          scale = max(W / bg.width, H / bg.height)
          bg = bg.resize((int(bg.width * scale) + 1, int(bg.height * scale) + 1))
          left, top = (bg.width - W) // 2, (bg.height - H) // 2
          bg = bg.crop((left, top, left + W, top + H))
          bg = bg.filter(ImageFilter.GaussianBlur(25))
          bg = ImageEnhance.Brightness(bg).enhance(0.92).convert("RGBA")

          overlay = Image.open(f"/tmp/frames/state_{final_idx}.png").convert("RGBA")
          out = Image.alpha_composite(bg, overlay).convert("RGB")
          out.save("final_image.jpg", quality=93)
          print("final_image.jpg rendered")
          PYEOF

          ls -lh final_image.jpg

      - name: post-to-facebook
        timeout-minutes: 4
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -e
          CAPTION=$(cat /tmp/caption.txt)
          FILE="final.mp4"
          SIZE=$(stat -c%s "$FILE")
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook video post attempt $attempt..."
            INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$PAGE_TOKEN" '{upload_phase:"start",access_token:$t}')") || true
            SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
            VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)

            if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
              INIT=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" \
                -d "$(jq -n --arg t "$PAGE_TOKEN" --argjson s "$SIZE" '{upload_phase:"start",file_size:$s,access_token:$t}')") || true
              SESSION=$(echo "$INIT" | jq -r '.upload_session_id' 2>/dev/null)
              VID_ID=$(echo "$INIT" | jq -r '.video_id' 2>/dev/null)
              S_OFF=$(echo "$INIT" | jq -r '.start_offset' 2>/dev/null)

              if [ "$SESSION" = "null" ] || [ -z "$SESSION" ]; then
                echo "Session failed attempt $attempt: $INIT"
                sleep 10
                continue
              fi

              timeout 120 curl -sf -X POST "${API}/${PAGE_ID}/videos" -F "upload_phase=transfer" -F "upload_session_id=${SESSION}" -F "start_offset=${S_OFF}" -F "video_file_chunk=@${FILE};type=video/mp4" -F "access_token=${PAGE_TOKEN}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/videos" -H "Content-Type: application/json" \
                -d "$(jq -n --arg s "$SESSION" --arg d "$CAPTION" --arg t "$PAGE_TOKEN" '{upload_phase:"finish",upload_session_id:$s,description:$d,published:true,access_token:$t}')") || true
            else
              UPLOAD_URL=$(echo "$INIT" | jq -r '.upload_url' 2>/dev/null)
              timeout 120 curl -sf -X POST "$UPLOAD_URL" -H "Authorization: OAuth ${PAGE_TOKEN}" -H "offset: 0" -H "file_size: ${SIZE}" --data-binary "@${FILE}" > /dev/null || true
              FINISH=$(timeout 20 curl -sf -X POST "${API}/${PAGE_ID}/video_reels" -H "Content-Type: application/json" \
                -d "$(jq -n --arg v "$VID_ID" --arg d "$CAPTION" --arg t "$PAGE_TOKEN" '{upload_phase:"finish",video_id:$v,video_state:"PUBLISHED",description:$d,published:true,access_token:$t}')") || true
            fi

            OK=$(echo "$FINISH" | jq -r '.success // .id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Video posted! Video ID: $VID_ID"
              exit 0
            fi

            echo "Video post failed attempt $attempt: $FINISH"
            sleep 10
          done

          echo "All video post attempts failed"
          exit 1

      - name: post-image-to-facebook
        timeout-minutes: 3
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -e
          IMAGE_CAPTION=$(cat /tmp/image_caption.txt)
          API="https://graph.facebook.com/v19.0"

          for attempt in 1 2 3; do
            echo "Facebook image post attempt $attempt..."
            RESP=$(timeout 60 curl -sf -X POST "${API}/${PAGE_ID}/photos" \
              -F "source=@final_image.jpg" \
              --form-string "caption=${IMAGE_CAPTION}" \
              -F "published=true" \
              -F "access_token=${PAGE_TOKEN}") || true

            OK=$(echo "$RESP" | jq -r '.id // empty' 2>/dev/null)
            if [ -n "$OK" ]; then
              echo "Image posted! Photo ID: $OK"
              exit 0
            fi

            echo "Image post failed attempt $attempt: $RESP"
            sleep 10
          done

          echo "All image post attempts failed"
          exit 1