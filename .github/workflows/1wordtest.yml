name: english-games-post

"on":
  workflow_dispatch:
    inputs:
      game:
        description: "Game type"
        required: false
        default: "auto"
        type: choice
        options: [auto, word_maker, unscramble, sentence_builder, fill_blank]
  schedule:
  #  - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: english-games-post
  cancel-in-progress: false

