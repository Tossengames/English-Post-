name: english-games-post

"on":
  workflow_dispatch:
    inputs:
      game:
        description: "Game type"
        required: false
        default: "auto"
        type: choice
        options: [auto, word_maker, unscramble, sentence_builder, fill_blank]
  schedule:
    - cron: "0 7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: english-games-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq python3-pip fonts-noto-core fonts-noto-ui-core
          pip install --quiet --break-system-packages pillow numpy edge-tts arabic-reshaper python-bidi

      - name: build-game
        id: build
        timeout-minutes: 12
        env:
          GAME: ${{ github.event.inputs.game }}
          AR_VOICE: ar-SA-HamedNeural
        run: |
          cat > game.py << 'PYEOF'
          import os, re, json, random, math, subprocess, glob, wave
          from collections import Counter
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display

          W, H, FPS, SR = 1080, 1920, 24, 44100
          AR_VOICE = os.environ.get("AR_VOICE", "ar-SA-HamedNeural")

          def ar(t):
              return get_display(arabic_reshaper.reshape(t))

          def find(cands):
              for c in cands:
                  m = sorted(glob.glob(c))
                  if m:
                      return m[0]
              return None

          F_AR = find(["/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
                       "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
                       "/usr/share/fonts/truetype/noto/NotoNaskhArabic*.ttf",
                       "/usr/share/fonts/truetype/noto/NotoSansArabic*.ttf",
                       "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"])
          F_EN = find(["/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
                       "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
                       "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"])

          _fc = {}
          def font(p, s):
              if (p, s) not in _fc:
                  _fc[(p, s)] = ImageFont.truetype(p, s)
              return _fc[(p, s)]

          M = ImageDraw.Draw(Image.new("RGBA", (1, 1)))

          def hexrgb(h):
              h = h.lstrip("#")
              return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

          def sanitize(t):
              # speech only: Arabic letters, digits, basic punctuation. No emojis/symbols/Latin.
              t = re.sub(r"[^\u0600-\u06FF0-9\s\.\,\!\?:]", " ", t)
              return re.sub(r"\s+", " ", t).strip()

          # ------------------------------------------------------------------ CONTENT
          GAMES = {}
          def mk(game, id_, level, **kw):
              GAMES.setdefault(game, []).append(dict(id=id_, level=level, **kw))

          WM = [
              ("planet", "easy", "planet plant plate pleat panel plane leant plan pant peat tape tale teal late leap pale plea lane lean neat pelt lent".split()),
              ("stream", "easy", "stream master tamers smart steam meats teams terms trams stare tears rates team meat mate tame star rats arts tear rate seat east mast seam same rest term tram ears arms".split()),
              ("travel", "medium", "travel alert alter later ravel valet veal vale tale teal late real rate tear".split()),
              ("garden", "medium", "garden danger gander ranged grand anger range grade raged gear rage dear read dare near earn drag aged rang rend darn nerd dean".split()),
              ("winter", "medium", "winter twine write inert twin wine wire tire tier rite went rent wren tern".split()),
              ("silent", "hard", "silent listen tinsel enlist inlets inlet islet stile stein lines tiles lens lint list silt slit sent nest tens tins lent tile line isle site sine".split()),
              ("monster", "hard", "monster tenors snore stone notes onset tones store snort norms metro mores tomes rose nose note tone rest more term sort torn norm omen stem sent".split()),
          ]
          for base, lvl, ans in WM:
              mk("word_maker", base, lvl, letters=base.upper(), answers=ans)

          UN = [
              ("APPLE", "تفاحة", "easy"), ("HOUSE", "منزل", "easy"), ("WATER", "ماء", "easy"),
              ("BREAD", "خبز", "easy"), ("LIGHT", "ضوء", "easy"), ("TABLE", "طاولة", "easy"),
              ("SMILE", "ابتسامة", "easy"), ("CLOUD", "سحابة", "easy"),
              ("GARDEN", "حديقة", "medium"), ("WINDOW", "نافذة", "medium"), ("FRIEND", "صديق", "medium"),
              ("BRIDGE", "جسر", "medium"), ("SCHOOL", "مدرسة", "medium"), ("FAMILY", "عائلة", "medium"),
              ("ORANGE", "برتقالة", "medium"), ("DOCTOR", "طبيب", "medium"),
              ("ELEPHANT", "فيل", "hard"), ("MOUNTAIN", "جبل", "hard"), ("HOSPITAL", "مستشفى", "hard"),
              ("UMBRELLA", "مظلة", "hard"), ("SANDWICH", "شطيرة", "hard"), ("KEYBOARD", "لوحة المفاتيح", "hard"),
          ]
          for w, h_, lvl in UN:
              mk("unscramble", w, lvl, word=w, hint=h_)

          SB = [
              ("I like to read books", "أحب قراءة الكتب", "easy"),
              ("She drinks water every day", "تشرب الماء كل يوم", "easy"),
              ("We play football after school", "نلعب كرة القدم بعد المدرسة", "easy"),
              ("My brother goes to school every morning", "يذهب أخي إلى المدرسة كل صباح", "medium"),
              ("They are watching a movie at home", "هم يشاهدون فيلما في المنزل", "medium"),
              ("He always forgets his keys in the car", "ينسى دائما مفاتيحه في السيارة", "medium"),
              ("If you study hard you will pass the exam", "إذا درست بجد فسوف تنجح في الامتحان", "hard"),
              ("The teacher asked us to finish the homework before Friday", "طلب منا المعلم إنهاء الواجب قبل يوم الجمعة", "hard"),
              ("She has been learning English for three years", "هي تتعلم الإنجليزية منذ ثلاث سنوات", "hard"),
          ]
          for s, a, lvl in SB:
              mk("sentence_builder", s, lvl, sentence=s, ar=a)

          FB = [
              ("She ___ to school every day.", ["go", "goes", "going"], 1, "الفاعل المفرد الغائب يحتاج إلى goes", "easy"),
              ("I ___ a book now.", ["read", "am reading", "reads"], 1, "الحدث يجري الآن فنستخدم المضارع المستمر", "easy"),
              ("There ___ two apples on the table.", ["is", "are", "am"], 1, "الجمع يحتاج إلى are", "easy"),
              ("My mother ___ in the kitchen.", ["is", "are", "am"], 0, "الفاعل المفرد الغائب يحتاج إلى is", "easy"),
              ("He has lived here ___ 2015.", ["for", "since", "during"], 1, "since مع نقطة زمنية محددة", "medium"),
              ("If it rains, we ___ at home.", ["will stay", "stayed", "staying"], 0, "الجملة الشرطية من النوع الأول", "medium"),
              ("She is good ___ math.", ["in", "at", "on"], 1, "التعبير الصحيح good at", "medium"),
              ("I have never ___ sushi.", ["eat", "ate", "eaten"], 2, "المضارع التام يحتاج إلى التصريف الثالث", "medium"),
              ("By next year, she ___ her degree.", ["will finish", "will have finished", "finishes"], 1, "المستقبل التام", "hard"),
              ("I wish I ___ more time.", ["have", "had", "has"], 1, "wish مع حالة غير واقعية تتطلب الماضي", "hard"),
              ("Neither of the boys ___ ready.", ["are", "were", "was"], 2, "neither of مع فعل مفرد", "hard"),
              ("The report must be ___ by Monday.", ["submit", "submitted", "submitting"], 1, "المبني للمجهول يحتاج إلى التصريف الثالث", "hard"),
          ]
          for s, o, c, e, lvl in FB:
              mk("fill_blank", s, lvl, sentence=s, options=o, correct=c, expl=e)

          # ------------------------------------------------------------------ PICK
          USED_FILE = "used.json"
          used = json.load(open(USED_FILE)) if os.path.exists(USED_FILE) else {}
          game = os.environ.get("GAME", "auto")
          if game not in GAMES:
              game = random.choice(list(GAMES))
          level = random.choices(["easy", "medium", "hard"], [4, 4, 2])[0]
          pool = GAMES[game]
          ug = used.get(game, [])
          cands = [p for p in pool if p["id"] not in ug and p["level"] == level] or [p for p in pool if p["id"] not in ug]
          if not cands:
              ug = []
              cands = [p for p in pool if p["level"] == level] or pool
          puz = random.choice(cands)
          level = puz["level"]
          used[game] = ug + [puz["id"]]
          print("Game:", game, "| Level:", level, "| Item:", puz["id"])

          # ------------------------------------------------------------------ SPRITES
          COLORS = ["#FF5A5F", "#FFB400", "#00B8A9", "#7C4DFF", "#FF7A00", "#2EA8F1", "#FF4D9D", "#4CAF50"]
          PALETTES = [("#FF512F", "#F09819", "#FFD200"), ("#7F00FF", "#E100FF", "#FF5E9C"),
                      ("#00C6FF", "#0072FF", "#7F53FF"), ("#11998E", "#38EF7D", "#F9D423"),
                      ("#FC466B", "#3F5EFB", "#00D2FF")]

          def tile(ch, size, color):
              pad = 16
              im = Image.new("RGBA", (size + pad * 2, size + pad * 2), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([pad + 6, pad + 10, pad + size + 6, pad + size + 10], radius=size // 5, fill=(0, 0, 0, 80))
              d.rounded_rectangle([pad, pad, pad + size, pad + size], radius=size // 5, fill=hexrgb(color) + (255,), outline=(255, 255, 255, 255), width=6)
              d.text((pad + size / 2, pad + size / 2), ch, font=font(F_EN, int(size * 0.62)), fill="white", anchor="mm", stroke_width=4, stroke_fill=(0, 0, 0, 100))
              return im

          def pill(text, size, color, minw=0, arabic=False):
              f = font(F_AR if arabic else F_EN, size)
              t = ar(text) if arabic else text
              tw = M.textlength(t, font=f)
              h = int(size * 1.7)
              w = max(int(tw + size * 1.2), minw)
              pad = 16
              im = Image.new("RGBA", (w + 2 * pad, h + 2 * pad), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([pad + 5, pad + 9, pad + w + 5, pad + h + 9], radius=h // 2, fill=(0, 0, 0, 80))
              d.rounded_rectangle([pad, pad, pad + w, pad + h], radius=h // 2, fill=hexrgb(color) + (255,), outline=(255, 255, 255, 255), width=6)
              d.text((pad + w / 2, pad + h / 2), t, font=f, fill="white", anchor="mm", stroke_width=3, stroke_fill=(0, 0, 0, 90))
              return im

          def block(text, size, color, maxw=960, arabic=True, panel=False):
              f = font(F_AR if arabic else F_EN, size)
              meas = lambda s: M.textlength(ar(s) if arabic else s, font=f)
              lines, cur = [], ""
              for w in text.split():
                  tr = (cur + " " + w).strip()
                  if cur and meas(tr) > maxw:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = tr
              if cur:
                  lines.append(cur)
              lh = int(size * 1.45)
              w, h = maxw + 80, lh * len(lines) + 40
              im = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if panel:
                  d.rounded_rectangle([0, 0, w - 1, h - 1], radius=40, fill=(25, 10, 70, 150))
              for i, l in enumerate(lines):
                  t = ar(l) if arabic else l
                  cy = 20 + lh * i + lh / 2
                  d.text((w / 2 + 4, cy + 5), t, font=f, fill=(0, 0, 0, 90), anchor="mm")
                  d.text((w / 2, cy), t, font=f, fill=color, anchor="mm", stroke_width=5, stroke_fill=(60, 20, 90, 255))
              return im

          def star_pts(cx, cy, R, r):
              pts = []
              for i in range(10):
                  a = -math.pi / 2 + i * math.pi / 5
                  rad = R if i % 2 == 0 else r
                  pts.append((cx + rad * math.cos(a), cy + rad * math.sin(a)))
              return pts

          def stars(n):
              im = Image.new("RGBA", (n * 100 + 30, 120), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              for i in range(n):
                  cx, cy = 65 + i * 100, 60
                  d.polygon(star_pts(cx + 4, cy + 6, 42, 18), fill=(0, 0, 0, 80))
                  d.polygon(star_pts(cx, cy, 42, 18), fill=(255, 214, 10, 255), outline=(255, 255, 255, 255))
              return im

          def arrow():
              im = Image.new("RGBA", (140, 120), (0, 0, 0, 0))
              ImageDraw.Draw(im).polygon([(30, 20), (110, 20), (70, 100)], fill=(255, 255, 255, 255))
              return im

          # ------------------------------------------------------------------ LAYOUTS
          PUZ_CY = 1000

          def layout_tiles(letters):
              n = len(letters)
              per = n if n <= 5 else (n + 1) // 2
              rows = [letters[i:i + per] for i in range(0, n, per)]
              gap = 18
              size = min(170, (980 - gap * (per - 1)) // per)
              th = len(rows) * size + (len(rows) - 1) * gap
              y0 = PUZ_CY - th / 2
              out, k = [], 0
              for r, row in enumerate(rows):
                  x0 = W / 2 - (len(row) * size + (len(row) - 1) * gap) / 2
                  for c, ch in enumerate(row):
                      out.append((tile(ch.upper(), size, COLORS[k % len(COLORS)]), x0 + c * (size + gap) + size / 2, y0 + r * (size + gap) + size / 2))
                      k += 1
              return out

          def layout_chips(words):
              sp = [pill(w, 54, COLORS[i % len(COLORS)]) for i, w in enumerate(words)]
              rows, wcur = [[]], 0
              for s in sp:
                  if rows[-1] and wcur + s.width > 1000:
                      rows.append([])
                      wcur = 0
                  rows[-1].append(s)
                  wcur += s.width
              rh = max(s.height for s in sp)
              th = len(rows) * rh + (len(rows) - 1) * 8
              y0 = PUZ_CY - th / 2
              out = []
              for r, row in enumerate(rows):
                  x = W / 2 - sum(s.width for s in row) / 2
                  for s in row:
                      out.append((s, x + s.width / 2, y0 + r * (rh + 8) + rh / 2))
                      x += s.width
              return out

          def can(w, base):
              cw, cb = Counter(w), Counter(base)
              return all(cw[k] <= cb[k] for k in cw)

          # ------------------------------------------------------------------ GAME BUILD
          HOOKS = [("تحدي جديد!", "تحدٍّ جديد! هل تستطيع حلَّه؟"),
                   ("هل أنت مستعد؟", "هل أنت مستعدٌّ لهذا التحدّي؟"),
                   ("اختبر نفسك!", "اختبر مستواك في اللغة الإنجليزية.")]
          hook_d, hook_s = random.choice(HOOKS)
          count_s = "لديك وقت محدد. ابدأ الآن!"

          if game == "word_maker":
              base = puz["letters"]
              ans = sorted({a for a in puz["answers"] if can(a, base.lower())}, key=lambda w: (-len(w), w))
              letters = list(base)
              while True:
                  random.shuffle(letters)
                  if "".join(letters) != base:
                      break
              items = layout_tiles(letters)
              title = "صانع الكلمات"
              hint = "كوّن أكبر عدد من الكلمات الإنجليزية من هذه الحروف"
              rules = ["كوّن كلمات إنجليزية", "من الحروف التالية فقط", "استخدم كل حرف مرة واحدة في الكلمة"]
              rules_s = "كوِّن أكبر عدد ممكن من الكلمات الإنجليزية باستخدام هذه الحروف فقط. يمكنك استخدام كل حرف مرة واحدة في الكلمة."
              cta_d = "الإجابات في التعليقات"
              cta_s = "الإجابات في التعليقات. اكتب كم كلمة وجدت."
              secs = {"easy": 16, "medium": 20, "hard": 24}[level]
              by = {}
              for a in ans:
                  by.setdefault(len(a), []).append(a.upper())
              lines = ["✅ الإجابات الممكنة:", ""]
              for L in sorted(by, reverse=True):
                  lines.append(f"• {L} حروف: " + " - ".join(by[L]))
              lines += ["", f"⭐ أطول كلمة: {ans[0].upper()}", "", "✍️ اكتب في التعليقات كم كلمة وجدت 👇"]
              comment = "\n".join(lines)

          elif game == "unscramble":
              w = puz["word"]
              letters = list(w)
              while True:
                  random.shuffle(letters)
                  if "".join(letters) != w:
                      break
              items = layout_tiles(letters)
              title = "رتّب الحروف"
              hint = "التلميح: " + puz["hint"]
              rules = ["رتّب الحروف لتكوين كلمة صحيحة", hint]
              rules_s = "رتب الحروف لتكوين كلمة إنجليزية صحيحة. التلميح: " + puz["hint"] + "."
              cta_d = "الإجابة في التعليقات"
              cta_s = "الإجابة في التعليقات."
              secs = {"easy": 10, "medium": 14, "hard": 18}[level]
              comment = f"✅ الإجابة: {w}\nالمعنى: {puz['hint']}\n\n✍️ هل نجحت؟ اكتب لنا 👇"

          elif game == "sentence_builder":
              words = puz["sentence"].split()
              sh = words[:]
              while True:
                  random.shuffle(sh)
                  if sh != words:
                      break
              items = layout_chips(sh)
              title = "رتّب الجملة"
              hint = "المعنى: " + puz["ar"]
              rules = ["رتّب الكلمات لتكوين جملة صحيحة", hint]
              rules_s = "رتب الكلمات لتكوين جملة إنجليزية صحيحة. المعنى بالعربية: " + puz["ar"] + "."
              cta_d = "الإجابة في التعليقات"
              cta_s = "الإجابة في التعليقات."
              secs = {"easy": 12, "medium": 16, "hard": 20}[level]
              comment = f"✅ الجملة الصحيحة:\n{puz['sentence']}.\nالمعنى: {puz['ar']}\n\n✍️ هل رتبتها صحيحة؟ اكتب لنا 👇"

          else:  # fill_blank
              opts = puz["options"][:]
              correct_txt = opts[puz["correct"]]
              random.shuffle(opts)
              ci = opts.index(correct_txt)
              items = [(block(puz["sentence"].replace("___", "_____"), 64, "white", maxw=940, arabic=False, panel=True), W / 2, 790)]
              for i, o in enumerate(opts):
                  items.append((pill(f"{'ABC'[i]}) {o}", 56, COLORS[i * 2], minw=720), W / 2, 990 + i * 120))
              title = "أكمل الفراغ"
              hint = "اختر الإجابة الصحيحة لإكمال الجملة"
              rules = ["اختر الكلمة الصحيحة", "لإكمال الجملة"]
              rules_s = "اختر الإجابة الصحيحة لإكمال الجملة."
              cta_d = "الإجابة في التعليقات"
              cta_s = "الإجابة الصحيحة في التعليقات. اكتب رمز الإجابة."
              secs = {"easy": 8, "medium": 11, "hard": 14}[level]
              full = puz["sentence"].replace("___", correct_txt)
              comment = f"✅ الإجابة الصحيحة: {'ABC'[ci]}) {correct_txt}\n{puz['expl']}\nالجملة كاملة: {full}\n\n✍️ اكتب إجابتك قبل أن تقرأ الحل 👇"

          # ------------------------------------------------------------------ TTS
          def tts(text, out):
              for _ in range(3):
                  try:
                      subprocess.run(["edge-tts", "--voice", AR_VOICE, "--rate=+6%", "--text", text, "--write-media", out],
                                     capture_output=True, timeout=60)
                  except Exception:
                      pass
                  if os.path.exists(out) and os.path.getsize(out) > 0:
                      return True
              return False

          def load(path):
              raw = subprocess.run(["ffmpeg", "-v", "error", "-i", path, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"],
                                   capture_output=True, check=True).stdout
              return np.frombuffer(raw, dtype=np.float32).copy()

          speech = {}
          for k, txt in dict(hook=hook_s, rules=rules_s, count=count_s, cta=cta_s).items():
              clean = sanitize(txt)  # never lets emojis/symbols reach TTS
              out = f"/tmp/{k}.mp3"
              arr = None
              if tts(clean, out):
                  arr = load(out)
                  pk = float(np.max(np.abs(arr))) or 1.0
                  arr = arr / pk * 0.9
              else:
                  print("TTS failed for", k)
                  arr = np.zeros(int(SR * max(1.5, len(clean.split()) * 0.45)), dtype=np.float32)
              speech[k] = arr
          dur = {k: len(v) / SR for k, v in speech.items()}

          # ------------------------------------------------------------------ TIMELINE
          T_hook = 0.4
          hook_end = T_hook + dur["hook"]
          T_rules = hook_end + 0.5
          rules_end = T_rules + dur["rules"]
          T_puz = rules_end + 0.5
          STEP = 0.32
          puz_end = T_puz + len(items) * STEP + 0.4
          T_count = puz_end
          T_timer = T_count + dur["count"] + 0.2
          T_timer_end = T_timer + secs
          T_cta = T_timer_end + 0.3
          TOTAL = T_cta + dur["cta"] + 1.3
          print(f"Timeline: total={TOTAL:.1f}s timer={secs}s")

          # ------------------------------------------------------------------ SCENE ELEMENTS
          els = []
          def add(im, cx, cy, a, b=None, bounce=True, ph=0.0):
              els.append(dict(im=im, cx=cx, cy=cy, a=a, b=b, bounce=bounce, ph=ph))

          add(block(title, 92, "white", maxw=900), W / 2, 250, 0.2)
          add(stars({"easy": 1, "medium": 2, "hard": 3}[level]), W / 2, 370, 0.5)
          add(block(hook_d, 130, "#FFF3B0", maxw=900), W / 2, 900, T_hook - 0.1, hook_end + 0.2)

          ry = 640
          rstep = dur["rules"] / max(1, len(rules))
          for i, r in enumerate(rules):
              b = block(r, 58, "white", maxw=900)
              add(b, W / 2, ry + b.height / 2, T_rules + i * rstep, T_puz, bounce=False)
              ry += b.height + 30

          hb = block(hint, 46, "#FFF3B0", maxw=960)
          add(hb, W / 2, 440 + hb.height / 2, T_puz - 0.3)

          T_items = []
          for i, (im, cx, cy) in enumerate(items):
              t0 = T_puz + i * STEP
              T_items.append(t0)
              add(im, cx, cy, t0, ph=i * 0.7)

          add(pill(cta_d, 64, "#FF3D71", arabic=True), W / 2, 1390, T_cta, ph=0.0)
          add(arrow(), W / 2, 1530, T_cta + 0.2, ph=1.2)

          # ------------------------------------------------------------------ BACKGROUND / FX
          pal = [hexrgb(c) for c in random.choice(PALETTES)]
          ys = (np.arange(2 * H) % H) / H * 3
          idx = np.floor(ys).astype(int)
          fr = (ys - idx)[:, None]
          cols = np.array(pal, dtype=np.float32)
          grad = cols[idx] * (1 - fr) + cols[(idx + 1) % 3] * fr
          bg = Image.fromarray(np.repeat(grad[:, None, :], W, axis=1).astype(np.uint8))

          rng = random.Random(7)
          bokeh = []
          for i in range(9):
              r = rng.randint(70, 200)
              im = Image.new("RGBA", (2 * r, 2 * r), (0, 0, 0, 0))
              ImageDraw.Draw(im).ellipse([0, 0, 2 * r - 1, 2 * r - 1], fill=(255, 255, 255, rng.randint(25, 55)))
              bokeh.append((im, rng.randint(0, W), rng.randint(0, H), rng.uniform(20, 60), rng.uniform(0, 6)))
          conf = [(rng.randint(0, W), rng.uniform(250, 600), rng.randint(10, 22), rng.choice(COLORS), rng.uniform(0, 6), rng.uniform(0, 1.0)) for _ in range(70)]
          conf_windows = [(0.2, 2.2), (T_cta, TOTAL)]

          def ease_back(x):
              if x <= 0:
                  return 0.0
              if x >= 1:
                  return 1.0
              c1 = 1.70158
              c3 = c1 + 1
              return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2

          def put(frame, im, cx, cy, s=1.0):
              if s <= 0.02:
                  return
              if abs(s - 1) > 0.005:
                  im = im.resize((max(1, int(im.width * s)), max(1, int(im.height * s))), Image.BILINEAR)
              frame.paste(im, (int(cx - im.width / 2), int(cy - im.height / 2)), im)

          def render(t):
              off = int(t * 90) % H
              img = bg.crop((0, off, W, off + H))
              for im, bx, by, sp, ph in bokeh:
                  put(img, im, bx + math.sin(t * 0.6 + ph) * 50, (by - t * sp) % (H + 400) - 200)
              d = ImageDraw.Draw(img)
              for w0, w1 in conf_windows:
                  if w0 <= t <= w1:
                      for x0, sp, sz, c, ph, dl in conf:
                          tt = t - w0 - dl
                          if tt < 0:
                              continue
                          y = tt * sp - 50
                          if y > H:
                              continue
                          x = x0 + math.sin(tt * 3 + ph) * 40
                          d.rectangle([x, y, x + sz, y + sz * 0.6], fill=hexrgb(c))
              for e in els:
                  if t < e["a"]:
                      continue
                  s = ease_back((t - e["a"]) / 0.35)
                  active = True
                  if e["b"] is not None and t > e["b"]:
                      s = max(0.0, 1 - (t - e["b"]) / 0.25)
                      active = False
                      if s <= 0:
                          continue
                  dy = math.sin((t - e["a"]) * 4 + e["ph"]) * 6 if (e["bounce"] and active) else 0
                  put(img, e["im"], e["cx"], e["cy"] + dy, s)
              # countdown ring
              if T_count - 0.1 <= t < T_timer_end + 0.25:
                  s = ease_back((t - T_count) / 0.35)
                  if t > T_timer_end:
                      s = max(0.0, 1 - (t - T_timer_end) / 0.25)
                  prog = 1.0 if t < T_timer else max(0.0, 1 - (t - T_timer) / secs)
                  r = int(105 * s)
                  cx, cy = W // 2, 1420
                  if r > 8:
                      d.ellipse([cx - r, cy - r, cx + r, cy + r], fill=(255, 255, 255))
                      col = (46, 196, 100) if prog > 0.5 else ((255, 160, 0) if prog > 0.25 else (235, 60, 60))
                      d.arc([cx - r + 12, cy - r + 12, cx + r - 12, cy + r - 12], -90, -90 + 360 * prog, fill=col, width=max(2, int(16 * s)))
                      num = secs if t < T_timer else max(1, math.ceil(secs - (t - T_timer)))
                      d.text((cx, cy), str(num), font=font(F_EN, int(100 * s)), fill=(50, 30, 90), anchor="mm")
              return img

          # ------------------------------------------------------------------ AUDIO
          buf = np.zeros(int((TOTAL + 0.5) * SR), dtype=np.float32)

          def tone(freq, d_, vol, decay):
              t = np.arange(int(SR * d_)) / SR
              return (np.sin(2 * np.pi * freq * t) * np.exp(-decay * t) * vol).astype(np.float32)

          snd_pop = tone(660, 0.12, 0.5, 25) + tone(990, 0.12, 0.25, 25)
          snd_tick = tone(1200, 0.05, 0.35, 60)
          snd_tick2 = tone(1800, 0.09, 0.5, 40)
          snd_ding = tone(1320, 0.6, 0.4, 5) + tone(1760, 0.6, 0.25, 5)
          nz = int(SR * 0.35)
          snd_whoosh = (np.random.randn(nz) * (np.sin(np.linspace(0, np.pi, nz)) ** 2) * 0.12).astype(np.float32)

          def mix(snd, t, gain=1.0):
              i = int(t * SR)
              n = min(len(snd), len(buf) - i)
              if n > 0 and i >= 0:
                  buf[i:i + n] += snd[:n] * gain

          mix(snd_whoosh, 0.15)
          mix(snd_whoosh, T_hook - 0.1)
          for i in range(len(rules)):
              mix(snd_pop, T_rules + i * rstep)
          for t0 in T_items:
              mix(snd_pop, t0)
          for i in range(secs):
              mix(snd_tick2 if i >= secs - 3 else snd_tick, T_timer + i)
          mix(snd_ding, T_cta)
          mix(speech["hook"], T_hook)
          mix(speech["rules"], T_rules)
          mix(speech["count"], T_count)
          mix(speech["cta"], T_cta)

          tracks = [p for e in ("mp3", "wav", "m4a", "aac", "ogg", "flac", "mp4") for p in glob.glob(f"bgmusic/*.{e}")]
          if tracks:
              try:
                  mp = random.choice(tracks)
                  dd = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", mp],
                                      capture_output=True, text=True).stdout.strip()
                  mdur = float(dd) if dd else 0
                  ms = random.uniform(0, mdur - TOTAL - 2) if mdur > TOTAL + 4 else 0
                  raw = subprocess.run(["ffmpeg", "-v", "error", "-stream_loop", "-1", "-ss", f"{ms:.1f}", "-t", f"{TOTAL:.1f}",
                                        "-i", mp, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"], capture_output=True).stdout
                  m = np.frombuffer(raw, dtype=np.float32)
                  n = min(len(m), len(buf))
                  env = np.ones(n, dtype=np.float32)
                  fi, fo = int(SR * 0.5), int(SR * 1.2)
                  if n > fi + fo:
                      env[:fi] = np.linspace(0, 1, fi)
                      env[-fo:] = np.linspace(1, 0, fo)
                  buf[:n] += m[:n] * env * 0.18
              except Exception as ex:
                  print("music failed:", ex)

          buf = np.clip(buf * 0.9, -1, 1)
          with wave.open("audio.wav", "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(SR)
              wf.writeframes((buf * 32767).astype(np.int16).tobytes())

          # ------------------------------------------------------------------ RENDER
          render(T_timer + 0.4).save("final_image.jpg", quality=92)

          ff = subprocess.Popen(["ffmpeg", "-v", "error", "-y", "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", f"{W}x{H}", "-r", str(FPS),
                                 "-i", "-", "-i", "audio.wav", "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                                 "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-ac", "2", "-t", f"{TOTAL:.2f}",
                                 "-movflags", "+faststart", "final.mp4"], stdin=subprocess.PIPE)
          for k in range(int(TOTAL * FPS)):
              ff.stdin.write(render(k / FPS).tobytes())
          ff.stdin.close()
          ff.wait()

          # ------------------------------------------------------------------ TEXT OUTPUTS
          caption = f"{title} | {hook_d} 🧠\nاكتب إجابتك في التعليقات 👇\n#تعلم_الانجليزية #learnenglish #english #تحدي"
          open("caption.txt", "w", encoding="utf-8").write(caption)
          open("comment.txt", "w", encoding="utf-8").write(comment)
          json.dump(used, open(USED_FILE, "w"), ensure_ascii=False, indent=1)
          print("Done.")
          PYEOF

          python3 game.py
          ls -lh final.mp4 final_image.jpg

      - name: post-reel
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          API="https://graph.facebook.com/v19.0"
          SIZE=$(stat -c%s final.mp4)
          POST_ID=""; VID=""
          for attempt in 1 2 3; do
            INIT=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$PAGE_TOKEN" '{upload_phase:"start",access_token:$t}')")
            VID=$(echo "$INIT" | jq -r '.video_id // empty')
            URL=$(echo "$INIT" | jq -r '.upload_url // empty')
            if [ -n "$VID" ] && [ -n "$URL" ]; then
              curl -s -X POST "$URL" -H "Authorization: OAuth $PAGE_TOKEN" -H "offset: 0" -H "file_size: $SIZE" \
                --data-binary "@final.mp4" > /dev/null
              FIN=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
                -d "$(jq -n --arg t "$PAGE_TOKEN" --arg v "$VID" --rawfile d caption.txt \
                '{upload_phase:"finish",video_id:$v,video_state:"PUBLISHED",description:$d,access_token:$t}')")
              if echo "$FIN" | jq -e '.success == true' > /dev/null 2>&1; then
                POST_ID=$(echo "$FIN" | jq -r '.post_id // empty')
                echo "Reel published"
                break
              fi
              echo "Finish failed: $FIN"
            else
              echo "Init failed: $INIT"
            fi
            VID=""
            sleep 10
          done

          if [ -z "$VID" ]; then
            echo "Falling back to regular video upload"
            RESP=$(curl -s -X POST "$API/$PAGE_ID/videos" -F "source=@final.mp4" \
              -F "description=<caption.txt" -F "access_token=$PAGE_TOKEN")
            VID=$(echo "$RESP" | jq -r '.id // empty')
            [ -z "$VID" ] && { echo "Upload failed: $RESP"; exit 1; }
          fi

          # Answer comment (Reels need processing time, so retry)
          for i in $(seq 1 8); do
            for ID in $POST_ID $VID; do
              R=$(curl -s -X POST "$API/$ID/comments" \
                --data-urlencode "access_token=$PAGE_TOKEN" --data-urlencode "message@comment.txt")
              if echo "$R" | jq -e '.id' > /dev/null 2>&1; then echo "Comment posted on $ID"; exit 0; fi
            done
            echo "Comment retry $i: $R"
            sleep 30
          done
          echo "Could not post comment"; exit 1

      - name: post-image
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          API="https://graph.facebook.com/v19.0"
          RESP=$(curl -s -X POST "$API/$PAGE_ID/photos" -F "source=@final_image.jpg" \
            -F "caption=<caption.txt" -F "published=true" -F "access_token=$PAGE_TOKEN")
          PID=$(echo "$RESP" | jq -r '.id // empty'); PPOST=$(echo "$RESP" | jq -r '.post_id // empty')
          [ -z "$PID" ] && { echo "Image post failed: $RESP"; exit 1; }
          for ID in $PID $PPOST; do
            R=$(curl -s -X POST "$API/$ID/comments" \
              --data-urlencode "access_token=$PAGE_TOKEN" --data-urlencode "message@comment.txt")
            if echo "$R" | jq -e '.id' > /dev/null 2>&1; then echo "Comment posted on $ID"; exit 0; fi
          done
          echo "Image comment failed: $R"; exit 1

      - name: save-used
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add used.json
          git diff --cached --quiet || (git commit -m "update used items [skip ci]" && git pull --rebase && git push)