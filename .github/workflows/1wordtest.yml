              words = [w for w in top_n_list("en", 30000)
                       if w.isascii() and w.isalpha() and w.islower() and 3 <= len(w) <= 8
                       and (dic is None or w in dic) and w not in BLOCK]
              L = {"easy": 6, "medium": 7, "hard": 8}[level]
              bases = [w for w in words[:12000] if len(w) == L and not w.endswith("s") and w not in used_ids]
              random.shuffle(bases)
              cw = [(w, Counter(w)) for w in words]
              for base in bases[:80]:
                  cb = Counter(base)
                  ans = [w for w, c in cw if len(w) <= L and all(c[k] <= cb[k] for k in c)]
                  if len(ans) >= 8:
                      print(f"Word maker: {base} -> {len(ans)} answers")
                      return dict(id=base, level=level, letters=base.upper(), answers=ans)
              return None


