          def tone(freq, d_, vol, decay):
              t = np.arange(int(SR * d_)) / SR
              return (np.sin(2 * np.pi * freq * t) * np.exp(-decay * t) * vol).astype(np.float32)


          snd_pop = tone(660, 0.12, 0.5, 25) + tone(990, 0.12, 0.25, 25)
          snd_ding = tone(1320, 0.6, 0.4, 5) + tone(1760, 0.6, 0.25, 5)
          nz = int(SR * 0.35)
          snd_whoosh = (np.random.randn(nz) * (np.sin(np.linspace(0, np.pi, nz)) ** 2) * 0.12).astype(np.float32)


          def mix(snd, t, gain=1.0):
              i = int(t * SR)
              n = min(len(snd), len(buf) - i)
              if n > 0 and i >= 0:
                  buf[i:i + n] += snd[:n] * gain


          mix(snd_whoosh, 0.0)
          for i in range(len(rules)):
              mix(snd_pop, T_rules + i * rstep)
          for t0 in T_items:
              mix(snd_pop, t0)
          mix(snd_ding, T_cta)
          mix(speech["rules"], T_rules)
          mix(speech["cta"], T_cta)

          tracks = [p for e in ("mp3", "wav", "m4a", "aac", "ogg", "flac", "mp4") for p in glob.glob(f"bgmusic/*.{e}")]
          if tracks:
              try:
                  mp = random.choice(tracks)
                  dd = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", mp],
                                      capture_output=True, text=True).stdout.strip()
                  mdur = float(dd) if dd else 0
                  ms = random.uniform(0, mdur - TOTAL - 2) if mdur > TOTAL + 4 else 0
                  raw = subprocess.run(["ffmpeg", "-v", "error", "-stream_loop", "-1", "-ss", f"{ms:.1f}", "-t", f"{TOTAL:.1f}",
                                        "-i", mp, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"], capture_output=True).stdout
                  m = np.frombuffer(raw, dtype=np.float32)
                  n = min(len(m), len(buf))
                  env = np.ones(n, dtype=np.float32)
                  fi, fo = int(SR * 0.3), int(SR * 0.8)
                  if n > fi + fo:
                      env[:fi] = np.linspace(0, 1, fi)
                      env[-fo:] = np.linspace(1, 0, fo)
                  buf[:n] += m[:n] * env * 0.22
              except Exception as ex:
                  print("music failed:", ex)

          buf = np.clip(buf * 0.9, -1, 1)
          with wave.open("audio.wav", "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(SR)
              wf.writeframes((buf * 32767).astype(np.int16).tobytes())

          # ================================================================== RENDER
          ff = subprocess.Popen(["ffmpeg", "-v", "error", "-y", "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", f"{W}x{H}",
                                 "-r", str(FPS), "-i", "-", "-i", "audio.wav", "-c:v", "libx264", "-preset", "veryfast",
                                 "-crf", "20", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-ac", "2",
                                 "-t", f"{TOTAL:.2f}", "-movflags", "+faststart", "final.mp4"], stdin=subprocess.PIPE)
          for k in range(int(TOTAL * FPS)):
              ff.stdin.write(render(k / FPS).tobytes())
          ff.stdin.close()
          ff.wait()

          # ================================================================== TEXT OUTPUTS
          caption = f"{title} 🧠\n{cta_d} 👇\n#تعلم_الانجليزية #learnenglish #english #تحدي"
          open("caption.txt", "w", encoding="utf-8").write(caption)
          open("comment.txt", "w", encoding="utf-8").write(comment)
          json.dump(used, open(USED_FILE, "w"), ensure_ascii=False, indent=1)
          print("Done.")
          PYEOF

          python3 game.py
          ls -lh final.mp4

      - name: post-reel
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          API="https://graph.facebook.com/v19.0"
          SIZE=$(stat -c%s final.mp4)
          POST_ID=""; VID=""
          for attempt in 1 2 3; do
            INIT=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$PAGE_TOKEN" '{upload_phase:"start",access_token:$t}')")
            VID=$(echo "$INIT" | jq -r '.video_id // empty')
            URL=$(echo "$INIT" | jq -r '.upload_url // empty')
            if [ -n "$VID" ] && [ -n "$URL" ]; then
              curl -s -X POST "$URL" -H "Authorization: OAuth $PAGE_TOKEN" -H "offset: 0" -H "file_size: $SIZE" \
                --data-binary "@final.mp4" > /dev/null
              FIN=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
                -d "$(jq -n --arg t "$PAGE_TOKEN" --arg v "$VID" --rawfile d caption.txt \
                '{upload_phase:"finish",video_id:$v,video_state:"PUBLISHED",description:$d,access_token:$t}')")
              if echo "$FIN" | jq -e '.success == true' > /dev/null 2>&1; then
                POST_ID=$(echo "$FIN" | jq -r '.post_id // empty')
                echo "Reel published"
                break
              fi
              echo "Finish failed: $FIN"
            else
              echo "Init failed: $INIT"
            fi
            VID=""
            sleep 10
          done

          if [ -z "$VID" ]; then
            echo "Falling back to regular video upload"
            RESP=$(curl -s -X POST "$API/$PAGE_ID/videos" -F "source=@final.mp4" \
              -F "description=<caption.txt" -F "access_token=$PAGE_TOKEN")
            VID=$(echo "$RESP" | jq -r '.id // empty')
            [ -z "$VID" ] && { echo "Upload failed: $RESP"; exit 1; }
          fi

          for i in $(seq 1 8); do
            for ID in $POST_ID $VID; do
              R=$(curl -s -X POST "$API/$ID/comments" \
                --data-urlencode "access_token=$PAGE_TOKEN" --data-urlencode "message@comment.txt")
              if echo "$R" | jq -e '.id' > /dev/null 2>&1; then echo "Comment posted on $ID"; exit 0; fi
            done
            echo "Comment retry $i: $R"
            sleep 30
          done
          echo "Could not post comment"; exit 1

      - name: save-used
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add used.json
          git diff --cached --quiet || (git commit -m "update used items [skip ci]" && git pull --rebase && git push)