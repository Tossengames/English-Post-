          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq python3-pip wamerican fonts-noto-core fonts-noto-ui-core
          pip install --quiet --break-system-packages pillow numpy edge-tts arabic-reshaper python-bidi wordfreq

