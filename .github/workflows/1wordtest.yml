name: english-games-post

"on":
  workflow_dispatch:
    inputs:
      game:
        description: "Game type"
        required: false
        default: "auto"
        type: choice
        options: [auto, word_maker, unscramble, sentence_builder, fill_blank]
  schedule:
    - cron: "0 7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: english-games-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq python3-pip wamerican fonts-noto-core fonts-noto-ui-core
          pip install --quiet --break-system-packages pillow numpy edge-tts arabic-reshaper python-bidi wordfreq

      - name: build-game
        id: build
        timeout-minutes: 12
        env:
          GAME: ${{ github.event.inputs.game }}
          AR_VOICE: ar-SA-HamedNeural
        run: |
          python3 game.py
          ls -lh final.mp4 final_image.jpg

      - name: post-reel
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          API="https://graph.facebook.com/v19.0"
          SIZE=$(stat -c%s final.mp4)
          POST_ID=""; VID=""
          for attempt in 1 2 3; do
            INIT=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
              -d "$(jq -n --arg t "$PAGE_TOKEN" '{upload_phase:"start",access_token:$t}')")
            VID=$(echo "$INIT" | jq -r '.video_id // empty')
            URL=$(echo "$INIT" | jq -r '.upload_url // empty')
            if [ -n "$VID" ] && [ -n "$URL" ]; then
              curl -s -X POST "$URL" -H "Authorization: OAuth $PAGE_TOKEN" -H "offset: 0" -H "file_size: $SIZE" \
                --data-binary "@final.mp4" > /dev/null
              FIN=$(curl -s -X POST "$API/$PAGE_ID/video_reels" -H "Content-Type: application/json" \
                -d "$(jq -n --arg t "$PAGE_TOKEN" --arg v "$VID" --rawfile d caption.txt \
                '{upload_phase:"finish",video_id:$v,video_state:"PUBLISHED",description:$d,access_token:$t}')")
              if echo "$FIN" | jq -e '.success == true' > /dev/null 2>&1; then
                POST_ID=$(echo "$FIN" | jq -r '.post_id // empty')
                echo "Reel published"
                break
              fi
              echo "Finish failed: $FIN"
            else
              echo "Init failed: $INIT"
            fi
            VID=""
            sleep 10
          done

          if [ -z "$VID" ]; then
            echo "Falling back to regular video upload"
            RESP=$(curl -s -X POST "$API/$PAGE_ID/videos" -F "source=@final.mp4" \
              -F "description=<caption.txt" -F "access_token=$PAGE_TOKEN")
            VID=$(echo "$RESP" | jq -r '.id // empty')
            [ -z "$VID" ] && { echo "Upload failed: $RESP"; exit 1; }
          fi

          for i in $(seq 1 8); do
            for ID in $POST_ID $VID; do
              R=$(curl -s -X POST "$API/$ID/comments" \
                --data-urlencode "access_token=$PAGE_TOKEN" --data-urlencode "message@comment.txt")
              if echo "$R" | jq -e '.id' > /dev/null 2>&1; then echo "Comment posted on $ID"; exit 0; fi
            done
            echo "Comment retry $i: $R"
            sleep 30
          done
          echo "Could not post comment"; exit 1

      - name: post-image
        if: ${{ always() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          API="https://graph.facebook.com/v19.0"
          RESP=$(curl -s -X POST "$API/$PAGE_ID/photos" -F "source=@final_image.jpg" \
            -F "caption=<caption.txt" -F "published=true" -F "access_token=$PAGE_TOKEN")
          PID=$(echo "$RESP" | jq -r '.id // empty'); PPOST=$(echo "$RESP" | jq -r '.post_id // empty')
          [ -z "$PID" ] && { echo "Image post failed: $RESP"; exit 1; }
          for ID in $PID $PPOST; do
            R=$(curl -s -X POST "$API/$ID/comments" \
              --data-urlencode "access_token=$PAGE_TOKEN" --data-urlencode "message@comment.txt")
            if echo "$R" | jq -e '.id' > /dev/null 2>&1; then echo "Comment posted on $ID"; exit 0; fi
          done
          echo "Image comment failed: $R"; exit 1

      - name: save-used
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add used.json
          git diff --cached --quiet || (git commit -m "update used items [skip ci]" && git pull --rebase && git push)