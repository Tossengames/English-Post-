    for (let i = 0; i < Math.ceil(catalogNames().length / CAT_PER); i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Catalog ' + (i + 1); $('catpage').appendChild(o); }
    loadTopic(STORIES[0].id); draw(); $('loading').style.display = 'none'; window._ready = true; })();
})();

</script>
