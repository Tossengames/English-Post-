<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Daily English: Whiteboard Reels (for Arabic speakers)</title>

<style>
  html, body { margin:0; height:100%; background:#10151d; color:#eef3f8; font:15px Kalam, "Comic Sans MS", cursive; }
  #app { display:flex; flex-direction:column; height:100%; }
  #stage { flex:1; min-height:0; position:relative; background:#10151d; }
  canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#10151d; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; pointer-events:none; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#1a212c; border-top:1px solid #2c3646; flex-wrap:wrap; }
  #bar button, #bar select { background:#263142; color:#eef3f8; border:1px solid #3d4b61; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; min-width:44px; }
  #bar button:focus-visible, #bar select:focus-visible, #seek:focus-visible { outline:2px solid #ffb02e; outline-offset:2px; }
  #bar button[aria-pressed="true"] { background:#3d4b61; }
  #seek { flex:1; min-width:120px; accent-color:#ffb02e; }
  #time { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="720" height="1280"></canvas><div id="loading">Warming up the markers...</div></div>
  <div id="bar">
    <button id="play" aria-label="Play">Play</button>
    <select id="topic" aria-label="Lesson"></select>
    <input id="seek" type="range" min="0" max="40" step="0.01" value="0" aria-label="Scrub">
    <span id="time">0:00.0 / 0:00.0</span>
    <button id="snd" aria-pressed="true" aria-label="Sound on or off">Sound</button>
    <button id="loop" aria-pressed="true" aria-label="Loop on or off">Loop</button>
  </div>
</div>

// =====================================================================
//  FRAME

const cv = document.getElementById('c'), ctx = cv.getContext('2d');

  c.clearRect(0, 0, W, HH); room(c, T); teacher(c, T);

window.frameJPEG = (t) => { draw(ctx, t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };

// =====================================================================
//  SOUND  (marker squeaks, ticks, dings, eraser, soft background loop)
// =====================================================================
const mhz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  return { id: STORY.id, title: STORY.title, vo: STORY.beats.map((b) => b.vo), caption: STORY.caption, tags: STORY.tags, note: STORY.note,
    footer: 'Daily English: free lessons for Arabic speakers learning English. تعلم الإنجليزية خطوة بخطوة.', kind: STORY.kind };

// =====================================================================
//  BROWSER PREVIEW PLAYER
// =====================================================================
const $ = (id) => document.getElementById(id);
let playing = false, tNow = 0, lastTs = 0, soundOn = true, loopOn = true, actx = null, spoken = -1;
