<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>لحظة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@200;300;400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* ── per-theme overrides via body class ── */
#stage{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 7vw;}

/* PILLAR LABEL */
#pillar{
  position:fixed;z-index:12;
  font-family:'Noto Sans Arabic',sans-serif;
  font-weight:700;
  letter-spacing:0.22em;
  text-transform:uppercase;
  opacity:0;
  transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;
}
#pillar.in{opacity:1;}

/* HEADLINE */
#headline{
  font-family:'Noto Naskh Arabic',serif;
  font-weight:700;
  text-align:center;
  width:100%;
  white-space:normal;word-break:break-word;overflow-wrap:break-word;
  opacity:0;
  pointer-events:none;
}
#headline.in{opacity:1;}

/* DIVIDER */
#divider{width:0;flex-shrink:0;transition:width .9s cubic-bezier(.22,1,.36,1);}

/* BODY */
#body{
  font-family:'Noto Sans Arabic',sans-serif;
  font-weight:300;
  text-align:center;
  width:100%;
  white-space:normal;word-break:break-word;overflow-wrap:break-word;
  opacity:0;
  pointer-events:none;
  line-height:1.9;
}
#body.in{opacity:1;}

/* CTA */
#cta{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:1em;
  z-index:12;
  padding-bottom:8vw;
  opacity:0;transition:opacity .6s ease;
}
#cta.in{opacity:1;}
#ctaTxt{
  font-family:'Noto Sans Arabic',sans-serif;
  font-weight:600;
  font-size:clamp(0.5rem,2.3vw,0.68rem);
  letter-spacing:0.12em;
}
#ctaDot{width:5px;height:5px;border-radius:50%;animation:breathe 2s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:1;transform:scale(1.6);}}

/* ── THEME: AURORA (dark) ── */
body.aurora #pillar{top:10vw;left:50%;transform:translateX(-50%) translateY(-8px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(120,255,180,.7);}
body.aurora #pillar.in{transform:translateX(-50%) translateY(0);}
body.aurora #headline{font-size:clamp(2rem,9.5vw,3.2rem);color:#e0fff4;text-shadow:0 0 40px rgba(80,255,160,.3),0 2px 20px rgba(0,0,0,.6);line-height:1.4;margin-bottom:4vw;}
body.aurora #headline.in{animation:auroraHL .8s ease-out;}
@keyframes auroraHL{0%{opacity:0;transform:translateY(30px);}100%{opacity:1;transform:translateY(0);}}
body.aurora #divider{height:1px;background:linear-gradient(90deg,transparent,rgba(120,255,180,.6),transparent);margin:0 auto 4vw;}
body.aurora #body{font-size:clamp(.95rem,4.5vw,1.3rem);color:rgba(200,255,230,.82);}
body.aurora #body.in{animation:auroraBody .7s ease-out;}
@keyframes auroraBody{0%{opacity:0;transform:translateY(18px);}100%{opacity:1;transform:translateY(0);}}
body.aurora #ctaTxt{color:rgba(120,255,180,.7);}
body.aurora #ctaDot{background:rgba(120,255,180,.8);}

/* ── THEME: EMBER (dark) ── */
body.ember #pillar{top:10vw;right:7vw;transform:translateY(-8px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(255,160,60,.8);}
body.ember #pillar.in{transform:translateY(0);}
body.ember #headline{font-size:clamp(2.2rem,10vw,3.5rem);color:#fff4e0;text-shadow:0 0 50px rgba(255,120,20,.4),0 2px 20px rgba(0,0,0,.7);line-height:1.35;margin-bottom:5vw;}
body.ember #headline.in{animation:emberHL 1s cubic-bezier(.16,1,.3,1);}
@keyframes emberHL{0%{opacity:0;transform:scale(.92) translateY(24px);}100%{opacity:1;transform:scale(1) translateY(0);}}
body.ember #divider{height:2px;background:linear-gradient(90deg,transparent,rgba(255,140,40,.8),transparent);margin:0 auto 5vw;box-shadow:0 0 12px rgba(255,120,20,.5);}
body.ember #body{font-size:clamp(.9rem,4.3vw,1.25rem);color:rgba(255,220,170,.85);font-weight:400;}
body.ember #body.in{animation:emberBody .6s ease-out;}
@keyframes emberBody{0%{opacity:0;transform:translateY(14px);}100%{opacity:1;transform:translateY(0);}}
body.ember #ctaTxt{color:rgba(255,160,60,.8);}
body.ember #ctaDot{background:rgba(255,140,40,.9);}

/* ── THEME: COSMOS (dark) ── */
body.cosmos #pillar{top:10vw;left:50%;transform:translateX(-50%) scale(.8);font-size:clamp(.44rem,2vw,.6rem);color:rgba(180,140,255,.7);letter-spacing:.35em;}
body.cosmos #pillar.in{transform:translateX(-50%) scale(1);}
body.cosmos #headline{font-size:clamp(1.8rem,8.5vw,3rem);color:#f0eaff;text-shadow:0 0 60px rgba(140,100,255,.35),0 2px 24px rgba(0,0,0,.7);line-height:1.45;margin-bottom:5vw;font-weight:400;}
body.cosmos #headline.in{animation:cosmosHL .9s ease-out;}
@keyframes cosmosHL{0%{opacity:0;filter:blur(8px);}60%{filter:blur(0);}100%{opacity:1;}}
body.cosmos #divider{height:1px;background:linear-gradient(90deg,transparent,rgba(180,140,255,.5),transparent);margin:0 auto 5vw;}
body.cosmos #body{font-size:clamp(.88rem,4.2vw,1.2rem);color:rgba(210,200,255,.8);font-weight:200;letter-spacing:.02em;}
body.cosmos #body.in{animation:cosmosBody .8s ease-out .1s both;}
@keyframes cosmosBody{0%{opacity:0;filter:blur(4px);}100%{opacity:1;filter:blur(0);}}
body.cosmos #ctaTxt{color:rgba(180,140,255,.7);}
body.cosmos #ctaDot{background:rgba(180,140,255,.8);}

/* ── THEME: NEON GRID (dark) ── */
body.neongrid #pillar{bottom:22vw;left:50%;transform:translateX(-50%) translateY(8px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(0,240,200,.9);text-shadow:0 0 10px rgba(0,240,200,.8);}
body.neongrid #pillar.in{transform:translateX(-50%) translateY(0);}
body.neongrid #headline{font-size:clamp(2rem,9vw,3.2rem);color:#e0fff8;text-shadow:0 0 30px rgba(0,240,200,.5),0 0 60px rgba(0,200,160,.2);line-height:1.35;margin-bottom:4vw;font-family:'Noto Sans Arabic',sans-serif;font-weight:800;}
body.neongrid #headline.in{animation:neonHL .5s steps(1) both;}
@keyframes neonHL{
  0%{opacity:0;}10%{opacity:1;text-shadow:0 0 30px rgba(0,240,200,.9),0 0 2px #fff;}
  15%{opacity:.2;}20%{opacity:1;}25%{opacity:.4;}30%{opacity:1;text-shadow:0 0 30px rgba(0,240,200,.5);}
  100%{opacity:1;}
}
body.neongrid #divider{height:2px;background:rgba(0,240,200,.7);box-shadow:0 0 14px rgba(0,240,200,.8);margin:0 auto 4vw;}
body.neongrid #body{font-size:clamp(.9rem,4.3vw,1.25rem);color:rgba(160,255,230,.82);font-family:'Noto Sans Arabic',sans-serif;font-weight:400;}
body.neongrid #body.in{animation:neonBody .4s ease-out;}
@keyframes neonBody{0%{opacity:0;transform:translateX(-10px);}100%{opacity:1;transform:translateX(0);}}
body.neongrid #ctaTxt{color:rgba(0,240,200,.8);text-shadow:0 0 8px rgba(0,240,200,.5);}
body.neongrid #ctaDot{background:rgba(0,240,200,.9);box-shadow:0 0 8px rgba(0,240,200,.8);}

/* ── THEME: PRISM (dark) ── */
body.prism #pillar{top:10vw;left:7vw;transform:rotate(-90deg) translateX(-50%);transform-origin:left center;font-size:clamp(.4rem,1.8vw,.55rem);color:rgba(255,220,80,.8);}
body.prism #pillar.in{opacity:1;}
body.prism #headline{font-size:clamp(2rem,9vw,3.2rem);color:#fff8e8;text-shadow:0 0 40px rgba(255,200,60,.3),0 2px 20px rgba(0,0,0,.7);line-height:1.4;margin-bottom:4vw;}
body.prism #headline.in{animation:prismHL .7s ease-out;}
@keyframes prismHL{0%{opacity:0;transform:skewX(4deg) translateY(20px);}100%{opacity:1;transform:skewX(0) translateY(0);}}
body.prism #divider{height:3px;background:linear-gradient(90deg,#ff4060,#ffb020,#40ff80,#40c0ff,#a040ff);margin:0 auto 4vw;border-radius:2px;}
body.prism #body{font-size:clamp(.9rem,4.3vw,1.25rem);color:rgba(255,240,200,.84);}
body.prism #body.in{animation:prismBody .6s ease-out;}
@keyframes prismBody{0%{opacity:0;transform:skewX(-2deg);}100%{opacity:1;transform:skewX(0);}}
body.prism #ctaTxt{color:rgba(255,220,80,.8);}
body.prism #ctaDot{background:rgba(255,200,60,.9);}

/* ── THEME: SAGE (bright) ── */
body.sage #pillar{top:10vw;left:50%;transform:translateX(-50%) translateY(-6px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(60,110,80,.7);}
body.sage #pillar.in{transform:translateX(-50%) translateY(0);}
body.sage #headline{font-size:clamp(2rem,9vw,3.1rem);color:#0e2018;text-shadow:0 1px 10px rgba(60,110,80,.15);line-height:1.45;margin-bottom:4vw;}
body.sage #headline.in{animation:sageHL .8s cubic-bezier(.16,1,.3,1);}
@keyframes sageHL{0%{opacity:0;transform:translateY(22px);}100%{opacity:1;transform:translateY(0);}}
body.sage #divider{height:1px;background:linear-gradient(90deg,transparent,rgba(60,110,80,.5),transparent);margin:0 auto 4vw;}
body.sage #body{font-size:clamp(.95rem,4.5vw,1.3rem);color:rgba(20,60,35,.72);}
body.sage #body.in{animation:sageBody .7s ease-out;}
@keyframes sageBody{0%{opacity:0;transform:translateY(14px);}100%{opacity:1;transform:translateY(0);}}
body.sage #ctaTxt{color:rgba(60,110,80,.8);}
body.sage #ctaDot{background:rgba(60,110,80,.7);}

/* ── THEME: BLUSH (bright) ── */
body.blush #pillar{top:10vw;right:7vw;transform:translateY(-6px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(160,60,60,.6);}
body.blush #pillar.in{transform:translateY(0);}
body.blush #headline{font-size:clamp(2rem,9.5vw,3.3rem);color:#1e0808;text-shadow:0 1px 12px rgba(180,60,60,.12);line-height:1.4;margin-bottom:5vw;}
body.blush #headline.in{animation:blushHL .9s cubic-bezier(.16,1,.3,1);}
@keyframes blushHL{0%{opacity:0;transform:scale(.95) translateY(18px);}100%{opacity:1;transform:scale(1) translateY(0);}}
body.blush #divider{height:1.5px;background:linear-gradient(90deg,transparent,rgba(180,80,80,.5),transparent);margin:0 auto 5vw;}
body.blush #body{font-size:clamp(.95rem,4.5vw,1.3rem);color:rgba(50,15,15,.7);}
body.blush #body.in{animation:blushBody .7s ease-out;}
@keyframes blushBody{0%{opacity:0;transform:translateY(12px);}100%{opacity:1;transform:translateY(0);}}
body.blush #ctaTxt{color:rgba(160,60,60,.7);}
body.blush #ctaDot{background:rgba(180,60,60,.8);}

/* ── THEME: SLATE (bright) ── */
body.slate #pillar{top:10vw;left:7vw;transform:translateY(-6px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(50,70,130,.7);}
body.slate #pillar.in{transform:translateY(0);}
body.slate #headline{font-size:clamp(1.9rem,9vw,3rem);color:#080e24;text-shadow:none;line-height:1.45;margin-bottom:5vw;font-weight:700;}
body.slate #headline.in{animation:slateHL .7s cubic-bezier(.22,1,.36,1);}
@keyframes slateHL{0%{opacity:0;transform:translateX(20px);}100%{opacity:1;transform:translateX(0);}}
body.slate #divider{height:2px;background:rgba(50,70,130,.3);margin:0 auto 5vw;border-radius:1px;}
body.slate #body{font-size:clamp(.95rem,4.5vw,1.3rem);color:rgba(20,30,70,.68);font-weight:400;}
body.slate #body.in{animation:slateBody .65s ease-out;}
@keyframes slateBody{0%{opacity:0;transform:translateX(14px);}100%{opacity:1;transform:translateX(0);}}
body.slate #ctaTxt{color:rgba(50,70,130,.7);}
body.slate #ctaDot{background:rgba(50,70,130,.8);}

/* ── THEME: AMBER (bright-warm) ── */
body.amber #pillar{top:10vw;left:50%;transform:translateX(-50%) translateY(-6px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(120,70,10,.7);}
body.amber #pillar.in{transform:translateX(-50%) translateY(0);}
body.amber #headline{font-size:clamp(2rem,9.5vw,3.3rem);color:#1a0e00;line-height:1.4;margin-bottom:5vw;text-shadow:0 1px 14px rgba(180,100,10,.15);}
body.amber #headline.in{animation:amberHL .8s ease-out;}
@keyframes amberHL{0%{opacity:0;transform:translateY(26px) scale(.97);}100%{opacity:1;transform:translateY(0) scale(1);}}
body.amber #divider{height:2px;background:linear-gradient(90deg,transparent,rgba(200,130,20,.7),transparent);margin:0 auto 5vw;}
body.amber #body{font-size:clamp(.95rem,4.5vw,1.3rem);color:rgba(60,35,5,.72);}
body.amber #body.in{animation:amberBody .7s ease-out;}
@keyframes amberBody{0%{opacity:0;transform:translateY(12px);}100%{opacity:1;transform:translateY(0);}}
body.amber #ctaTxt{color:rgba(140,80,10,.75);}
body.amber #ctaDot{background:rgba(200,130,20,.8);}

/* ── THEME: HAZE (dark-warm) ── */
body.haze #pillar{top:10vw;left:50%;transform:translateX(-50%) translateY(-6px);font-size:clamp(.44rem,2vw,.6rem);color:rgba(220,160,80,.7);}
body.haze #pillar.in{transform:translateX(-50%) translateY(0);}
body.haze #headline{font-size:clamp(2rem,9vw,3.1rem);color:#fff0d8;line-height:1.45;margin-bottom:5vw;text-shadow:0 2px 30px rgba(180,80,10,.3),0 2px 20px rgba(0,0,0,.5);}
body.haze #headline.in{animation:hazeHL .9s ease-out;}
@keyframes hazeHL{0%{opacity:0;filter:blur(6px);transform:translateY(16px);}70%{filter:blur(0);}100%{opacity:1;transform:translateY(0);}}
body.haze #divider{height:1px;background:linear-gradient(90deg,transparent,rgba(220,160,80,.55),transparent);margin:0 auto 5vw;}
body.haze #body{font-size:clamp(.95rem,4.5vw,1.3rem);color:rgba(255,225,170,.8);}
body.haze #body.in{animation:hazeBody .8s ease-out;}
@keyframes hazeBody{0%{opacity:0;filter:blur(3px);}100%{opacity:1;filter:blur(0);}}
body.haze #ctaTxt{color:rgba(220,160,80,.7);}
body.haze #ctaDot{background:rgba(220,160,80,.8);}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="pillar"></div>
<div id="stage">
  <div id="headline"></div>
  <div id="divider"></div>
  <div id="body"></div>
</div>
<div id="cta"><div id="ctaTxt"></div><div id="ctaDot"></div></div>

<script>
(function(){
'use strict';

// ══════════════════════════════════════════════
// THEMES
// ══════════════════════════════════════════════
const THEMES=[
  {
    id:'aurora',dark:true,
    init(w,h){},
    draw(ctx,w,h,t){
      ctx.fillStyle='#020d0a';ctx.fillRect(0,0,w,h);
      [[w*.5,h*.22,[80,240,160],.18,.18,0],[w*.4,h*.45,[40,180,220],.1,.13,1.2],[w*.6,h*.6,[160,80,240],.07,.22,2.4]].forEach(([ox,oy,col,amp,spd,ph])=>{
        const cy=oy+Math.sin(t*spd+ph)*h*amp;
        const g=ctx.createRadialGradient(ox,cy,0,ox,cy,w*.72);
        const a=.18+Math.sin(t*.2+ph)*.07;
        g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.5,`rgba(${col},${a*.3})`);g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      });
      for(let i=0;i<9;i++){
        const x=w*(.08+i*.1)+Math.sin(t*.2+i)*w*.02;
        const yoff=Math.sin(t*.3+i*.8)*h*.04;
        const ht=h*(.28+Math.sin(t*.15+i)*.08);
        const a=.055+Math.sin(t*.4+i)*.03;
        const gr=ctx.createLinearGradient(x,h*.08+yoff,x,h*.08+yoff+ht);
        gr.addColorStop(0,'rgba(120,255,180,0)');gr.addColorStop(.4,`rgba(120,255,180,${a})`);gr.addColorStop(1,'rgba(120,255,180,0)');
        ctx.fillStyle=gr;ctx.fillRect(x-1.2,h*.08+yoff,2.5,ht);
      }
    }
  },
  {
    id:'ember',dark:true,
    _p:[],
    init(w,h){
      this._p=[];
      for(let i=0;i<65;i++)this._p.push({x:Math.random()*w,y:h+Math.random()*h*.3,vx:(Math.random()-.5)*.5,vy:-(0.6+Math.random()*2),life:Math.random(),size:1+Math.random()*3.5,warm:Math.random()<.55});
    },
    draw(ctx,w,h,t){
      ctx.fillStyle='#0e0500';ctx.fillRect(0,0,w,h);
      const bg=ctx.createRadialGradient(w/2,h,0,w/2,h,w*.85);
      bg.addColorStop(0,'rgba(180,55,0,.38)');bg.addColorStop(.4,'rgba(100,25,0,.14)');bg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
      this._p.forEach(p=>{
        p.x+=p.vx+Math.sin(t*.8+p.y*.01)*.35;p.y+=p.vy;p.life-=.0045;
        if(p.life<=0||p.y<-10){p.x=Math.random()*w;p.y=h+5;p.life=.6+Math.random()*.4;p.vy=-(0.6+Math.random()*2);p.size=1+Math.random()*3.5;}
        const col=p.warm?`255,${90+Math.floor(p.life*60)},20`:`255,60,10`;
        const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.8);
        pg.addColorStop(0,`rgba(${col},${p.life*.9})`);pg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.save();ctx.globalAlpha=p.life*.8;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.8,0,Math.PI*2);ctx.fill();ctx.restore();
      });
    }
  },
  {
    id:'cosmos',dark:true,
    _s:[],
    init(w,h){
      this._s=[];
      for(let i=0;i<200;i++)this._s.push({x:Math.random()*w,y:Math.random()*h,r:.3+Math.random()*1.5,ph:Math.random()*Math.PI*2,spd:.4+Math.random()*.8,col:i%3===0?'255,240,220':i%3===1?'200,210,255':'255,255,255'});
    },
    draw(ctx,w,h,t){
      ctx.fillStyle='#020006';ctx.fillRect(0,0,w,h);
      [[w*.3,h*.3,80,120,60,.09],[w*.7,h*.55,120,60,140,.07],[w*.5,h*.75,40,160,200,.06],[w*.2,h*.6,180,80,60,.05]].forEach(([x,y,r,g2,b,a])=>{
        const ng=ctx.createRadialGradient(x,y,0,x,y,w*.5);
        ng.addColorStop(0,`rgba(${r},${g2},${b},${a})`);ng.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=ng;ctx.fillRect(0,0,w,h);
      });
      this._s.forEach(s=>{
        const br=.35+Math.sin(t*s.spd+s.ph)*.3;
        ctx.globalAlpha=br;ctx.fillStyle=`rgba(${s.col},1)`;
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;
    }
  },
  {
    id:'neongrid',dark:true,
    init(w,h){},
    draw(ctx,w,h,t){
      ctx.fillStyle='#020810';ctx.fillRect(0,0,w,h);
      const hz=h*.52;
      for(let i=0;i<20;i++){
        const fi=(i+t*.5)%20;const dep=fi/20;
        const y=hz+Math.pow(dep,1.7)*(h-hz)*1.1;
        const sp=Math.pow(dep,1.1)*w*.75;
        const a=dep*.24;
        ctx.strokeStyle=`rgba(0,200,160,${a})`;ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(w/2-sp,y);ctx.lineTo(w/2+sp,y);ctx.stroke();
      }
      for(let i=-9;i<=9;i++){
        const fi=i+(t*.5%1);const ang=fi/10;
        const ex=w/2+ang*w*.8;const a=.14-Math.abs(ang)*.1;
        if(a<.01)continue;
        ctx.strokeStyle=`rgba(0,200,160,${a})`;ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(w/2,hz);ctx.lineTo(ex,h+20);ctx.stroke();
      }
      const hg=ctx.createLinearGradient(0,hz-25,0,hz+35);
      hg.addColorStop(0,'rgba(0,220,170,0)');hg.addColorStop(.5,'rgba(0,220,170,.2)');hg.addColorStop(1,'rgba(0,220,170,0)');

        ctx.save();ctx.beginPath();

        ctx.closePath();ctx.fillStyle=bg;ctx.fill();ctx.restore();
      });

      src.addColorStop(0,'rgba(255,255,255,.95)');src.addColorStop(.3,'rgba(255,255,220,.3)');src.addColorStop(1,'rgba(0,0,0,0)');

  {

    init(w,h){

        const g=ctx.createRadialGradient(ox,oy,0,ox,oy,b.r);

      ctx.fillStyle=cg;ctx.fillRect(0,0,w,h);
    }
  },
];

const AC=new (window.AudioContext||window.webkitAudioContext)();
const master=AC.createGain();master.gain.value=.65;master.connect(AC.destination);
let _recDest=null,_audioOn=false,_pads=[];
function unlockAC(){if(_audioOn)return;AC.resume().then(()=>{_audioOn=true;startPad();});}
function startPad(){
  stopPad();
  try{[220,277.18,329.63,369.99].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
    o.type='sine';o.frequency.value=f;lfo.type='sine';lfo.frequency.value=.05+i*.012;lg.gain.value=.7;
    lfo.connect(lg);lg.connect(o.frequency);
    const tt=AC.currentTime;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.016-i*.002,tt+3);
    o.connect(g);g.connect(master);o.start(tt);lfo.start(tt);_pads.push({o,g,lfo});
  });}catch(e){}
}
function stopPad(){_pads.forEach(p=>{try{p.g.gain.setTargetAtTime(0,AC.currentTime,.5);setTimeout(()=>{try{p.o.stop();p.lfo.stop();}catch(e){}},1200);}catch(e){}});_pads=[];}
function sfxIn(){if(!_audioOn)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.exponentialRampToValueAtTime(180,AC.currentTime+.35);g.gain.setValueAtTime(.025,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.6);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.6);}catch(e){}}
function sfxBody(){if(!_audioOn)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(240,AC.currentTime);o.frequency.exponentialRampToValueAtTime(160,AC.currentTime+.4);g.gain.setValueAtTime(.018,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.65);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.65);}catch(e){}}

let _compC=null,_compCtx=null;
window._recActive=false;window._recordingDone=false;window._recordingBlob=null;
let _recChunks=[],_recorder=null;

function drawOT(c,txt,x,y,fill,stroke,sw){
  c.lineJoin='round';c.miterLimit=2;c.lineWidth=sw;
  c.strokeStyle=stroke;c.strokeText(txt,x,y);
  c.fillStyle=fill;c.fillText(txt,x,y);
}
function wrapText(c,text,maxW){
  const words=text.split(' ');const lines=[];let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(c.measureText(test).width>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);return lines;
}

function _drawComposite(){
  if(!_compCtx)return;
  const c=_compCtx,cW=_compC.width,cH=_compC.height;
  c.clearRect(0,0,cW,cH);
  c.drawImage(canvas,0,0,cW,cH);
  const vg=c.createRadialGradient(cW/2,cH/2,cH*.08,cW/2,cH/2,cH*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  c.fillStyle=vg;c.fillRect(0,0,cW,cH);
  c.direction='rtl';
  const th=_theme;
  const maxW=cW*.84;const cx=cW/2;

  // pillar
  const plEl=document.getElementById('pillar');
  const plOp=parseFloat(window.getComputedStyle(plEl).opacity)||0;
  if(plOp>.01){
    const fs=parseFloat(window.getComputedStyle(plEl).fontSize)||11;
    c.save();c.globalAlpha=plOp;
    c.font=`700 ${fs}px 'Noto Sans Arabic',sans-serif`;
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle=th.dark?'rgba(200,220,200,.6)':'rgba(60,80,60,.6)';
    c.fillText(plEl.textContent,cx,cH*.1);
    c.restore();
  }

  // headline
  const hlOp=parseFloat(window.getComputedStyle(hlEl).opacity)||0;
  if(hlOp>.01){
    const fs=parseFloat(window.getComputedStyle(hlEl).fontSize)||32;
    c.save();c.globalAlpha=hlOp;
    c.font=`700 ${fs}px 'Noto Naskh Arabic',serif`;
    c.textAlign='center';c.textBaseline='middle';
    const lines=wrapText(c,hlEl.textContent,maxW);
    const lh=fs*1.5;
    lines.forEach((ln,i)=>{
      const y=cH*.38+(i-(lines.length-1)/2)*lh;
      c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=18;
      drawOT(c,ln,cx,y,th.headCol||'#fff','rgba(0,0,0,.5)',Math.max(1.5,fs*.07));
    });
    c.restore();
  }

  // divider
  const dvW=parseFloat(dvEl.style.width)||0;
  if(dvW>2){
    c.save();
    const lg=c.createLinearGradient(cx-dvW/2,0,cx+dvW/2,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,th.ac||'rgba(255,255,255,.4)');lg.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=lg;c.fillRect(cx-dvW/2,cH*.53,dvW,1.5);
    c.restore();
  }

  // body
  const bdOp=parseFloat(window.getComputedStyle(bdEl).opacity)||0;
  if(bdOp>.01){
    const fs=parseFloat(window.getComputedStyle(bdEl).fontSize)||18;
    c.save();c.globalAlpha=bdOp;
    c.font=`300 ${fs}px 'Noto Sans Arabic',sans-serif`;
    c.textAlign='center';c.textBaseline='middle';
    const lines=wrapText(c,bdEl.textContent,maxW);
    const lh=fs*1.95;const totalH=lines.length*lh;
    const startY=cH*.62-totalH/2+lh/2;
    lines.forEach((ln,i)=>{
      c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=10;
      drawOT(c,ln,cx,startY+i*lh,th.bodyCol||'rgba(255,255,255,.8)','rgba(0,0,0,.35)',Math.max(1,fs*.05));
    });
    c.restore();
  }

  // cta
  const ctaOp=parseFloat(window.getComputedStyle(ctaEl).opacity)||0;
  if(ctaOp>.01){
    c.save();c.globalAlpha=ctaOp*.6;
    c.font=`600 ${Math.max(9,cW*.022)}px 'Noto Sans Arabic',sans-serif`;
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle=th.dark?'rgba(200,220,200,.6)':'rgba(40,60,40,.6)';
    c.fillText(document.getElementById('ctaTxt').textContent,cx,cH*.91);
    c.restore();
  }
}

window.startRecording=function(fps){
  fps=fps||30;
  try{
    AC.resume().catch(()=>{});
    _compC=document.createElement('canvas');_compC.width=W;_compC.height=H;
    _compCtx=_compC.getContext('2d');
    window._recActive=true;window._recordingDone=false;_recChunks=[];
    _recDest=AC.createMediaStreamDestination();master.connect(_recDest);
    const vs=_compC.captureStream(fps);
    const combined=new MediaStream([...vs.getVideoTracks(),..._recDest.stream.getAudioTracks()]);
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    _recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:192000});
    _recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)_recChunks.push(e.data);};
    _recorder.onstop=()=>{
      window._recActive=false;
      try{master.disconnect(_recDest);}catch(e){}
      window._recordingBlob=new Blob(_recChunks,{type:'video/webm'});window._recordingDone=true;
    };
    _recorder.start(200);
  }catch(e){console.error(e);}
};
window.stopRecording=function(){try{if(_recorder&&_recorder.state!=='inactive')_recorder.stop();}catch(e){}};
window.forceFinalize=function(){
  window._recActive=false;
  if(_recChunks.length>0&&!window._recordingDone){window._recordingBlob=new Blob(_recChunks,{type:'video/webm'});window._recordingDone=true;}
};
window.getRecordingBase64=function(){
  return new Promise((resolve,reject)=>{
    const chk=()=>{
      if(!window._recordingBlob){setTimeout(chk,100);return;}
      const r=new FileReader();
      r.onloadend=()=>resolve(r.result.split(',')[1]);
      r.onerror=reject;r.readAsDataURL(window._recordingBlob);
    };chk();
  });
};

(function loop(){
  requestAnimationFrame(loop);
  _t+=.016;
  if(_theme&&_theme.draw)_theme.draw(ctx,W,H,_t);
  if(window._recActive)_drawComposite();
})();

window.addEventListener('resize',()=>{
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  THEMES.forEach(th=>{if(th.init)th.init(W,H);});
});
document.body.addEventListener('click',showScene);
document.body.addEventListener('touchend',e=>{e.preventDefault();showScene();},{passive:false});
showScene();
window.AC=AC;window.master=master;
})();
</script>
