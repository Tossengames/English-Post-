<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>لحظة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 25%,rgba(0,0,0,0.6) 100%);}

#stage{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:14vw 8vw 14vw;
}

#headline{
  font-family:'Noto Naskh Arabic',serif;
  font-weight:700;
  font-size:clamp(1.8rem,9vw,3.2rem);
  color:#fff;
  text-align:center;
  line-height:1.5;
  width:100%;
  white-space:normal;
  word-break:break-word;
  overflow-wrap:break-word;
  hyphens:auto;
  opacity:0;
  transform:translateY(30px);
  transition:opacity .7s ease,transform .8s cubic-bezier(.16,1,.3,1);
  text-shadow:0 2px 30px rgba(0,0,0,0.7);
  padding:0 2vw;
}
#headline.in{opacity:1;transform:translateY(0);}

#divider{
  width:0;height:1.5px;
  margin:5vw auto;
  background:var(--ac,rgba(255,255,255,0.4));
  box-shadow:0 0 8px 1px var(--ac,rgba(255,255,255,0.3));
  transition:width .8s cubic-bezier(.22,1,.36,1);
  flex-shrink:0;
}

#body{
  font-family:'Noto Sans Arabic',sans-serif;
  font-weight:300;
  font-size:clamp(1rem,4.8vw,1.4rem);
  color:rgba(255,255,255,0.88);
  text-align:center;
  line-height:1.9;
  width:100%;
  white-space:normal;
  word-break:break-word;
  overflow-wrap:break-word;
  hyphens:auto;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .7s ease,transform .8s cubic-bezier(.22,1,.36,1);
  text-shadow:0 1px 12px rgba(0,0,0,0.6);
  padding:0 1vw;
}
#body.in{opacity:1;transform:translateY(0);}

/* theme-specific text colours via CSS vars */
#headline{color:var(--headCol,#ffffff);}
#body{color:var(--bodyCol,rgba(255,255,255,0.85));}

#hint{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  gap:0.6em;
  padding-bottom:9vw;z-index:11;
  opacity:0;transition:opacity .6s ease;
}
#hint.in{opacity:1;}
#hintTxt{
  font-family:'Noto Sans Arabic',sans-serif;
  font-size:clamp(0.42rem,1.9vw,0.56rem);
  letter-spacing:0.18em;
  color:var(--ac,rgba(255,255,255,0.3));
  font-weight:400;
}
#hintDot{
  width:4px;height:4px;border-radius:50%;
  background:var(--ac,rgba(255,255,255,0.35));
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:.9;transform:scale(1.5);}}
@keyframes settle{0%{filter:brightness(1.5);}100%{filter:brightness(1);}}
#headline.in{animation:settle .5s ease-out;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="vig"></div>
<div id="stage">
  <div id="headline"></div>
  <div id="divider"></div>
  <div id="body"></div>
</div>
<div id="hint"><div id="hintTxt">اضغط للتالي</div><div id="hintDot"></div></div>

<script>
(function(){
'use strict';

// ══════════════════════════════════════════════
// THEMES — 10 completely distinct visual worlds
// ══════════════════════════════════════════════
const THEMES = [

  // 1. AURORA — northern lights, slow colour waves
  {
    id:'aurora',
    ac:'rgba(120,240,180,0.7)',
    headCol:'#e0fff4',
    bodyCol:'rgba(200,255,230,0.82)',
    init(w,h){ this._off=0; },
    draw(ctx,w,h,t){
      ctx.fillStyle='#020d0a';ctx.fillRect(0,0,w,h);
      const bands=[
        {y:0.2,col:[80,240,160],amp:0.08,spd:0.18,ph:0},
        {y:0.38,col:[40,180,220],amp:0.1,spd:0.13,ph:1.2},
        {y:0.55,col:[160,80,240],amp:0.07,spd:0.22,ph:2.4},
      ];
      bands.forEach(b=>{
        const cy=h*(b.y+Math.sin(t*b.spd+b.ph)*b.amp);
        const g=ctx.createRadialGradient(w/2,cy,0,w/2,cy,w*0.7);
        const a=0.18+Math.sin(t*0.2+b.ph)*0.07;
        g.addColorStop(0,`rgba(${b.col[0]},${b.col[1]},${b.col[2]},${a})`);
        g.addColorStop(0.5,`rgba(${b.col[0]},${b.col[1]},${b.col[2]},${a*0.3})`);
        g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      });
      // shimmer streaks
      for(let i=0;i<8;i++){
        const x=w*(0.1+i*0.11);
        const yoff=Math.sin(t*0.3+i*0.8)*h*0.04;
        const ht=h*(0.3+Math.sin(t*0.15+i)*0.1);
        const gr=ctx.createLinearGradient(x,h*0.1+yoff,x,h*0.1+yoff+ht);
        const a=0.06+Math.sin(t*0.4+i)*0.04;
        gr.addColorStop(0,'rgba(120,255,180,0)');
        gr.addColorStop(0.4,`rgba(120,255,180,${a})`);
        gr.addColorStop(1,'rgba(120,255,180,0)');
        ctx.fillStyle=gr;ctx.fillRect(x-1,h*0.1+yoff,2.5,ht);
      }
    }
  },

  // 2. EMBER — fire particles rising, dark warm bg
  {
    id:'ember',
    ac:'rgba(255,160,60,0.8)',
    headCol:'#fff4e0',
    bodyCol:'rgba(255,220,170,0.85)',
    _particles:[],
    init(w,h){
      this._particles=[];
      for(let i=0;i<55;i++){
        this._particles.push({
          x:Math.random()*w,
          y:h+Math.random()*h*0.3,
          vx:(Math.random()-0.5)*0.5,
          vy:-(0.5+Math.random()*1.8),
          life:Math.random(),
          size:1+Math.random()*3,
          col:Math.random()<0.5?[255,140,30]:[255,80,10],
        });
      }
    },
    draw(ctx,w,h,t){
      ctx.fillStyle='#0e0500';ctx.fillRect(0,0,w,h);
      // base glow
      const g=ctx.createRadialGradient(w/2,h,0,w/2,h,w*0.8);
      g.addColorStop(0,'rgba(180,60,0,0.35)');
      g.addColorStop(0.4,'rgba(100,30,0,0.15)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      // particles
      this._particles.forEach(p=>{
        p.x+=p.vx+Math.sin(t*0.8+p.y*0.01)*0.3;
        p.y+=p.vy;
        p.life-=0.004;
        if(p.life<=0||p.y<-10){
          p.x=Math.random()*w;p.y=h+5;
          p.life=0.7+Math.random()*0.3;
          p.vy=-(0.5+Math.random()*1.8);
          p.size=1+Math.random()*3;
        }
        const a=p.life*0.85;
        ctx.save();ctx.globalAlpha=a;
        const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.5);
        pg.addColorStop(0,`rgba(${p.col[0]},${p.col[1]},${p.col[2]},1)`);
        pg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.5,0,Math.PI*2);ctx.fill();
        ctx.restore();
      });
    }
  },

  // 3. RAIN — vertical light streaks on very dark bg
  {
    id:'rain',
    ac:'rgba(140,200,255,0.6)',
    headCol:'#e4f4ff',
    bodyCol:'rgba(180,220,255,0.82)',
    _drops:[],
    init(w,h){
      this._drops=[];
      for(let i=0;i<60;i++){
        this._drops.push({
          x:Math.random()*w,
          y:Math.random()*h,
          len:30+Math.random()*80,
          spd:4+Math.random()*8,
          a:0.04+Math.random()*0.12,
        });
      }
    },
    draw(ctx,w,h,t){
      ctx.fillStyle='rgba(4,8,16,0.35)';ctx.fillRect(0,0,w,h);
      if(t<0.1){ctx.fillStyle='#040810';ctx.fillRect(0,0,w,h);}
      this._drops.forEach(d=>{
        d.y+=d.spd;
        if(d.y>h+d.len){d.y=-d.len;d.x=Math.random()*w;}
        const gr=ctx.createLinearGradient(d.x,d.y-d.len,d.x,d.y);
        gr.addColorStop(0,'rgba(140,200,255,0)');
        gr.addColorStop(0.7,`rgba(140,200,255,${d.a})`);
        gr.addColorStop(1,`rgba(200,230,255,${d.a*1.5})`);
        ctx.strokeStyle=gr;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(d.x,d.y-d.len);ctx.lineTo(d.x,d.y);ctx.stroke();
      });
    }
  },

  // 4. COSMOS — deep space, parallax star layers, nebula
  {
    id:'cosmos',
    ac:'rgba(180,140,255,0.7)',
    headCol:'#f0eaff',
    bodyCol:'rgba(210,200,255,0.82)',
    _stars:[],
    init(w,h){
      this._stars=[];
      for(let i=0;i<180;i++){
        this._stars.push({
          x:Math.random()*w,y:Math.random()*h,
          r:0.4+Math.random()*1.4,
          spd:0.01+Math.random()*0.04,
          ph:Math.random()*Math.PI*2,
          layer:Math.floor(Math.random()*3),
        });
      }
    },
    draw(ctx,w,h,t){
      ctx.fillStyle='#020006';ctx.fillRect(0,0,w,h);
      // nebula blobs
      [[w*0.3,h*0.3,80,120,60,0.1],[w*0.7,h*0.6,120,60,140,0.08],[w*0.5,h*0.2,60,180,200,0.07]].forEach(([x,y,r,g2,b2,a])=>{
        const ng=ctx.createRadialGradient(x,y,0,x,y,w*0.45);
        ng.addColorStop(0,`rgba(${r},${g2},${b2},${a})`);
        ng.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=ng;ctx.fillRect(0,0,w,h);
      });
      // stars
      this._stars.forEach(s=>{
        const bri=0.4+Math.sin(t*1.1*s.spd*10+s.ph)*0.35;
        ctx.globalAlpha=bri;
        ctx.fillStyle=s.layer===0?'#fff':s.layer===1?'#c8d4ff':'#ffeedd';
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;
      // slow rotating central glow
      const ox=w/2+Math.sin(t*0.08)*w*0.05;
      const oy=h/2+Math.cos(t*0.06)*h*0.04;
      const cg=ctx.createRadialGradient(ox,oy,0,ox,oy,w*0.5);
      cg.addColorStop(0,'rgba(100,60,180,0.1)');
      cg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=cg;ctx.fillRect(0,0,w,h);
    }
  },

  // 5. INK — white/cream bg, ink ripple expanding
  {
    id:'ink',
    ac:'rgba(20,20,40,0.7)',
    headCol:'#0e0e1a',
    bodyCol:'rgba(30,30,60,0.78)',
    _ripples:[],
    _lastRipple:0,
    init(w,h){ this._ripples=[{x:w/2,y:h/2,r:0,born:0,max:Math.max(w,h)*0.9}]; this._lastRipple=0; },
    draw(ctx,w,h,t){
      ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,w,h);
      // ink texture blobs
      if(t-this._lastRipple>4){
        this._lastRipple=t;
        this._ripples.push({x:w*(0.3+Math.random()*0.4),y:h*(0.3+Math.random()*0.4),r:0,born:t,max:Math.max(w,h)*0.7});
        if(this._ripples.length>4)this._ripples.shift();
      }
      this._ripples.forEach(rp=>{
        rp.r=Math.min(rp.r+1.2,rp.max);
        const prog=rp.r/rp.max;
        const a=(1-prog)*0.06;
        ctx.strokeStyle=`rgba(10,8,20,${a})`;
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);ctx.stroke();
      });
      // dark ink smear centre
      const ig=ctx.createRadialGradient(w/2,h*0.48,0,w/2,h*0.48,w*0.38);
      ig.addColorStop(0,'rgba(10,8,25,0.08)');
      ig.addColorStop(1,'rgba(10,8,25,0)');
      ctx.fillStyle=ig;ctx.fillRect(0,0,w,h);
    }
  },

  // 6. NEON GRID — dark floor with perspective grid lines, neon glow
  {
    id:'neongrid',
    ac:'rgba(0,240,200,0.8)',
    headCol:'#e0fff8',
    bodyCol:'rgba(160,255,230,0.82)',
    init(w,h){},
    draw(ctx,w,h,t){
      ctx.fillStyle='#020810';ctx.fillRect(0,0,w,h);
      const horizon=h*0.55;
      const vp={x:w/2,y:horizon};
      const cols=['rgba(0,220,180,','rgba(0,160,255,'];
      // perspective grid floor
      for(let i=0;i<18;i++){
        const fi=(i+t*0.4)%18;
        const depth=fi/18;
        const y=horizon+Math.pow(depth,1.8)*(h-horizon)*1.1;
        const spread=Math.pow(depth,1.2)*w*0.7;
        const a=depth*0.22;
        ctx.strokeStyle=`rgba(0,200,160,${a})`;ctx.lineWidth=0.8;
        ctx.beginPath();ctx.moveTo(vp.x-spread,y);ctx.lineTo(vp.x+spread,y);ctx.stroke();
      }
      for(let i=-8;i<=8;i++){
        const fi=i+(t*0.4%1);
        const angle=fi/9;
        const ex=vp.x+angle*w*0.75;
        const a=0.13-Math.abs(angle)*0.1;
        if(a<0)continue;
        ctx.strokeStyle=`rgba(0,200,160,${a})`;ctx.lineWidth=0.8;
        ctx.beginPath();ctx.moveTo(vp.x,vp.y);ctx.lineTo(ex,h+20);ctx.stroke();
      }
      // horizon glow
      const hg=ctx.createLinearGradient(0,horizon-30,0,horizon+40);
      hg.addColorStop(0,'rgba(0,200,160,0)');
      hg.addColorStop(0.5,'rgba(0,200,160,0.18)');
      hg.addColorStop(1,'rgba(0,200,160,0)');
      ctx.fillStyle=hg;ctx.fillRect(0,horizon-30,w,70);
      // floating neon orbs
      [[w*0.25,h*0.2,0,240,200],[w*0.75,h*0.3,0,150,255],[w*0.5,h*0.15,100,0,255]].forEach(([ox,oy,r,g2,b2],i)=>{
        const oox=ox+Math.sin(t*0.3+i)*w*0.04;
        const ooy=oy+Math.cos(t*0.25+i)*h*0.03;
        const og=ctx.createRadialGradient(oox,ooy,0,oox,ooy,50);
        og.addColorStop(0,`rgba(${r},${g2},${b2},0.22)`);
        og.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=og;ctx.fillRect(0,0,w,h);
      });
    }
  },

  // 7. OCEAN — deep blue, caustic light shimmer
  {
    id:'ocean',
    ac:'rgba(80,200,240,0.7)',
    headCol:'#e0f8ff',
    bodyCol:'rgba(160,230,255,0.84)',
    _caustics:[],
    init(w,h){
      this._caustics=[];
      for(let i=0;i<35;i++){
        this._caustics.push({x:Math.random()*w,y:Math.random()*h,r:20+Math.random()*60,ph:Math.random()*Math.PI*2,spd:0.5+Math.random()*1.2});
      }
    },
    draw(ctx,w,h,t){
      const g=ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#020c18');g.addColorStop(0.6,'#041830');g.addColorStop(1,'#020c18');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      // caustic shimmer
      this._caustics.forEach(c=>{
        const cx=c.x+Math.sin(t*c.spd*0.3+c.ph)*w*0.03;
        const cy=c.y+Math.cos(t*c.spd*0.25+c.ph)*h*0.02;
        const cr=c.r*(0.8+Math.sin(t*c.spd+c.ph)*0.2);
        const a=0.04+Math.sin(t*c.spd*0.7+c.ph)*0.025;
        const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
        cg.addColorStop(0,`rgba(80,220,255,${a})`);
        cg.addColorStop(0.5,`rgba(40,160,220,${a*0.4})`);
        cg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=cg;ctx.fillRect(0,0,w,h);
      });
      // surface shimmer at top
      for(let i=0;i<12;i++){
        const sx=w*(i/12)+Math.sin(t*0.5+i)*w*0.04;
        const sy=h*0.08+Math.sin(t*0.7+i*0.6)*h*0.015;
        const sl=w*0.06+Math.sin(t*0.4+i)*w*0.02;
        const sa=0.07+Math.sin(t*0.8+i)*0.04;
        ctx.strokeStyle=`rgba(120,220,255,${sa})`;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+sl,sy+2);ctx.stroke();
      }
      // deep glow
      const dg=ctx.createRadialGradient(w/2,h*0.6,0,w/2,h*0.6,w*0.55);
      dg.addColorStop(0,'rgba(20,80,140,0.2)');
      dg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=dg;ctx.fillRect(0,0,w,h);
    }
  },

  // 8. PAPER — warm cream, single ink brushstroke sweeps in
  {
    id:'paper',
    ac:'rgba(60,40,20,0.5)',
    headCol:'#1a1008',
    bodyCol:'rgba(40,25,10,0.72)',
    _strokes:[],
    _lastStroke:0,
    init(w,h){
      this._strokes=[];this._lastStroke=-10;
    },
    draw(ctx,w,h,t){
      ctx.fillStyle='#f4ede0';ctx.fillRect(0,0,w,h);
      // paper grain
      ctx.save();ctx.globalAlpha=0.04;
      for(let i=0;i<300;i++){
        ctx.fillStyle=`rgba(${80+Math.random()*40},${60+Math.random()*30},${20+Math.random()*20},1)`;
        ctx.fillRect(Math.random()*w,Math.random()*h,1,1);
      }
      ctx.restore();
      // ink wash
      if(t-this._lastStroke>5){
        this._lastStroke=t;
        this._strokes.push({born:t,x:w*(0.1+Math.random()*0.8),y:h*(0.15+Math.random()*0.7),len:w*(0.3+Math.random()*0.4),angle:(Math.random()-0.5)*0.4});
        if(this._strokes.length>3)this._strokes.shift();
      }
      this._strokes.forEach(s=>{
        const age=t-s.born;
        const prog=Math.min(1,age*0.4);
        const a=prog*(0.08-age*0.005);
        if(a<=0)return;
        ctx.save();ctx.globalAlpha=a;
        ctx.strokeStyle='rgba(20,12,4,1)';
        ctx.lineWidth=8+Math.random()*4;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(s.x,s.y);
        ctx.lineTo(s.x+Math.cos(s.angle)*s.len*prog,s.y+Math.sin(s.angle)*s.len*prog);
        ctx.stroke();ctx.restore();
      });
      // warm vignette
      const vg=ctx.createRadialGradient(w/2,h/2,h*0.1,w/2,h/2,h*0.75);
      vg.addColorStop(0,'rgba(200,160,80,0)');
      vg.addColorStop(1,'rgba(120,80,20,0.1)');
      ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
    }
  },

  // 9. PRISM — dark bg, rotating light splits into colour beams
  {
    id:'prism',
    ac:'rgba(255,200,80,0.8)',
    headCol:'#fff8e8',
    bodyCol:'rgba(255,240,200,0.84)',
    init(w,h){},
    draw(ctx,w,h,t){
      ctx.fillStyle='#080608';ctx.fillRect(0,0,w,h);
      const cx=w/2,cy=h*0.38;
      const beams=[
        {angle:t*0.08+0,col:[255,60,80],len:h*0.7},
        {angle:t*0.08+0.4,col:[255,160,0],len:h*0.65},
        {angle:t*0.08+0.75,col:[220,255,60],len:h*0.75},
        {angle:t*0.08+1.1,col:[60,220,255],len:h*0.68},
        {angle:t*0.08+1.5,col:[100,80,255],len:h*0.72},
        {angle:t*0.08+1.9,col:[255,60,200],len:h*0.66},
      ];
      beams.forEach(b=>{
        const ex=cx+Math.cos(b.angle)*b.len;
        const ey=cy+Math.sin(b.angle)*b.len;
        const bg=ctx.createLinearGradient(cx,cy,ex,ey);
        bg.addColorStop(0,`rgba(${b.col[0]},${b.col[1]},${b.col[2]},0.18)`);
        bg.addColorStop(0.4,`rgba(${b.col[0]},${b.col[1]},${b.col[2]},0.08)`);
        bg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.save();
        ctx.beginPath();
        const w1=Math.cos(b.angle+Math.PI/2)*12;
        const w2=Math.sin(b.angle+Math.PI/2)*12;
        ctx.moveTo(cx-w1,cy-w2);ctx.lineTo(cx+w1,cy+w2);
        ctx.lineTo(ex+w1*3,ey+w2*3);ctx.lineTo(ex-w1*3,ey-w2*3);
        ctx.closePath();ctx.fillStyle=bg;ctx.fill();
        ctx.restore();
      });
      // central white source
      const src=ctx.createRadialGradient(cx,cy,0,cx,cy,w*0.12);
      src.addColorStop(0,'rgba(255,255,255,0.9)');
      src.addColorStop(0.3,'rgba(255,255,200,0.3)');
      src.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=src;ctx.fillRect(0,0,w,h);
    }
  },

  // 10. HAZE — warm moody fog, slow depth layers drifting
  {
    id:'haze',
    ac:'rgba(220,160,80,0.6)',
    headCol:'#fff0d8',
    bodyCol:'rgba(255,225,170,0.82)',
    _layers:[],
    init(w,h){
      this._layers=[];
      for(let i=0;i<6;i++){
        this._layers.push({x:Math.random()*w,y:h*(0.15+i*0.13),w:w*(0.6+Math.random()*0.8),h:h*(0.12+Math.random()*0.1),spd:(Math.random()-0.5)*0.3,a:0.04+Math.random()*0.07,col:i%2===0?[180,100,30]:[220,140,50]});
      }
    },
    draw(ctx,w,h,t){
      const g=ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#120800');g.addColorStop(0.5,'#1e0e00');g.addColorStop(1,'#0e0600');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      // fog layers
      this._layers.forEach(l=>{
        l.x+=l.spd;
        if(l.x>w+l.w/2)l.x=-l.w/2;
        if(l.x<-l.w/2)l.x=w+l.w/2;
        const a=l.a*(0.7+Math.sin(t*0.2+l.y)*0.3);
        const lg=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.w/1.5);
        lg.addColorStop(0,`rgba(${l.col[0]},${l.col[1]},${l.col[2]},${a})`);
        lg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=lg;ctx.fillRect(0,0,w,h);
      });
      // warm central glow
      const cg=ctx.createRadialGradient(w/2,h*0.45,0,w/2,h*0.45,w*0.5);
      cg.addColorStop(0,'rgba(200,100,20,0.12)');
      cg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=cg;ctx.fillRect(0,0,w,h);
    }
  },
];

    b:'فأنت تبحث عن شيء. ربما إجابة، ربما تأكيد أنك لست وحدك. أياً كان، وجود هذا البحث في داخلك دليل على أنك لم تتوقف عن الاهتمام. وهذا يكفي.',
  },
];

// ══════════════════════════════════════
// CANVAS SETUP
// ══════════════════════════════════════
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
canvas.width=W;canvas.height=H;

let _t=0,_themeIdx=-1,_theme=THEMES[0];

// init all themes
THEMES.forEach(th=>{ if(th.init)th.init(W,H); });

// ══════════════════════════════════════
// POOL
// ══════════════════════════════════════
let _deck=[...CARDS].sort(()=>Math.random()-0.5);
let _deckIdx=0;
function nextCard(){
  if(_deckIdx>=_deck.length){_deck=[...CARDS].sort(()=>Math.random()-0.5);_deckIdx=0;}
  return _deck[_deckIdx++];
}
function nextTheme(){
  _themeIdx=(_themeIdx+1)%THEMES.length;
  _theme=THEMES[_themeIdx];
  if(_theme.init)_theme.init(W,H);
}

function applyCSSVars(th){
  const r=document.documentElement.style;
  r.setProperty('--ac',th.ac);
  r.setProperty('--headCol',th.headCol);
  r.setProperty('--bodyCol',th.bodyCol);
}

// ══════════════════════════════════════
// AUDIO
// ══════════════════════════════════════
const AC=new (window.AudioContext||window.webkitAudioContext)();
const master=AC.createGain();master.gain.value=0.65;master.connect(AC.destination);
let _recDest=null,_audioOn=false,_pads=[];
function unlockAC(){if(_audioOn)return;AC.resume().then(()=>{_audioOn=true;startPad();});}
function startPad(){
  stopPad();
  try{[220,277.18,329.63,369.99].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
    o.type='sine';o.frequency.value=f;lfo.type='sine';lfo.frequency.value=0.05+i*0.012;lg.gain.value=0.7;
    lfo.connect(lg);lg.connect(o.frequency);
    const tt=AC.currentTime;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(0.016-i*0.002,tt+3);
    o.connect(g);g.connect(master);o.start(tt);lfo.start(tt);_pads.push({o,g,lfo});
  });}catch(e){}
}
function stopPad(){_pads.forEach(p=>{try{p.g.gain.setTargetAtTime(0,AC.currentTime,0.5);setTimeout(()=>{try{p.o.stop();p.lfo.stop();}catch(e){}},1200);}catch(e){}});_pads=[];}
function sfxIn(){if(!_audioOn)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.exponentialRampToValueAtTime(180,AC.currentTime+0.35);g.gain.setValueAtTime(0.025,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.6);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.6);}catch(e){}}
function sfxBody(){if(!_audioOn)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(240,AC.currentTime);o.frequency.exponentialRampToValueAtTime(160,AC.currentTime+0.4);g.gain.setValueAtTime(0.018,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.65);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.65);}catch(e){}}

// ══════════════════════════════════════
// SCENE
// ══════════════════════════════════════
let _timers=[];
function clearT(){_timers.forEach(clearTimeout);_timers=[];}

function showScene(){
  clearT();unlockAC();
  nextTheme();
  applyCSSVars(_theme);
  const C=nextCard();

  const hl=document.getElementById('headline');
  const bd=document.getElementById('body');
  const dv=document.getElementById('divider');
  const hint=document.getElementById('hint');

  hl.classList.remove('in');bd.classList.remove('in');hint.classList.remove('in');
  dv.style.width='0';
  hl.textContent=C.h;
  bd.textContent=C.b;

  // headline first
  _timers.push(setTimeout(()=>{hl.classList.add('in');sfxIn();},280));
  // divider after headline settles
  _timers.push(setTimeout(()=>{dv.style.width=Math.min(W*0.32,110)+'px';},1100));
  // body text — user waits to read rest
  _timers.push(setTimeout(()=>{bd.classList.add('in');sfxBody();},1800));
  // tap hint last
  _timers.push(setTimeout(()=>{hint.classList.add('in');},2800));
}

// ══════════════════════════════════════
// RECORDING
// ══════════════════════════════════════
let _compC=null,_compCtx=null;
window._recActive=false;window._recordingDone=false;window._recordingBlob=null;
let _recChunks=[],_recorder=null;

function drawOT(c,txt,x,y,fill,stroke,sw){
  c.lineJoin='round';c.miterLimit=2;c.lineWidth=sw;
  c.strokeStyle=stroke;c.strokeText(txt,x,y);
  c.fillStyle=fill;c.fillText(txt,x,y);
}
function wrapText(c,text,maxWidth){
  const words=text.split(' ');const lines=[];let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(c.measureText(test).width>maxWidth&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}

function _drawComposite(){
  if(!_compCtx)return;
  const c=_compCtx,cW=_compC.width,cH=_compC.height;
  c.clearRect(0,0,cW,cH);
  c.drawImage(canvas,0,0,cW,cH);
  const vg=c.createRadialGradient(cW/2,cH/2,cH*0.1,cW/2,cH/2,cH*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  c.fillStyle=vg;c.fillRect(0,0,cW,cH);

  const th=_theme;
  const maxW=cW*0.84;
  const cx=cW/2;
  c.direction='rtl';

  const hlEl=document.getElementById('headline');
  const hlOp=parseFloat(window.getComputedStyle(hlEl).opacity)||0;
  if(hlOp>0.01){
    const fs=parseFloat(window.getComputedStyle(hlEl).fontSize)||32;
    c.save();c.globalAlpha=hlOp;
    c.font=`700 ${fs}px 'Noto Naskh Arabic',serif`;
    c.textAlign='center';c.textBaseline='middle';
    const lines=wrapText(c,hlEl.textContent,maxW);
    const lh=fs*1.55;
    lines.forEach((ln,i)=>{
      const y=cH*0.35+(i-(lines.length-1)/2)*lh;
      c.shadowColor='rgba(0,0,0,0.6)';c.shadowBlur=20;
      drawOT(c,ln,cx,y,th.headCol,'rgba(0,0,0,0.55)',Math.max(1.5,fs*0.07));
    });
    c.restore();
  }

  const dvEl=document.getElementById('divider');
  const dvW=parseFloat(dvEl.style.width)||0;
  if(dvW>2){
    c.save();
    const lg=c.createLinearGradient(cx-dvW/2,0,cx+dvW/2,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(0.5,th.ac);lg.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=lg;c.fillRect(cx-dvW/2,cH*0.53,dvW,1.5);
    c.restore();
  }

  const bdEl=document.getElementById('body');
  const bdOp=parseFloat(window.getComputedStyle(bdEl).opacity)||0;
  if(bdOp>0.01){
    const fs=parseFloat(window.getComputedStyle(bdEl).fontSize)||18;
    c.save();c.globalAlpha=bdOp;
    c.font=`300 ${fs}px 'Noto Sans Arabic',sans-serif`;
    c.textAlign='center';c.textBaseline='middle';
    const lines=wrapText(c,bdEl.textContent,maxW);
    const lh=fs*1.95;
    const totalH=lines.length*lh;
    const startY=cH*0.6-totalH/2+lh/2;
    lines.forEach((ln,i)=>{
      c.shadowColor='rgba(0,0,0,0.5)';c.shadowBlur=10;
      drawOT(c,ln,cx,startY+i*lh,th.bodyCol,'rgba(0,0,0,0.4)',Math.max(1,fs*0.055));
    });
    c.restore();
  }

  const hintEl=document.getElementById('hint');
  const hintOp=parseFloat(window.getComputedStyle(hintEl).opacity)||0;
  if(hintOp>0.01){
    c.save();c.globalAlpha=hintOp*0.5;
    c.font=`400 ${Math.max(9,cW*0.02)}px 'Noto Sans Arabic',sans-serif`;
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle=th.bodyCol;
    c.fillText('اضغط للتالي',cx,cH*0.91);
    c.restore();
  }
}

window.startRecording=function(fps){
  fps=fps||30;
  try{
    AC.resume().catch(()=>{});
    _compC=document.createElement('canvas');_compC.width=W;_compC.height=H;
    _compCtx=_compC.getContext('2d');
    window._recActive=true;window._recordingDone=false;_recChunks=[];
    _recDest=AC.createMediaStreamDestination();master.connect(_recDest);
    const vs=_compC.captureStream(fps);
    const combined=new MediaStream([...vs.getVideoTracks(),..._recDest.stream.getAudioTracks()]);
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    _recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:192000});
    _recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)_recChunks.push(e.data);};
    _recorder.onstop=()=>{
      window._recActive=false;
      try{master.disconnect(_recDest);}catch(e){}
      window._recordingBlob=new Blob(_recChunks,{type:'video/webm'});
      window._recordingDone=true;
    };
    _recorder.start(200);
  }catch(e){console.error(e);}
};
window.stopRecording=function(){try{if(_recorder&&_recorder.state!=='inactive')_recorder.stop();}catch(e){}};
window.forceFinalize=function(){
  window._recActive=false;
  if(_recChunks.length>0&&!window._recordingDone){
    window._recordingBlob=new Blob(_recChunks,{type:'video/webm'});window._recordingDone=true;
  }
};
window.getRecordingBase64=function(){
  return new Promise((resolve,reject)=>{
    const chk=()=>{
      if(!window._recordingBlob){setTimeout(chk,100);return;}
      const r=new FileReader();
      r.onloadend=()=>resolve(r.result.split(',')[1]);
      r.onerror=reject;r.readAsDataURL(window._recordingBlob);
    };chk();
  });
};

(function loop(){
  requestAnimationFrame(loop);
  _t+=0.016;
  if(_theme&&_theme.draw)_theme.draw(ctx,W,H,_t);
  if(window._recActive)_drawComposite();
})();

window.addEventListener('resize',()=>{
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  THEMES.forEach(th=>{if(th.init)th.init(W,H);});
});
document.body.addEventListener('click',showScene);
document.body.addEventListener('touchend',e=>{e.preventDefault();showScene();},{passive:false});
applyCSSVars(THEMES[0]);
showScene();
window.AC=AC;window.master=master;
})();
</script>
</body>
</html>
