<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>لحظة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
canvas{position:fixed;inset:0;width:100%;height:100%;}
#main{position:fixed;inset:0;z-index:1;}
</style>
</head>
<body>
<canvas id="main"></canvas>
<script>
(function(){
'use strict';

const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

// ── font loader ──
const FONT_URL = 'https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;700&display=swap';
const link = document.createElement('link');
link.rel = 'stylesheet'; link.href = FONT_URL;
document.head.appendChild(link);

// ══════════════════════════════════════
// THEMES — 10 distinct, 5 dark 5 bright
// ══════════════════════════════════════
const THEMES = [
  // 1. AURORA — dark, green/purple waves
  {
    id:'aurora', dark:true,
    ac:[120,255,180], headCol:'#e0fff4', bodyCol:'rgba(200,255,230,0.88)',
    init(w,h){},
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#020d0a'; ctx.fillRect(0,0,w,h);
      [[w*.5,h*.22,[80,240,160],.18,.18,0],[w*.4,h*.45,[40,180,220],.1,.13,1.2],[w*.6,h*.6,[160,80,240],.07,.22,2.4]].forEach(([ox,oy,col,amp,spd,ph])=>{
        const cy=oy+Math.sin(t*spd+ph)*h*amp;
        const g=ctx.createRadialGradient(ox,cy,0,ox,cy,w*.72);
        const a=.18+Math.sin(t*.2+ph)*.07;
        g.addColorStop(0,`rgba(${col},${ a})`);g.addColorStop(.5,`rgba(${col},${a*.3})`);g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      });
      for(let i=0;i<9;i++){
        const x=w*(.08+i*.1)+Math.sin(t*.2+i)*w*.02;
        const yoff=Math.sin(t*.3+i*.8)*h*.04;
        const ht=h*(.28+Math.sin(t*.15+i)*.08);
        const a=.055+Math.sin(t*.4+i)*.03;
        const gr=ctx.createLinearGradient(x,h*.08+yoff,x,h*.08+yoff+ht);
        gr.addColorStop(0,'rgba(120,255,180,0)');gr.addColorStop(.4,`rgba(120,255,180,${a})`);gr.addColorStop(1,'rgba(120,255,180,0)');
        ctx.fillStyle=gr;ctx.fillRect(x-1.2,h*.08+yoff,2.5,ht);
      }
    }
  },
  // 2. EMBER — dark, fire particles
  {
    id:'ember', dark:true,
    ac:[255,160,60], headCol:'#fff4e0', bodyCol:'rgba(255,220,170,0.88)',
    _p:[],
    init(w,h){
      this._p=[];
      for(let i=0;i<65;i++) this._p.push({x:Math.random()*w,y:h+Math.random()*h*.3,vx:(Math.random()-.5)*.5,vy:-(0.6+Math.random()*2),life:Math.random(),size:1+Math.random()*3.5,warm:Math.random()<.55});
    },
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#0e0500';ctx.fillRect(0,0,w,h);
      const bg=ctx.createRadialGradient(w/2,h,0,w/2,h,w*.85);
      bg.addColorStop(0,'rgba(180,55,0,.38)');bg.addColorStop(.4,'rgba(100,25,0,.14)');bg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
      this._p.forEach(p=>{
        p.x+=p.vx+Math.sin(t*.8+p.y*.01)*.35;p.y+=p.vy;p.life-=.0045;
        if(p.life<=0||p.y<-10){p.x=Math.random()*w;p.y=h+5;p.life=.6+Math.random()*.4;p.vy=-(0.6+Math.random()*2);p.size=1+Math.random()*3.5;}
        const col=p.warm?`255,${90+Math.floor(p.life*60)},20`:`255,60,10`;
        const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.8);
        pg.addColorStop(0,`rgba(${col},${p.life*.9})`);pg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.save();ctx.globalAlpha=p.life*.8;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2.8,0,Math.PI*2);ctx.fill();ctx.restore();
      });
    }
  },
  // 3. COSMOS — dark, stars + nebula
  {
    id:'cosmos', dark:true,
    ac:[180,140,255], headCol:'#f0eaff', bodyCol:'rgba(210,200,255,0.85)',
    _s:[],
    init(w,h){
      this._s=[];
      for(let i=0;i<200;i++) this._s.push({x:Math.random()*w,y:Math.random()*h,r:.3+Math.random()*1.5,ph:Math.random()*Math.PI*2,spd:.4+Math.random()*.8,col:i%3===0?'255,240,220':i%3===1?'200,210,255':'255,255,255'});
    },
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#020006';ctx.fillRect(0,0,w,h);
      [[w*.3,h*.3,80,120,60,.09],[w*.7,h*.55,120,60,140,.07],[w*.5,h*.75,40,160,200,.06]].forEach(([x,y,r,g2,b,a])=>{
        const ng=ctx.createRadialGradient(x,y,0,x,y,w*.5);
        ng.addColorStop(0,`rgba(${r},${g2},${b},${a})`);ng.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=ng;ctx.fillRect(0,0,w,h);
      });
      this._s.forEach(s=>{
        const br=.35+Math.sin(t*s.spd+s.ph)*.3;
        ctx.globalAlpha=br;ctx.fillStyle=`rgba(${s.col},1)`;
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;
    }
  },
  // 4. NEON GRID — dark, perspective grid
  {
    id:'neongrid', dark:true,
    ac:[0,240,200], headCol:'#e0fff8', bodyCol:'rgba(160,255,230,0.85)',
    init(w,h){},
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#020810';ctx.fillRect(0,0,w,h);
      const hz=h*.52;
      for(let i=0;i<20;i++){
        const fi=(i+t*.5)%20;const dep=fi/20;
        const y=hz+Math.pow(dep,1.7)*(h-hz)*1.1;
        const sp=Math.pow(dep,1.1)*w*.75;
        const a=dep*.24;
        ctx.strokeStyle=`rgba(0,200,160,${a})`;ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(w/2-sp,y);ctx.lineTo(w/2+sp,y);ctx.stroke();
      }
      for(let i=-9;i<=9;i++){
        const ang=i/10;const ex=w/2+ang*w*.8;const a=.14-Math.abs(ang)*.1;
        if(a<.01)continue;
        ctx.strokeStyle=`rgba(0,200,160,${a})`;ctx.lineWidth=.9;
        ctx.beginPath();ctx.moveTo(w/2,hz);ctx.lineTo(ex,h+20);ctx.stroke();
      }
      const hg=ctx.createLinearGradient(0,hz-25,0,hz+35);
      hg.addColorStop(0,'rgba(0,220,170,0)');hg.addColorStop(.5,'rgba(0,220,170,.2)');hg.addColorStop(1,'rgba(0,220,170,0)');
      ctx.fillStyle=hg;ctx.fillRect(0,hz-25,w,60);
      [[w*.22,h*.2,0,240,200],[w*.78,h*.28,0,150,255],[w*.5,h*.12,120,0,255]].forEach(([ox,oy,r,g2,b],i)=>{
        const oox=ox+Math.sin(t*.3+i)*w*.04,ooy=oy+Math.cos(t*.25+i)*h*.03;
        const og=ctx.createRadialGradient(oox,ooy,0,oox,ooy,55);
        og.addColorStop(0,`rgba(${r},${g2},${b},.24)`);og.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=og;ctx.fillRect(0,0,w,h);
      });
    }
  },
  // 5. PRISM — dark, rotating colour beams
  {
    id:'prism', dark:true,
    ac:[255,200,80], headCol:'#fff8e8', bodyCol:'rgba(255,240,200,0.86)',
    init(w,h){},
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#060408';ctx.fillRect(0,0,w,h);
      const cx=w/2,cy=h*.35;
      [[t*.07+0,[255,50,80]],[t*.07+.42,[255,160,0]],[t*.07+.8,[180,255,60]],[t*.07+1.18,[50,200,255]],[t*.07+1.6,[120,60,255]],[t*.07+2.0,[255,50,200]]].forEach(([ang,[r,g2,b]])=>{
        const ex=cx+Math.cos(ang)*h*.75,ey=cy+Math.sin(ang)*h*.75;
        const bg=ctx.createLinearGradient(cx,cy,ex,ey);
        bg.addColorStop(0,`rgba(${r},${g2},${b},.22)`);bg.addColorStop(.35,`rgba(${r},${g2},${b},.08)`);bg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.save();ctx.beginPath();
        const w1=Math.cos(ang+Math.PI/2)*14,w2=Math.sin(ang+Math.PI/2)*14;
        ctx.moveTo(cx-w1,cy-w2);ctx.lineTo(cx+w1,cy+w2);ctx.lineTo(ex+w1*3.5,ey+w2*3.5);ctx.lineTo(ex-w1*3.5,ey-w2*3.5);
        ctx.closePath();ctx.fillStyle=bg;ctx.fill();ctx.restore();
      });
      const src=ctx.createRadialGradient(cx,cy,0,cx,cy,w*.14);
      src.addColorStop(0,'rgba(255,255,255,.95)');src.addColorStop(.3,'rgba(255,255,220,.3)');src.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=src;ctx.fillRect(0,0,w,h);
    }
  },
  // 6. SAGE — bright, soft green
  {
    id:'sage', dark:false,
    ac:[60,110,80], headCol:'#0e2018', bodyCol:'rgba(20,60,35,0.75)',
    _blobs:[],
    init(w,h){
      this._blobs=[];
      for(let i=0;i<5;i++) this._blobs.push({x:Math.random()*w,y:Math.random()*h,r:w*(.3+Math.random()*.3),spd:.04+Math.random()*.06,ph:Math.random()*Math.PI*2,col:i%2===0?[80,150,100]:[60,120,80]});
    },
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#eef4ee';ctx.fillRect(0,0,w,h);
      this._blobs.forEach(b=>{
        const ox=b.x+Math.sin(t*b.spd+b.ph)*w*.06,oy=b.y+Math.cos(t*b.spd*.8+b.ph)*h*.04;
        const a=.06+Math.sin(t*b.spd+b.ph)*.025;
        const g=ctx.createRadialGradient(ox,oy,0,ox,oy,b.r);
        g.addColorStop(0,`rgba(${b.col},${a})`);g.addColorStop(1,'rgba(220,235,220,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      });
    }
  },
  // 7. BLUSH — bright, rose/pink
  {
    id:'blush', dark:false,
    ac:[180,60,80], headCol:'#1e0808', bodyCol:'rgba(50,15,15,0.72)',
    init(w,h){},
    drawBg(ctx,w,h,t){
      const g=ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,'#fdf0f0');g.addColorStop(.5,'#f8e8e8');g.addColorStop(1,'#fce8f0');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      [[w*.2,h*.2,200,120,130,.08],[w*.8,h*.35,220,100,140,.06],[w*.5,h*.7,180,80,100,.07]].forEach(([x,y,r,g2,b,a],i)=>{
        const ox=x+Math.sin(t*.12+i)*w*.04,oy=y+Math.cos(t*.1+i)*h*.03;
        const rg=ctx.createRadialGradient(ox,oy,0,ox,oy,w*.38);
        rg.addColorStop(0,`rgba(${r},${g2},${b},${a})`);rg.addColorStop(1,'rgba(250,235,235,0)');
        ctx.fillStyle=rg;ctx.fillRect(0,0,w,h);
      });
    }
  },
  // 8. SLATE — bright, cool blue-grey
  {
    id:'slate', dark:false,
    ac:[50,70,140], headCol:'#080e24', bodyCol:'rgba(20,30,80,0.68)',
    init(w,h){},
    drawBg(ctx,w,h,t){
      ctx.fillStyle='#eceef4';ctx.fillRect(0,0,w,h);
      [[w*.5,h*.3,80,100,180,.08],[w*.2,h*.6,60,80,160,.06],[w*.8,h*.5,100,120,200,.07]].forEach(([x,y,r,g2,b,a],i)=>{
        const ox=x+Math.sin(t*.1+i*.8)*w*.05,oy=y+Math.cos(t*.08+i)*h*.04;
        const rg=ctx.createRadialGradient(ox,oy,0,ox,oy,w*.45);
        rg.addColorStop(0,`rgba(${r},${g2},${b},${a})`);rg.addColorStop(1,'rgba(230,232,242,0)');
        ctx.fillStyle=rg;ctx.fillRect(0,0,w,h);
      });
    }
  },
  // 9. AMBER — bright warm, gold dust
  {
    id:'amber', dark:false,
    ac:[160,100,10], headCol:'#1a0e00', bodyCol:'rgba(60,35,5,0.74)',
    _dust:[],
    init(w,h){
      this._dust=[];
      for(let i=0;i<30;i++) this._dust.push({x:Math.random()*w,y:Math.random()*h,r:.8+Math.random()*2,spd:.015+Math.random()*.03,ph:Math.random()*Math.PI*2,a:.04+Math.random()*.08});
    },
    drawBg(ctx,w,h,t){
      const g=ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#fdf4e0');g.addColorStop(.6,'#faecd0');g.addColorStop(1,'#f5e4c0');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      this._dust.forEach(d=>{
        const ox=d.x+Math.sin(t*d.spd+d.ph)*w*.08,oy=d.y+Math.cos(t*d.spd*.7+d.ph)*h*.06;
        const a=d.a*(0.6+Math.sin(t*d.spd*2+d.ph)*.4);
        ctx.globalAlpha=a;ctx.fillStyle='rgba(180,120,30,1)';
        ctx.beginPath();ctx.arc(ox,oy,d.r,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=1;
    }
  },
  // 10. HAZE — dark warm, fog layers
  {
    id:'haze', dark:true,
    ac:[220,160,80], headCol:'#fff0d8', bodyCol:'rgba(255,225,170,0.84)',
    _layers:[],
    init(w,h){
      this._layers=[];
      for(let i=0;i<7;i++) this._layers.push({x:Math.random()*w,y:h*(.1+i*.12),rw:w*(.5+Math.random()*.6),spd:(Math.random()-.5)*.25,ph:Math.random()*Math.PI*2,a:.035+Math.random()*.055,col:i%2===0?[180,90,20]:[220,130,40]});
    },
    drawBg(ctx,w,h,t){
      const g=ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,'#100600');g.addColorStop(.5,'#1a0c00');g.addColorStop(1,'#0e0500');
      ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      this._layers.forEach(l=>{
        l.x+=l.spd;
        if(l.x>w+l.rw/2)l.x=-l.rw/2;
        if(l.x<-l.rw/2)l.x=w+l.rw/2;
        const a=l.a*(0.65+Math.sin(t*.18+l.ph)*.35);
        const lg=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.rw/1.4);
        lg.addColorStop(0,`rgba(${l.col},${a})`);lg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=lg;ctx.fillRect(0,0,w,h);
      });
    }
  },
];

THEMES.forEach(th=>{ if(th.init) th.init(W,H); });

// ══════════════════════════════════════
// CONTENT
// ══════════════════════════════════════
const PILLARS={psych:'علم النفس',comfort:'كل شيء بخير',motivation:'تحفيز',bias:'تحيّزات',relations:'علاقات وتعامل'};

const CARDS=[
  {p:'psych',h:'عقلك يُفضّل الكذبة المريحة',b:'الدماغ يُعالج المعلومة التي تتوافق مع معتقداتك أسرع بكثير. لهذا الحجة القوية لا تُقنع دائماً — يجب أن تجعل الشخص يشعر أولاً بالأمان قبل أن تُقدّم المعلومة.'},
  {p:'psych',h:'الذاكرة ليست تسجيلاً',b:'في كل مرة تتذكر شيئاً، عقلك يُعيد بناءه من جديد ويُغيّره قليلاً. الذكريات التي تؤلمك قد تكون مختلفة كثيراً عمّا حدث فعلاً.'},
  {p:'psych',h:'التعب الذهني حقيقي جسدياً',b:'دراسات بالرنين المغناطيسي أثبتت أن الإرهاق العاطفي يُنتج نفس المواد الكيميائية كالجهد البدني. حين تقول "تعبت من التفكير" فأنت لا تبالغ.'},
  {p:'psych',h:'القرار الأول غالباً هو الأفضل',b:'زيادة الخيارات لا تجعلنا أكثر سعادة بل أكثر شكاً. الشعور بأنك اخترت غلط يكبر مع كثرة الخيارات. الباحثون يُسمّون هذا "مفارقة الاختيار".'},
  {p:'psych',h:'النوم يحذف المشاعر السلبية',b:'الجزء المرتبط بالخوف في الدماغ يهدأ تحديداً أثناء النوم العميق. ليالٍ قليلة النوم تجعل الدماغ أكثر استجابة للمؤثرات السلبية بنسبة أربعين بالمئة.'},
  {p:'psych',h:'التعاطف مع نفسك يُسرّع التعلّم',b:'دراسة من جامعة تكساس: الأشخاص الذين يُعاملون أنفسهم برفق بعد الأخطاء يتعلمون أسرع ويُكررون الأخطاء أقل. العقاب الداخلي لا يُحسّن النتائج.'},
  {p:'psych',h:'سمّ ما تشعر به بكلمة واحدة',b:'حين تقول "أنا أشعر بالخوف" بدل "أنا خائف"، تُنشّط الجزء المنطقي من دماغك وتُهدئ الجزء العاطفي. الفرق كلمتان فقط — لكن الأثر في الدماغ واضح.'},
  {p:'psych',h:'المماطلة ليست كسلاً',b:'المماطلة في الغالب تجنّب مشاعر غير مريحة مرتبطة بالمهمة: خوف الفشل، الملل، الشك. السؤال الصحيح ليس "لماذا أنا كسول؟" بل "ما الشعور الذي أتجنبه؟"'},
  {p:'psych',h:'الموسيقى الحزينة تُريحك',b:'الموسيقى الحزينة تُطلق البرولاكتين وهو هرمون يُقلل الألم النفسي. أحياناً الأغنية التي تُبكيك هي ما يُهدّئك. ليس تناقضاً، هو كيمياء الدماغ.'},
  {p:'psych',h:'المشي يُغيّر طريقة تفكيرك',b:'دراسة من ستانفورد: المشي يُحسّن الإبداع بنسبة ثمانين بالمئة. الدماغ في وضع المشي يُنتج روابط جديدة لا تظهر وأنت جالس. ليست استعارة، نتيجة مقاسة.'},
  {p:'psych',h:'الغضب يحتاج ثلاثين دقيقة',b:'الأدرينالين والكورتيزول يحتاجان ثلاثين دقيقة ليغادرا مجرى الدم. أي قرار تتخذه في هذه الفترة سيتأثر بالجسم لا بالعقل. الانتظار ليس ضعفاً.'},
  {p:'psych',h:'تقنية ٤ ٧ ٨ للقلق',b:'استنشق أربع ثوانٍ، احتجز سبع ثوانٍ، ازفر ثماني ثوانٍ. ثلاث جولات فقط تُنشّط العصب المبهم وتُوقف استجابة الإجهاد خلال أقل من دقيقتين.'},
  {p:'psych',h:'الصوت الداخلي الناقد',b:'حين يقول لك صوتك الداخلي "أنت فاشل"، جرّب: "يقول عقلي أنني فاشل". هذا الفصل الصغير بينك وبين الفكرة يُقلل تأثيرها بشكل ملحوظ.'},
  {p:'psych',h:'الناس لا يتذكرون ما قلته',b:'يتذكرون كيف جعلتهم يشعرون. المشاعر تُحفر في الذاكرة والكلمات الدقيقة تختفي. هذا ليس قولاً مأثوراً بل نتيجة أبحاث الذاكرة العاطفية.'},

  {p:'psych',h:'الانتظار يُضخّم المتعة',b:'توقع الشيء الجيد يُنتج دوبامين. التخطيط لشيء ممتع يُحسّن المزاج قبل حدوثه بكثير. لهذا الإجازة تبدأ لحظة تحجزها لا لحظة تُسافر.'},

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let _t = 0;
let _themeIdx = -1;
let _theme = THEMES[0];
let _deck = [...CARDS].sort(()=>Math.random()-.5);
let _deckIdx = 0;
let _card = null;

// animation state
let _pillarAlpha = 0;
let _headAlpha = 0;
let _dividerW = 0;
let _bodyAlpha = 0;
let _ctaAlpha = 0;
let _phase = 'idle'; // idle | animating
let _phaseT = 0;

function nextCard(){
  if(_deckIdx >= _deck.length){ _deck = [...CARDS].sort(()=>Math.random()-.5); _deckIdx = 0; }
  return _deck[_deckIdx++];
}
function nextTheme(){
  _themeIdx = (_themeIdx+1) % THEMES.length;
  _theme = THEMES[_themeIdx];
  if(_theme.init) _theme.init(W,H);
}

const CTAS = ['أعجبك؟ اضغط ❤️','شاركها مع من يحتاجها','تابعنا لتصلك كل يوم','شاركها مع شخص تحبه 🤍'];
let _cta = CTAS[0];

// ── text wrap ──
function wrapText(ctx, text, maxW){
  const words = text.split(' ');
  const lines = []; let line = '';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines;
}

// ── draw outlined text ──
function drawOT(ctx, txt, x, y, fill, strokeCol, sw){
  ctx.lineJoin='round'; ctx.miterLimit=2; ctx.lineWidth=sw;
  ctx.strokeStyle=strokeCol; ctx.strokeText(txt,x,y);
  ctx.fillStyle=fill; ctx.fillText(txt,x,y);
}

// ══════════════════════════════════════
// MAIN DRAW — everything on canvas
// ══════════════════════════════════════
function draw(){
  if(!_card) return;
  const th = _theme;
  const cx = W/2;
  const maxW = W * 0.84;

  // background
  th.drawBg(ctx, W, H, _t);

  // vignette
  const vg = ctx.createRadialGradient(cx,H/2,H*.06,cx,H/2,H*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1, th.dark ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.12)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.direction = 'rtl';
  ctx.textAlign = 'center';

  // PILLAR LABEL
  if(_pillarAlpha > 0){
    ctx.globalAlpha = _pillarAlpha;
    const pSize = Math.max(11, W*0.028);
    ctx.font = `700 ${pSize}px 'Noto Sans Arabic',sans-serif`;
    ctx.textBaseline = 'middle';
    const [r2,g2,b2] = th.ac;
    ctx.fillStyle = `rgba(${r2},${g2},${b2},0.9)`;
    ctx.letterSpacing = '0.2em';
    ctx.fillText(PILLARS[_card.p], cx, H*0.1);
    // small line under pillar
    ctx.strokeStyle = `rgba(${r2},${g2},${b2},0.4)`;
    ctx.lineWidth = 1;
    const pw = ctx.measureText(PILLARS[_card.p]).width;
    ctx.beginPath(); ctx.moveTo(cx-pw/2, H*0.115); ctx.lineTo(cx+pw/2, H*0.115); ctx.stroke();
  }

  // HEADLINE
  if(_headAlpha > 0){
    ctx.globalAlpha = _headAlpha;
    const hSize = Math.max(24, Math.min(W*0.092, 52));
    ctx.font = `700 ${hSize}px 'Noto Naskh Arabic',serif`;
    ctx.textBaseline = 'middle';
    const lines = wrapText(ctx, _card.h, maxW);
    const lh = hSize * 1.5;
    const totalH = lines.length * lh;
    const startY = H*0.35 - totalH/2 + lh/2;
    lines.forEach((ln,i)=>{
      ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=18;
      drawOT(ctx, ln, cx, startY+i*lh, th.headCol, 'rgba(0,0,0,0.5)', Math.max(1.5, hSize*0.07));
    });
    ctx.shadowBlur=0;
  }

  // DIVIDER
  if(_dividerW > 2){
    ctx.globalAlpha = _headAlpha * 0.7;
    const [r2,g2,b2] = th.ac;
    const lg = ctx.createLinearGradient(cx-_dividerW/2,0,cx+_dividerW/2,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');
    lg.addColorStop(0.5,`rgba(${r2},${g2},${b2},0.85)`);
    lg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=lg;
    ctx.fillRect(cx-_dividerW/2, H*0.54, _dividerW, 1.5);
  }

  // BODY TEXT
  if(_bodyAlpha > 0){
    ctx.globalAlpha = _bodyAlpha;
    const bSize = Math.max(15, Math.min(W*0.048, 28));
    ctx.font = `300 ${bSize}px 'Noto Sans Arabic',sans-serif`;
    ctx.textBaseline = 'middle';
    const lines = wrapText(ctx, _card.b, maxW);
    const lh = bSize * 1.9;
    const totalH = lines.length * lh;
    const startY = H*0.63 - totalH/2 + lh/2;
    lines.forEach((ln,i)=>{
      ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=10;
      drawOT(ctx, ln, cx, startY+i*lh, th.bodyCol, 'rgba(0,0,0,0.35)', Math.max(1, bSize*0.055));
    });
    ctx.shadowBlur=0;
  }

  // CTA
  if(_ctaAlpha > 0){
    ctx.globalAlpha = _ctaAlpha * 0.7;
    const cSize = Math.max(10, W*0.028);
    ctx.font = `600 ${cSize}px 'Noto Sans Arabic',sans-serif`;
    ctx.textBaseline = 'middle';
    const [r2,g2,b2] = th.ac;
    ctx.fillStyle = `rgba(${r2},${g2},${b2},0.85)`;
    ctx.shadowBlur=0;
    ctx.fillText(_cta, cx, H*0.91);
    // pulsing dot
    const pulse = 0.5+Math.sin(_t*3)*0.4;
    ctx.globalAlpha = _ctaAlpha * pulse * 0.8;
    ctx.beginPath();
    ctx.arc(cx - ctx.measureText(_cta).width/2 - 10, H*0.91, 3, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${r2},${g2},${b2},1)`;
    ctx.fill();
  }

  ctx.restore();
}

// ══════════════════════════════════════
// SCENE TRIGGER
// ══════════════════════════════════════
function showScene(){
  nextTheme();
  _card = nextCard();
  _cta = CTAS[Math.floor(Math.random()*CTAS.length)];
  _pillarAlpha = 0; _headAlpha = 0; _dividerW = 0; _bodyAlpha = 0; _ctaAlpha = 0;
  _phase = 'animating';
  _phaseT = 0;
}

// ══════════════════════════════════════
// ANIMATION LOOP
// ══════════════════════════════════════
const TARGET_DIV_W = Math.min(W*0.3, 100);

function ease(x){ return 1 - Math.pow(1-Math.min(1,x), 3); }

let _lastFrame = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts - _lastFrame)/1000, 0.05);
  _lastFrame = ts;
  _t += dt;

  if(_phase === 'animating'){
    _phaseT += dt;
    // 0.0 - 0.5: pillar fades in
    _pillarAlpha = ease(Math.min(1, _phaseT / 0.5));
    // 0.3 - 1.0: headline fades in
    _headAlpha = ease(Math.max(0, Math.min(1, (_phaseT-0.3)/0.7)));
    // 1.0 - 1.8: divider grows
    _dividerW = ease(Math.max(0, Math.min(1, (_phaseT-1.0)/0.8))) * TARGET_DIV_W;
    // 1.6 - 2.6: body fades in
    _bodyAlpha = ease(Math.max(0, Math.min(1, (_phaseT-1.6)/1.0)));
    // 2.6 - 3.2: cta fades in
    _ctaAlpha = ease(Math.max(0, Math.min(1, (_phaseT-2.6)/0.6)));
    if(_phaseT > 3.2) _phase = 'idle';
  }

  if(_card) draw();
}

// ══════════════════════════════════════
// AUDIO
// ══════════════════════════════════════
const AC = new (window.AudioContext||window.webkitAudioContext)();
const master = AC.createGain(); master.gain.value=0.65; master.connect(AC.destination);
let _recDest=null, _audioOn=false, _pads=[];
function unlockAC(){ if(_audioOn)return; AC.resume().then(()=>{ _audioOn=true; startPad(); }); }
function startPad(){
  stopPad();
  try{[220,277.18,329.63,369.99].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
    o.type='sine';o.frequency.value=f;lfo.type='sine';lfo.frequency.value=.05+i*.012;lg.gain.value=.7;
    lfo.connect(lg);lg.connect(o.frequency);
    const tt=AC.currentTime;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.016-i*.002,tt+3);
    o.connect(g);g.connect(master);o.start(tt);lfo.start(tt);_pads.push({o,g,lfo});
  });}catch(e){}
}
function stopPad(){ _pads.forEach(p=>{try{p.g.gain.setTargetAtTime(0,AC.currentTime,.5);setTimeout(()=>{try{p.o.stop();p.lfo.stop();}catch(e){}},1200);}catch(e){}});_pads=[]; }

// ══════════════════════════════════════
// RECORDING
// ══════════════════════════════════════
let _compC=null,_compCtx=null;
window._recActive=false; window._recordingDone=false; window._recordingBlob=null;
let _recChunks=[],_recorder=null;

window.startRecording=function(fps){
  fps=fps||30;
  try{
    AC.resume().catch(()=>{});
    // record directly from main canvas — no composite needed since everything is on canvas
    window._recActive=true; window._recordingDone=false; _recChunks=[];
    _recDest=AC.createMediaStreamDestination(); master.connect(_recDest);
    const vs=canvas.captureStream(fps);
    const combined=new MediaStream([...vs.getVideoTracks(),..._recDest.stream.getAudioTracks()]);
    const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    _recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:192000});
    _recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)_recChunks.push(e.data);};
    _recorder.onstop=()=>{
      window._recActive=false;
      try{master.disconnect(_recDest);}catch(e){}
      window._recordingBlob=new Blob(_recChunks,{type:'video/webm'});
      window._recordingDone=true;
    };
    _recorder.start(200);
    console.log('Recording started');
  }catch(e){console.error(e);}
};
window.stopRecording=function(){try{if(_recorder&&_recorder.state!=='inactive')_recorder.stop();}catch(e){}};
window.forceFinalize=function(){
  window._recActive=false;
  if(_recChunks.length>0&&!window._recordingDone){
    window._recordingBlob=new Blob(_recChunks,{type:'video/webm'});window._recordingDone=true;
  }
};
window.getRecordingBase64=function(){
  return new Promise((resolve,reject)=>{
    const chk=()=>{
      if(!window._recordingBlob){setTimeout(chk,100);return;}
      const r=new FileReader();
      r.onloadend=()=>resolve(r.result.split(',')[1]);
      r.onerror=reject; r.readAsDataURL(window._recordingBlob);
    };chk();
  });
};

// ── BOOT ──
window.addEventListener('resize',()=>{
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W; canvas.height=H;
  THEMES.forEach(th=>{if(th.init)th.init(W,H);});
});
document.body.addEventListener('click',()=>{ unlockAC(); showScene(); });
document.body.addEventListener('touchend',e=>{ e.preventDefault(); unlockAC(); showScene(); },{passive:false});

showScene();
requestAnimationFrame(loop);
window.AC=AC; window.master=master;
})();
</script>
